    return '<button class="sch'+(s.an?" an":"")+'" data-sch="'+s.k+'">'+esc(s.t)+'</button>'; }).join("")+'</div>';
}

function zeichneVoll(){
  var k = UI.kz, kz = KZ()[k], h = "";
  /* Eine Kennzahl, die es nicht mehr gibt - etwa weil UI.kz noch auf eine abgeraeumte
     Reihe zeigt -, fuehrt zurueck auf die Kachelwand statt in einen Absturz. */
  if(!kz){ UI.seite = "wand"; UI.kz = null; return zeichneWand(); }
  /* EIN Zeitraum fuer alles auf dieser Seite: Kopfzahl, Satz, Bild, Bildunterschrift und
     jede Nebenzahl. Der Bezug steht ausgeschrieben dabei - eine Zahl mit einem anderen
     Bezug als die daneben ist der Fehler, den dieser Umbau abschafft. */
  var f = fenster(k), fl = fensterLang(f);
  var kopfWert = kz.wert, kopfEinheit = kz.einheit, satz = "", inhalt = "", neben = [], schalter = null;
  var th = STATE.glucose.th||{};

  if(k==="gewicht"){
    var Gall=rGewicht(), G=imFenster(Gall,f), w=STATE.weight||{};
    if(!G.length){ kopfWert = "—"; kopfEinheit = "kg · "+fl; satz = LEER_ZEITRAUM; }
    else{
      var g0=G[0], gL=G[G.length-1];
      var tF = tempo(G), bmi = w.heightCm ? gL.v/Math.pow(w.heightCm/100,2) : null;
      var rest = w.goal1!=null ? gL.v-w.goal1 : null;
      kopfWert = nf(gL.v,1);
      kopfEinheit = "kg · zuletzt "+dm(gL.iso);
      satz = "Im Zeitraum "+fl+" liegen "+zahl(G.length,"Messung","Messungen")+": von "+nf(g0.v,1)
        + " auf "+nf(gL.v,1)+" kg, "+vz(gL.v-g0.v,1)+" kg."
        + (tF!=null ? " Das Tempo "+fl+" liegt bei "+vz(tF,2)+" kg je Woche" : "")
        + (tF!=null && rest!=null && tF<0
            ? "; bei diesem Tempo sind die "+nf(rest,1)+" kg bis Ziel 1 in gut "
              + Math.round(Math.abs(rest/tF))+" Wochen erreicht. Ein Datum nennt das Werkzeug bewusst nicht."
            : (tF!=null ? "." : ""));
      inhalt = bild([{pts:G, farbe:"var(--good)", r:3, name:"Gewicht"}], {dez:1, einheit:"kg",
        text:"Alle "+zahl(G.length,"Messpunkt","Messpunkte")+" "+fl+" auf echter Zeitachse."
          + (w.goal1!=null ? " Ziel 1 liegt bei "+nf(w.goal1,0)+" kg und damit unter dem Bildausschnitt." : "")});
      neben = [ {l:"Im Zeitraum", w:nf(g0.v,1)+" → "+nf(gL.v,1), u:zahl(G.length,"Messung","Messungen")+" · kg"},
        {l:"Veränderung", w:vz(gL.v-g0.v,1), u:"kg "+fl, f:(gL.v<g0.v?"var(--good)":null)},
        {l:"BMI", w:nf(bmi,1), u:(w.heightCm||"—")+" cm · Stand "+dm(gL.iso)},
        {l:"Ø Tempo", w:tF!=null?vz(tF,2):"—", u:"kg je Woche "+fl},
        {l:"Abstand zu Ziel 1", w:rest!=null?nf(rest,1):"—", u:"kg · Ziel "+nf(w.goal1,0)+" kg"} ];
    }
  }

  /* Der THQ hat ein eigenes Vollbild, weil er eine eigene Frage beantwortet: nicht «wie
     viel», sondern «wo». Alle Zahlen hier kommen aus rKoerper() - gerechnet wird an dieser
     Stelle nichts nach. */
  if(k==="thq"){
    var KK = imFenster(rKoerper(), f);
    if(!KK.length){ kopfWert = "—"; kopfEinheit = "Taille ÷ Hüfte · "+fl; satz = LEER_ZEITRAUM; }
    else{
      var k0=KK[0], kLetzt=KK[KK.length-1], kVor=KK.length>1?KK[KK.length-2]:null;
      var dq = kVor ? kLetzt.v-kVor.v : null;
      kopfWert = nf(kLetzt.v,2);
      kopfEinheit = "Taille ÷ Hüfte · zuletzt "+dm(kLetzt.iso);
      satz = "Taille geteilt durch Hüfte. Die Zahl sagt, wo das Gewicht sitzt — sie kann steigen, "
        + "während das Gewicht fällt; dann hat die Hüfte prozentual mehr verloren als die Taille. "
        + "Beim Mann gilt "+nf(THQ_GRENZE,1)+" als Grenze, ab der Bauchfett als Risiko eingestuft wird; sie liegt "
        + "als gestrichelte Linie im Bild. Gezeigt sind "+zahl(KK.length,"Messung","Messungen")+" "+fl
        + ", zuletzt "+nf(kLetzt.waist,0)+" cm Taille zu "+nf(kLetzt.hip,0)+" cm Hüfte am "+dmy(kLetzt.iso)+".";
      inhalt = bild([{pts:KK, farbe:"var(--akzent)", r:3, dez:2, name:"THQ"}], {dez:2, einheit:"",
        linien:[{v:THQ_GRENZE, label:nf(THQ_GRENZE,2)}],
        sub:function(p){ return "Taille "+nf(p.waist,0)+" · Hüfte "+nf(p.hip,0)
          + (p.chest!=null?" · Brust "+nf(p.chest,0):"")+" cm"; },
        text:"Taille ÷ Hüfte an "+zahl(KK.length,"Messpunkt","Messpunkten")+" "+fl
          + ". Die gestrichelte Linie ist die Grenze "+nf(THQ_GRENZE,2)+"."});
      neben = [ {l:"Zuletzt", w:nf(kLetzt.v,2), u:dmy(kLetzt.iso),
          f:kLetzt.v<THQ_GRENZE?"var(--good)":"var(--warn)"},
        {l:"Taille zu Hüfte", w:nf(kLetzt.waist,0)+" / "+nf(kLetzt.hip,0), u:"cm · Stand "+dm(kLetzt.iso)},
        {l:"Brust", w:kLetzt.chest!=null?nf(kLetzt.chest,0):"—", u:"cm · Stand "+dm(kLetzt.iso)},
        {l:"seit der Messung davor", w:dq==null?"—":(Math.abs(dq)<0.005?"±0,00":vz(dq,2)),
          u:kVor?("davor "+nf(kVor.v,2)+" am "+dm(kVor.iso)):"erst eine Messung in diesem Zeitraum",
          f:(dq!=null && dq<-0.0049)?"var(--good)":((dq!=null && dq>0.0049)?"var(--warn)":null)},
        {l:"Messungen", w:String(KK.length), u:dmy(k0.iso)+" → "+dmy(kLetzt.iso)} ];
    }
  }

  if(k==="bz"){
    /* Verlauf und Tagesmuster sind zwei Blicke auf DIESELBE Auswahl - der Umschalter
       daneben ist etwas anderes als der Zeitraum und bleibt darum stehen. */
    var BZ = imFenster(rBzAlle(), f), BZT = imFenster(rBzTage(), f);
    schalter = [{k:"verlauf", t:"Verlauf", an:UI.bzView==="verlauf"},
      {k:"muster", t:"Tagesmuster", an:UI.bzView==="muster"}];
    if(!BZ.length){ kopfWert = "—"; kopfEinheit = "mmol/l · "+fl; satz = LEER_ZEITRAUM; }
    else{
      var imSoll = BZ.filter(function(x){ return sollTyp(x.slot)==="pre" ? x.v<=th.preHigh : x.v<=th.postHigh; });
      var pSoll = Math.round(100*imSoll.length/BZ.length);
      var unterNorm = BZ.filter(function(x){ return x.v < normFuer(x.slot); });
      var pNorm = Math.round(100*unterNorm.length/BZ.length);
      /* Drei Gruppen statt zwei: «nach Essen» als Gruppe gibt es nicht mehr, und ohne die
         Zeile «vor dem Essen» faehrt der halbe Tag unsichtbar mit. Gefragt wird nicht nach
         der Gruppe, sondern nach sollTyp() - so zaehlt auch ein Altname mit, den keine der
         acht Zeilen traegt. */
      var nue = BZ.filter(function(x){ return x.grp==="nüchtern"; });
      var vorE = BZ.filter(function(x){ return x.grp!=="nüchtern" && sollTyp(x.slot)==="pre"; });
      var post = BZ.filter(function(x){ return sollTyp(x.slot)==="post"; });
      var wV = function(a){ return a.map(function(x){ return x.v; }); };
      var bl = STATE.glucose.baseline, jetztOe = mittel(wV(BZ));
      kopfWert = nf(jetztOe,1);
      kopfEinheit = "mmol/l · Ø "+fl;
      satz = pSoll+" % dieser "+BZ.length+" Messungen liegen im Soll Deiner Therapiegrenzen — vor dem Essen ≤ "
        + nf(th.preHigh,1)+", danach ≤ "+nf(th.postHigh,1)+" mmol/l; "+pNorm+" % liegen sogar unter dem Massstab "
        + "eines Nicht-Diabetikers. Die Fläche im Bild ist der Korridor "+nf(th.critLow,1)+" bis "+nf(th.postHigh,1)
        + ", in dem ein Wert unbedenklich ist; die gestrichelten Linien sind "+nf(NORM.pre,1)+" nüchtern und vor dem "
        + "Essen, "+nf(NORM.post,1)+" zwei Stunden danach. Gezeigt sind die Messungen "+fl+" an "
        + zahl(BZT.length,"Messtag","Messtagen")+".";
      inhalt = UI.bzView==="verlauf"
        ? bild([{pts:BZT, farbe:"var(--akzent)", name:"Ø"}], {dez:1, einheit:"mmol/l",
            zone:[th.critLow, th.postHigh],
            linien:[{v:NORM.pre, label:nf(NORM.pre,1)}, {v:NORM.post, label:nf(NORM.post,1), blass:true}],
            sub:function(p){ return zahl(p.n||1,"Messung","Messungen"); },
            text:"Tagesmittel über "+zahl(BZT.length,"Messtag","Messtage")+" "+fl
              + ". Die Fläche ist der Korridor, die Kanten sind seine Grenzen."})
        : tagesmuster(BZ, th, fl);
      /* a.length && davor ist kein Schmuck: mittel([]) ist null, und «null < 5.6» ist in
         JavaScript WAHR - eine leere Gruppe faerbte sich gruen und meldete einen Erfolg,
         den es nie gab. Ohne Werte gar keine Farbe und «—» als Wert. */
      neben = [ {l:"nüchtern Ø", w:nf(mittel(wV(nue)),1), u:zahl(nue.length,"Messung","Messungen"),
          f:nue.length ? (mittel(wV(nue))<NORM.pre?"var(--good)":"var(--warn)") : null},
        {l:"vor dem Essen Ø", w:nf(mittel(wV(vorE)),1),
          u:zahl(vorE.length,"Messung","Messungen")+" · vor Frühstück, Mittag, Abend",
          f:vorE.length ? (mittel(wV(vorE))<NORM.pre?"var(--good)":"var(--warn)") : null},
        {l:"nach dem Essen Ø", w:nf(mittel(wV(post)),1),
          u:zahl(post.length,"Messung","Messungen")+" · nach Frühstück, Mittag, Abend",
          f:post.length ? (mittel(wV(post))<NORM.post?"var(--good)":"var(--warn)") : null},
        {l:"im Soll der Therapie", w:pSoll+" %", u:imSoll.length+" von "+BZ.length+" "+fl, f:"var(--good)"},
        {l:"unter Nicht-Diabetiker", w:pNorm+" %", u:unterNorm.length+" von "+BZ.length+" "+fl,
          f:pNorm>=70?"var(--good)":"var(--warn)"},
        /* Die Vorperiode ist der Beleg, dass sich etwas geaendert hat - ohne sie ist jede
           Zahl hier nur ein Zustand, kein Weg. */
        {l:"Vorperiode", w:bl?nf(bl.avg,1):"—",
          u:bl?(bl.label?bl.label.replace(/^Vorperiode\s*/,""):"früher")+" · "+fl+" "+nf(jetztOe,1):"kein Vergleichswert",
          f:(bl&&jetztOe<bl.avg)?"var(--good)":"var(--faint)"} ];
    }
  }

  if(k==="bd"){
    var BP = imFenster(rBp(), f);
    if(!BP.length){ kopfWert = "—"; kopfEinheit = "mmHg · "+fl; satz = LEER_ZEITRAUM; }
    else{
      var bpL = BP[BP.length-1];
      var dia = BP.filter(function(p){ return p.dia!=null; }).map(function(p){ return {iso:p.iso, v:p.dia}; });
      var puls = BP.filter(function(p){ return p.pulse!=null; });
      var tageN = Object.keys(BP.reduce(function(m,p){ m[p.iso]=1; return m; },{})).length;
      /* Math.round(null) ist 0 - ohne die Laengenpruefung stuende hier «0/0 mmHg»,
         sobald das Fenster keine diastolische Messung traegt. Das sieht auch der Arzt. */
      var oeS = Math.round(mittel(BP.map(function(p){ return p.v; })));
      var oeD = dia.length ? Math.round(mittel(dia.map(function(p){ return p.v; }))) : null;
      kopfWert = Math.round(bpL.v)+"/"+Math.round(bpL.dia);
      kopfEinheit = "mmHg · zuletzt "+dm(bpL.iso);
      satz = zahl(BP.length,"Messung","Messungen")+" an "+zahl(tageN,"Tag","Tagen")+" "+fl
        + ", im Schnitt "+oeS+"/"+oeD+" mmHg. Die obere Linie ist systolisch, die blasse darunter diastolisch.";
      inhalt = bild([{pts:BP, farbe:"var(--akzent)", name:"systolisch", dez:0},
          {pts:dia, farbe:"var(--zweit)", dick:1.6, r:2.2, name:"diastolisch", dez:0}],
        {dez:0, einheit:"mmHg",
          sub:function(p){ return [p.slot?slotLang(p.slot):"", p.pulse!=null?"Puls "+Math.round(p.pulse):"",
            p.time||""].filter(Boolean).join(" · "); },
          text:"Jede einzelne Messung "+fl+" an ihrem Tag — an manchen Tagen mehrere."});
      neben = [ {l:"Ø "+fl, w:oeS+"/"+oeD, u:zahl(BP.length,"Messung","Messungen")},
        {l:"Puls Ø", w:puls.length?Math.round(mittel(puls.map(function(p){return p.pulse;}))):"—", u:"/min "+fl},
        {l:"Pulsdruck", w:Math.round(bpL.v-bpL.dia), u:"systolisch minus diastolisch · "+dm(bpL.iso)},
        {l:"Messtage", w:tageN, u:zahl(BP.length,"Messung","Messungen")+" "+fl} ];
    }
  }

  return '<div class="buehne">'
    + '<div class="b-kopf"><div style="min-width:0;flex:1 1 260px">'
    +   '<div class="k-name">'+esc(kz.label)+'</div>'
    +   '<div style="display:flex;align-items:baseline;gap:10px;margin-top:7px;flex-wrap:wrap">'
    +     '<div class="b-zahl" style="white-space:nowrap;color:'+kz.zustand+'">'+kopfWert+'</div>'
    +     '<div class="k-einheit">'+esc(kopfEinheit)+'</div></div></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">'
    +   (FROZEN?'':'<button class="btn stark" id="btnErf2">✎ Erfassen</button>')
    +   '<button class="btn rund" data-zu="1">×</button></div></div>'
    + '<p class="satz">'+esc(satz)+'</p>'
    + zeitschalterHtml(k)
    + (schalter?schalterHtml(schalter):"")
    + inhalt
    + (neben.length?nebenHtml(neben):"")
    + '</div>';
}

/* Tagesmuster: eine Zeile je Messpunkt — acht, in der Reihenfolge des Tages. Die Achse
   reicht von der Untergrenze des Korridors bis über seine Oberkante, sonst läge die Kante
   ausserhalb des Bildes.
   Der alte Einwand gegen viele Messpunkte war statistisch und richtig: mit 6 oder 8 Werten
   trägt ein Quartilkasten nichts, er wackelt bei jeder neuen Messung. Beantwortet wird er
   hier, nicht durch Weglassen des Messpunkts: die FORM der Zeile hängt an der Zahl der
   Werte. Unter zehn Werten steht kein Kasten, unter fünf stehen die Werte selbst als
   Punkte. Was zu dünn für eine Verteilung ist, wird als Einzelwert gezeigt — und nicht
   als Verteilung behauptet.
   Leere Zeilen bleiben STEHEN. Die Reihenfolge der acht Zeilen ist der Tagesverlauf; fällt
   eine heraus, liest das Auge die Form des Tages falsch — «nach dem Frühstück» rutschte
   dorthin, wo «vor dem Frühstück» gehört. Eine leere Zeile trägt darum ein halbhohes Bett
   und den Vermerk «noch keine Messung», neutral und ohne Aufforderung.
   Die Achsenleiste steht zweimal, über und unter dem Block: bei acht Zeilen wäre die
   untere sonst 500 px von der ersten Zeile entfernt. Kein position:sticky — der Block wird
   bei jedem zeichne() neu gebaut und hat keinen eigenen Scroll-Container. */
function tagesmuster(BZ, th, fl){
  var v = BZ.map(function(x){return x.v;});
  if(!v.length) return '<div class="bildtext">Noch nicht gemessen.</div>';
  var lo = Math.min(th.critLow!=null?th.critLow:3, Math.min.apply(null,v));
  var hi = Math.max(Math.max.apply(null,v), th.postHigh||10, NORM.post) + 1;
  var sp = (hi-lo)||1;
  function pc(x){ return ((x-lo)/sp)*100; }
  function q(a,p){ var s=a.slice().sort(function(x,y){return x-y;}), i=(s.length-1)*p;
    return s[Math.floor(i)]+(s[Math.ceil(i)]-s[Math.floor(i)])*(i-Math.floor(i)); }
  /* Korridorflaeche und Normkante trägt JEDE Zeile, auch die leere - sie sind der
     Massstab, nicht die Messung, und ohne sie stünde die leere Zeile massstabslos da. */
  function bett(soll, hoehe, inneres){
    return '<div style="position:relative;height:'+hoehe+'px;background:var(--surface2);border-radius:7px">'
      + '<div style="position:absolute;top:0;bottom:0;left:'+pc(lo).toFixed(1)+'%;width:'+(pc(th.postHigh||10)-pc(lo)).toFixed(1)+'%;background:var(--zone);border-left:1px solid var(--zone-kante);border-right:1px solid var(--zone-kante)"></div>'
      + '<div style="position:absolute;top:0;bottom:0;left:'+pc(soll).toFixed(1)+'%;border-left:1.4px dashed var(--warn)"></div>'
      + inneres + '</div>';
  }
  var achse = '<div class="mono" style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)">'
    + '<span>'+nf(lo,1)+'</span><span>mmol/l</span><span>'+nf(hi,1)+'</span></div>';
  /* Die acht Zeilen und - nur wenn sie etwas trägt - eine neunte für alles, dessen
     Messpunkt sich nicht zuordnen lässt. Sie wird nicht erfunden, sie wird gezeigt. */
  var reihen = SLOT8.map(function(g){
    return { lang:g.lang, hint:g.hint, soll:g.t==="pre"?NORM.pre:NORM.post,
      a:BZ.filter(function(x){ return x.grp===g.k; }).map(function(x){ return x.v; }) };
  });
  var ohne = BZ.filter(function(x){ return x.grp==null; });
  if(ohne.length) reihen.push({ lang:"ohne Zuordnung",
    hint:"aus einem Messpunkt, den es so nicht mehr gibt — gezählt, aber nicht einsortiert",
    soll:NORM.post, a:ohne.map(function(x){ return x.v; }) });

  var h = '<div style="display:flex;flex-direction:column;gap:12px;margin-top:20px">' + achse;
  reihen.forEach(function(g){
    var a = g.a, n = a.length, soll = g.soll;
    /* Der Zeilenkopf darf UMBRECHEN. Die Zahlenangabe rechts traegt white-space:nowrap -
       ohne Umbruch nimmt sie sich auf dem Telefon ihre volle Breite und laesst dem
       Etikett links so wenig, dass der Hinweis Wort fuer Wort untereinander steht und
       eine Zeile viermal so hoch wird. Mit Umbruch rutscht die Zahlenangabe unter das
       Etikett, sobald es eng wird, und der Hinweis liest sich wieder als Satz. */
    var kopf = '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:2px 12px;flex-wrap:wrap;margin-bottom:6px">'
      + '<div style="min-width:0;flex:1 1 220px"><span style="font-size:15px;font-weight:620">'+esc(g.lang)+'</span>'
      +   '<span style="font-size:12px;color:var(--faint);margin-left:9px">'+esc(g.hint)+'</span></div>';
    if(!n){
      h += '<div>'+kopf+'<div class="mono" style="font-size:11px;color:var(--faint);white-space:nowrap">noch keine Messung</div></div>'
        + bett(soll, 16, '') + '</div>';
      return;
    }
    var mn=Math.min.apply(null,a), mx=Math.max.apply(null,a), md=q(a,.5);
    var rechts = zahl(n,"Wert","Werte")
      + (n>=5 ? ' · Median '+nf(md,1) : '')
      + ' · '+nf(mn,1)+' bis '+nf(mx,1);
    var innen = "";
    if(n<=4){
      /* Bis vier Werte: die Werte selbst. Ein Kasten aus drei Zahlen behauptet eine
         Verteilung, die es nicht gibt - vier Punkte behaupten nichts. */
      innen = a.map(function(x){
        return '<div style="position:absolute;top:10px;width:6px;height:6px;border-radius:50%;margin-left:-3px;'
          + 'background:var(--akzent);left:'+pc(x).toFixed(1)+'%"></div>'; }).join("");
    } else {
      innen = '<div style="position:absolute;top:12px;height:2px;left:'+pc(mn).toFixed(1)+'%;width:'+Math.max(0.6,pc(mx)-pc(mn)).toFixed(1)+'%;background:var(--faint);border-radius:2px"></div>';
      /* Erst ab zehn Werten ein Kasten: darunter verschiebt ihn jede einzelne neue
         Messung sichtbar, und eine Zeile, die bei jeder Messung wackelt, wird gelesen
         als hätte sich etwas geändert. */
      if(n>=10) innen += '<div style="position:absolute;top:5px;height:16px;left:'+pc(q(a,.25)).toFixed(1)+'%;width:'+Math.max(0.8,pc(q(a,.75))-pc(q(a,.25))).toFixed(1)+'%;background:rgba(143,184,232,.28);border-radius:4px"></div>';
      innen += '<div style="position:absolute;top:3px;height:20px;width:2px;left:'+pc(md).toFixed(1)+'%;background:var(--ink)"></div>';
    }
    h += '<div>'+kopf
      + '<div class="mono" style="font-size:11px;color:var(--faint);white-space:nowrap">'+esc(rechts)+'</div></div>'
      + bett(soll, 26, innen) + '</div>';
  });
  h += achse + '</div>'
    /* Auch das Tagesmuster folgt dem Zeitraum. Im Vier-Wochen-Fenster erreicht keine Gruppe
       zehn Werte - dort steht dann kein Kasten, sondern Median und Spanne. Das ist gewollt:
       die Form der Zeile haengt an der Zahl der Werte, und die haengt am Fenster. */
    + '<div class="bildtext">Alle '+zahl(BZ.length,"Messung","Messungen")+' '+(fl||"")+'. '
    + 'Kasten = mittlere Hälfte, heller Strich = Median, feine Linie = Spanne. '
    + 'Wo weniger als zehn Werte vorliegen, steht statt des Kastens nur Median und Spanne; bei bis zu vier '
    + 'Werten stehen die Werte selbst. Die Fläche ist der Korridor '+nf(lo,1)+' bis '+nf(th.postHigh||10,1)
    + ', die gestrichelte Kante der Massstab eines Nicht-Diabetikers für diesen Messpunkt.</div>';
  return h;
}

/* ══ Ebene 3 · Akten ════════════════════════════════════════════════════════════
   Hier ist Vollstaendigkeit der Zweck. Fuenf Abschnitte, links der Inhalt, rechts
   die Auswahl - man geht selten hin und liest dann lange. */

function zeigeDocs(){ return !(STATE.__export && STATE.__export.docPaths===false); }
/* Wurde die Arztkopie OHNE Notizen erzeugt, traegt die Spalte «Notiz» nie etwas - dann
   faellt sie weg, in Tabelle und CSV, Kopf und Zellen im selben Zug. Eine Spalte, die in
   jeder Zeile leer ist, kostet nur Platz. Mit eingeschalteten Notizen bleibt sie, und
   ausserhalb einer Arztkopie gibt es sie ohnehin immer. */
function zeigeNotizen(){ return !(STATE.__export && STATE.__export.notizen===false); }
function docsBlock(docs){
  if(!docs || !docs.length || !zeigeDocs()) return "";
  return '<div class="docs"><div class="liste-kopf" style="border:none;padding:0 0 10px">Dokumente zu diesem Blatt</div>'
    + docs.map(function(d){
        return '<div style="margin-bottom:8px">'
          + (d.url ? '<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.title||"Dokument")+'</a>'
                   : esc(d.title||"Dokument"))
          + (d.desc?'<div style="font-size:13px;color:var(--faint);margin-top:2px">'+esc(d.desc)+'</div>':'')
          + '</div>'; }).join("")
    + '</div>';
}
function docsAm(docs){
  if(!docs || !docs.length || !zeigeDocs()) return "";
  return '<div style="margin-top:6px;font-size:13px">'+docs.map(function(d){
    return d.url ? '<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.title||"Dokument")+'</a>' : esc(d.title||"");
  }).join(" · ")+'</div>';
}

/* Balken statt Linie: bei einer Akte ist die Frage nicht «welcher Wert», sondern «wie viel
   liegt in welchem Jahr». Leere Jahre bleiben leer - die Lücke ist die Aussage. */
function balkenSvg(vals, w, h, farbe, marken){
  var mx = Math.max.apply(null, vals.concat([1])), n = vals.length, gap = 2;
  var bw = (w-(n-1)*gap)/n, s = "";
  vals.forEach(function(v,i){
    var bh = v ? Math.max(2, v/mx*h) : 0;
    if(!bh) return;
    var id = marken ? tipReg(marken(i,v)) : null;
    s += '<rect x="'+(i*(bw+gap)).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)
      + '" fill="'+farbe+'" opacity=".72"></rect>';
    if(id) s += '<rect class="hit" data-tip="'+id+'" data-nurhover="1" x="'+(i*(bw+gap)).toFixed(1)+'" y="0" width="'
      + bw.toFixed(1)+'" height="'+h+'"></rect>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px;display:block;margin-top:12px">'+s+'</svg>';
}
function jahreReihe(isos){
  var js = isos.map(function(x){ return +String(x||"").slice(0,4); }).filter(function(y){ return y>1900; });
  if(!js.length) return {von:null, bis:null, vals:[]};
  var von=Math.min.apply(null,js), bis=Math.max.apply(null,js), vals=[];
  for(var y=von;y<=bis;y++) vals.push(js.filter(function(x){ return x===y; }).length);
  return {von:von, bis:bis, vals:vals};
}

/* Erst die Kachelwand: dieselbe Anatomie wie «Heute» - Zahl, Untertitel, Bild, Fusszeile.
   Der Untertitel trägt das oberste Blatt, nicht bloss die Anzahl: die Kachel beantwortet
   damit beides, «wie viel liegt hier» und «muss ich hinein». */
function aktenUebersicht(){
  var PA = (STATE.lab.panels||[]).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var EV = (STATE.history.events||[]).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var P = STATE.lab.params||[], meds = (STATE.meds&&STATE.meds.liste)||[];
  var flagsN = PA.reduce(function(n,p){ return n+Object.keys(p.flags||{}).length; }, 0);
  var pL = PA.length?PA[PA.length-1]:null;
  var lj = jahreReihe(PA.map(function(p){ return p.date; }));

  /* HbA1c ist die Reihe, die die Laborakte erzählt - darum steht sie in der Leitkachel. */
  var hb = PA.filter(function(p){ return p.values && p.values.hba1c!=null; })
    .map(function(p){ return {iso:p.date, v:+p.values.hba1c}; });
  var hbF = P.filter(function(x){ return x.key==="hba1c"; })[0];

  var pFlags = pL ? Object.keys(pL.flags||{}) : [];
  var pNamen = pFlags.map(function(k){ var f=P.filter(function(x){return x.key===k;})[0]; return f?f.label:k; });
  var labUnter = pL
    ? "Zuoberst "+dmy(pL.date)+(pL.source?", "+pL.source:"")
      + (pNamen.length ? " — "+pNamen.slice(0,2).join(" und ")+(pNamen.length>2?" und "+(pNamen.length-2)+" weitere":"")+" markiert" : " — kein Wert markiert")
    : "Noch kein Laborblatt erfasst.";

  /* Zuoberst heisst: das jüngste VERGANGENE. Ein Termin im September ist Zukunft und
     kein Befund - er gehört in die Statuszeile, nicht auf das Deckblatt der Akte. */
  var evVergangen = EV.filter(function(e){ return ms(e.date)<=heuteMs(); });
  var eL = evVergangen.length?evVergangen[evVergangen.length-1]:null;
  var ej = jahreReihe(EV.map(function(e){ return e.date; }));
  var arten = Object.keys(EV.reduce(function(m,e){ if(e.kind) m[e.kind]=1; return m; },{})).length;

  var mStand = STATE.meds&&STATE.meds.stand;
  var mAlter = mStand ? Math.round(tage(mStand)/30.4) : null;
  var taeglich = meds.filter(function(m){ return /^\s*\d\s*[–-]/.test(m.dosis||""); }).length;
  var reserve = meds.filter(function(m){ return /^\s*i\.\s*R\.?/i.test(m.dosis||""); }).length;
  var sonst = meds.length - taeglich - reserve;

  var RT = rohTage();
  var rj = jahreReihe(RT.map(function(z){ return z.iso; }));
  /* Die Kachel spricht wie ihre Nachbarn: was zuoberst in der Tabelle steht, und davon
     nur das, was an diesem Tag wirklich vorliegt. */
  var rZ = RT[0], rTeile = [];
  if(rZ){
    if(rZ.gw!=null) rTeile.push(nf(rZ.gw,1)+" kg");
    if(rZ.bz!=null) rTeile.push("Blutzucker "+nf(rZ.bz,1));
    if(rZ.bp) rTeile.push("Blutdruck "+rZ.bp.join(" · "));
  }

  var h = '<div class="buehne">'
    + '<div class="b-kopf"><div><div class="k-name">Akten</div>'
    +   '<div style="font-size:24px;font-weight:640;letter-spacing:-.02em;margin-top:6px">Was liegt hier</div></div>'
    + '<button class="btn rund no-print" data-zu="1">×</button></div>'
    + '<div class="wand" style="margin-top:20px">';

  /* Leitkachel Labor */
  h += '<button class="kachel leit" data-akte="labor">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">'
    +   '<div class="k-name">Labor</div>'
    +   '<div class="k-meta" style="margin:0">'+P.length+' Parameter'+(lj.von?' · '+lj.von+'–'+lj.bis:'')+'</div></div>'
    + '<div class="k-reihe"><div class="k-zahl">'+PA.length+'</div><div class="k-einheit">Blätter</div>'
    +   (flagsN?'<div style="font-size:16px;color:var(--warn);font-weight:600;margin-left:6px">'+flagsN+' markierte Werte</div>':'')
    + '</div>'
    + '<div class="k-unter">'+esc(labUnter)+'</div>'
    + (hb.length>1
        /* In der Akte laeuft die Linie durch: zwischen zwei Laborterminen liegen Jahre, und
           eine Reihe aus lauter Bruchstuecken erzaehlt nichts. Die Luecke steht in den
           Jahresbalken der anderen Kacheln, wo sie die Aussage IST. */
        ? funkeSvg(funke(hb, "var(--akzent)", 700, 90, {voll:1e9}), 700, 90,
            funkeHits(hb, 700, 90, {dez:1, einheit:hbF?hbF.unit:"%", sub:function(){ return "HbA1c"; }}))
          + '<div class="bildtext">HbA1c über '+hb.length+' Blätter, '+dmy(hb[0].iso)
          + ' bis '+dmy(hb[hb.length-1].iso)+' — die Reihe, die diese Akte erzählt.</div>'
        : '')
    + '</button>';

  h += '<div class="kacheln">';

  h += '<button class="kachel" data-akte="history">'
    + '<div class="k-name">Krankengeschichte</div>'
    + '<div class="k-reihe"><div class="k-zahl">'+EV.length+'</div><div class="k-einheit">Einträge</div></div>'
    + '<div class="k-unter">'+esc(eL ? "Zuoberst "+dmy(eL.date)+" — «"+(eL.title||"ohne Titel")+"»" : "Noch kein Eintrag.")+'</div>'
    + (ej.vals.length>1 ? balkenSvg(ej.vals, 260, 46, "var(--akzent)", function(i,v){
        return {tag:String(ej.von+i), wert:String(v), einheit:v===1?"Eintrag":"Einträge", sub:"", notiz:""}; }) : '')
    + '<div class="k-meta">'+(ej.von?ej.von+'–'+ej.bis+' · ':'')+zahl(arten,"Art","Arten")+'</div></button>';

  h += '<button class="kachel" data-akte="meds">'
    + '<div class="k-name">Medikation</div>'
    + '<div class="k-reihe"><div class="k-zahl">'+meds.length+'</div><div class="k-einheit">Präparate</div></div>'
    + '<div class="k-unter">'+esc(mStand
        ? "Plan vom "+dmy(mStand)+" — seit "+mAlter+" Monaten unverändert"
        : "Kein Stand vermerkt.")+'</div>'
    + '<div style="height:46px;margin-top:12px;display:flex;align-items:flex-end;gap:5px">'
    +   [].concat(
          Array.apply(null,Array(taeglich)).map(function(){ return '<div style="flex:1;height:18px;background:var(--akzent);opacity:.72;border-radius:2px"></div>'; }),
          Array.apply(null,Array(sonst>0?sonst:0)).map(function(){ return '<div style="flex:1;height:18px;background:var(--zweit);opacity:.5;border-radius:2px"></div>'; }),
          Array.apply(null,Array(reserve)).map(function(){ return '<div style="flex:1;height:18px;border:1px dashed var(--faint);border-radius:2px"></div>'; })
        ).join("")
    + '</div>'
    + '<div class="k-meta">'+taeglich+' täglich'+(sonst>0?' · '+sonst+' nach Plan':'')+(reserve?' · '+reserve+' in Reserve':'')+'</div></button>';

  h += '<button class="kachel" data-akte="roh">'
    + '<div class="k-name">Rohdaten</div>'
    + '<div class="k-reihe"><div class="k-zahl">'+RT.length+'</div><div class="k-einheit">Messtage</div></div>'
    + '<div class="k-unter">'+esc(rZ
        ? "Zuoberst "+dmy(rZ.iso)+(rTeile.length?" — "+rTeile.join(" · "):"")
        : "Noch kein Messtag.")+'</div>'
    + (rj.vals.length>1 ? balkenSvg(rj.vals, 260, 46, "var(--akzent)", function(i,v){
        return {tag:String(rj.von+i), wert:String(v), einheit:v===1?"Messtag":"Messtage", sub:"", notiz:""}; }) : '')
    + '<div class="k-meta">'+(rj.von?'seit '+rj.von+' · ':'')+'CSV-Export</div></button>';

  return h + '</div></div></div>';
}

/* Der Rahmen: Inhalt links, Auswahl rechts — und rechts stehen die BLÄTTER, nicht die
   Bereiche. Ein Laborblatt, ein Jahr, eine Woche. Darum haengen die Dokumente am Blatt. */
function aktenRahmen(o){
  return '<div class="buehne">'
    + '<div class="b-kopf"><div style="min-width:0;flex:1 1 260px">'
    +   '<div class="k-name">Akten · '+esc(o.bereich)+'</div>'
    +   '<div style="font-size:24px;font-weight:640;letter-spacing:-.02em;margin-top:6px">'+esc(o.titel)+'</div>'
    +   (o.untertitel?'<div style="font-size:13.5px;color:var(--faint);margin-top:4px">'+esc(o.untertitel)+'</div>':'')
    + '</div><div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">'+(o.aktion||"")
    +   '<button class="btn rund" data-zu="akten">×</button></div></div>'
    + (o.ansichten||"")
    + '<div class="ts"><div class="ts-links">'+o.links+'</div>'
    + (o.liste ? '<div class="ts-rechts no-print"><div class="liste-kopf">'+esc(o.listeKopf||"")+'</div>'
        + '<div class="liste-roll">'+o.liste+'</div></div>' : '')
    + '</div></div>';
}
function lz(label, sub, an, attr){
  return '<button class="lz'+(an?" an":"")+'" '+attr+'><span>'+esc(label)+'</span><i>'+esc(sub||"")+'</i></button>';
}
function schalter(items){
  return '<div class="akten-liste no-print">'+items.map(function(s){
    return '<button class="sch'+(s.an?" an":"")+'" data-sicht="'+s.k+'">'+esc(s.t)+'</button>'; }).join("")+'</div>';
}

function zeichneAkten(){
  if(!UI.akte) return aktenUebersicht();
  if(UI.akte==="labor")   return akteLabor();
  if(UI.akte==="history") return akteHistory();
  if(UI.akte==="meds")    return akteMeds();
  if(UI.akte==="roh")     return akteRoh();
  return aktenUebersicht();
}

function akteLabor(){
  var P = STATE.lab.params||[];
  var PA = (STATE.lab.panels||[]).slice().sort(function(a,b){ return a.date<b.date?1:-1; });
  if(!PA.length) return aktenRahmen({bereich:"Labor", titel:"Noch keine Laborblätter", links:'<p class="satz">Sobald ein Blatt erfasst ist, steht es hier.</p>'});
  var sicht = UI.sicht || "blatt";
  var ans = schalter([ {k:"blatt", t:"Ein Blatt", an:sicht==="blatt"},
    {k:"verlauf", t:"Ein Wert über die Jahre", an:sicht==="verlauf"} ]);

  if(sicht==="blatt"){
    var i = Math.min(UI.blatt||0, PA.length-1), p = PA[i]||{}, vals = p.values||{}, refs = p.refs||{};
    var grp = {};
    P.forEach(function(pa){ if(vals[pa.key]==null) return;
      (grp[pa.group||"Übrige"] = grp[pa.group||"Übrige"]||[]).push(pa); });
    var links = '<div class="blatt">';
    Object.keys(grp).forEach(function(g){
      links += '<div class="bz-row grp"><div>'+esc(g)+'</div><div></div><div></div></div>';
      grp[g].forEach(function(pa){
        var v = vals[pa.key], ref = refs[pa.key] || pa.ref;
        var kl = ref ? (v>ref[1] ? "hoch" : (v<ref[0] ? "tief" : "")) : "";
        links += '<div class="bz-row"><div>'+esc(pa.label)
          + (pa.unit?' <span style="color:var(--faint)">'+esc(pa.unit)+'</span>':'')+'</div>'
          + '<div class="w '+kl+'">'+nf(v, Math.abs(v)>=100?0:1)+'</div>'
          + '<div class="r">'+(ref?nf(ref[0],1)+"–"+nf(ref[1],1):"—")+'</div></div>';
      });
    });
    links += '</div><div class="bildtext">Rot heisst über dem Referenzbereich dieses Blattes, blau darunter. '
      + 'Die Grenzen rechts stammen aus dem Blatt selbst, nicht aus einer allgemeinen Tabelle.</div>'
      + docsBlock(p.docs);
    return aktenRahmen({ bereich:"Labor", titel:"Laborblatt "+dmy(p.date),
      untertitel:(p.source||"Quelle nicht vermerkt")+" · "+zahl(Object.keys(vals).length,"Wert","Werte"),
      ansichten:ans, links:links, listeKopf:PA.length+" Laborblätter",
      liste:PA.map(function(x,n){
        return lz(dmy(x.date), (x.docs&&x.docs.length?"PDF ":"")+Object.keys(x.values||{}).length,
          n===i, 'data-blatt="'+n+'"'); }).join("") });
  }

  /* Ein Wert über die Jahre — die Frage, für die ein Laborarchiv da ist. Ueber 400 Tage
     ohne Messung wird die Linie fein gestrichelt: zwischen zwei Blättern liegen Jahre. */
  var mit = P.map(function(pa){
    var pts = PA.filter(function(p){ return p.values && p.values[pa.key]!=null; })
      .map(function(p){ return {iso:p.date, v:+p.values[pa.key], ref:(p.refs&&p.refs[pa.key])||pa.ref}; })
      .sort(function(a,b){ return a.iso<b.iso?-1:1; });
    return {pa:pa, pts:pts};
  }).filter(function(x){ return x.pts.length>=3; });
  if(!mit.length) return aktenRahmen({bereich:"Labor", titel:"Kein Wert mit genug Messungen",
    ansichten:ans, links:'<p class="satz">Für einen Verlauf braucht es denselben Wert auf mindestens drei Blättern.</p>'});
  var aktiv = UI.wahl || mit[0].pa.key;
  var cur = mit.filter(function(x){ return x.pa.key===aktiv; })[0] || mit[0];
  var pts = cur.pts, ref = pts[pts.length-1].ref, le = pts[pts.length-1];
  var chips = '<div class="akten-liste no-print">'+mit.map(function(x){
      return '<button class="sch'+(x.pa.key===cur.pa.key?" an":"")+'" data-wahl="'+x.pa.key+'" '
        + 'style="font-size:12.5px;padding:6px 11px">'+esc(x.pa.label)+'</button>'; }).join("")+'</div>';
  return aktenRahmen({ bereich:"Labor", titel:cur.pa.label+" über "+pts.length+" Blätter",
    untertitel:dmy(pts[0].iso)+" → "+dmy(le.iso)+(cur.pa.unit?" · "+cur.pa.unit:""),
    ansichten:ans,
    links: chips + bild([{pts:pts, farbe:"var(--akzent)", r:3}],
      {dez:1, zone:ref, schwellen:{voll:400},
       text:"Das grüne Band ist der Referenzbereich. Zuletzt "+nf(le.v,1)+(cur.pa.unit?" "+cur.pa.unit:"")+" am "+dmy(le.iso)+"."}) });
}

function akteHistory(){
  var E = (STATE.history.events||[]).slice().sort(function(a,b){ return a.date<b.date?1:-1; });
  var KIND = {op:"Eingriff", labor:"Labor", diag:"Diagnose", ereignis:"Ereignis", befund:"Befund", start:"Start"};
  var jahre = [];
  E.forEach(function(e){ var j=String(e.date||"").slice(0,4); if(j && jahre.indexOf(j)<0) jahre.push(j); });
  var j = UI.wahl || jahre[0];
  var drin = E.filter(function(e){ return String(e.date||"").slice(0,4)===j; });
  return aktenRahmen({ bereich:"Krankengeschichte", titel:j||"—",
    untertitel:zahl(drin.length,"Eintrag","Einträge")+" in diesem Jahr",
    links: drin.map(function(e){
      return '<div class="ev"'+(e.mark?' style="background:var(--surface2)"':'')+'>'
        + '<div class="d">'+dmy(e.date)+'</div><div>'
        + '<h4>'+esc(e.title)+'<span class="kind">'+esc((e.kind&&KIND[e.kind])||"Eintrag")+'</span></h4>'
        + (e.note?'<p>'+esc(e.note)+'</p>':'')
        + (e.learning?'<div class="lern">'+esc(e.learning)+'</div>':'')
        + docsAm(e.docs)+'</div></div>'; }).join(""),
    listeKopf:zahl(jahre.length,"Jahr","Jahre"),
    liste: jahre.map(function(x){
      return lz(x, String(E.filter(function(e){ return String(e.date||"").slice(0,4)===x; }).length),
        x===j, 'data-wahl="'+x+'"'); }).join("") });
}

/* Die Medikation ist die einzige Akte, die sich ändert, ohne dass ein Blatt dazukommt:
   eine Dosis wird angepasst, ein Präparat abgesetzt. Darum ist sie hier auch schreibbar -
   auf einer Arbeitskopie, die erst beim Speichern in die Datei geht. Die Arztkopie ist
   eingefroren und zeigt den Knopf nicht. */
function medArbeit(){
  if(!UI.medListe) UI.medListe = JSON.parse(JSON.stringify(((STATE.meds||{}).liste)||[]));
  if(!UI.medKopf) UI.medKopf = {stand:(STATE.meds||{}).stand||"", quelle:(STATE.meds||{}).quelle||""};
  return UI.medListe;
}

  if(UI.medEdit){
    var A = medArbeit(), K = UI.medKopf;
    return aktenRahmen({ bereich:"Medikation", titel:"Plan bearbeiten",

              + '<input type="text" data-med="'+i+'" data-f="dosis" value="'+esc(m.dosis||"")+'" placeholder="1–0–0–0">'
              + '<button class="med-weg" data-medweg="'+i+'" title="Präparat entfernen">×</button></div>'
              + '<div style="padding:0 0 10px"><input type="text" data-med="'+i+'" data-f="verordner" value="'
              + esc(m.verordner||"")+'" placeholder="verordnet von" style="height:38px;font-size:14px"></div>'; }).join("")
        + '<button class="btn" id="medPlus" style="margin-top:14px;color:var(--akzent)">+ Präparat</button>'
        + '<div class="felder" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">'
        +   '<div class="feld"><div class="lbl">Stand des Plans</div>'
        +     '<input type="text" data-medkopf="stand" value="'+esc(K.stand||"")+'" placeholder="2026-08-15"></div>'
        +   '<div class="feld" style="flex:2 1 260px"><div class="lbl">Quelle</div>'
        +     '<input type="text" data-medkopf="quelle" value="'+esc(K.quelle||"")+'" placeholder="eMediplan, Praxis…"></div>'
        + '</div>'
        + '<div class="bildtext">Ein Präparat ohne Namen wird beim Speichern verworfen. «i. R.» steht für «in Reserve».</div>' });
  }
  if(!L.length) return aktenRahmen({bereich:"Medikation", titel:"Kein Plan erfasst",
    aktion:FROZEN?"":'<button class="btn" id="medEdit" style="color:var(--akzent)">✎ Bearbeiten</button>',
    links:'<p class="satz">Sobald ein eMediplan erfasst ist, steht er hier.</p>'});
  return aktenRahmen({ bereich:"Medikation", titel:zahl(L.length,"Präparat","Präparate"),
    untertitel:(M.stand?"Stand "+dmy(M.stand)+" · ":"")+(M.quelle||""),
    aktion:FROZEN?"":'<button class="btn" id="medEdit" style="color:var(--akzent)">✎ Bearbeiten</button>',
    links:'<div class="scroll" style="margin-top:0"><table class="akten-tabelle"><thead><tr>'
      + '<th>Präparat</th><th style="text-align:left">Wirkstoff</th><th>M–Mi–A–N</th><th>Verordnung</th>'
      + '</tr></thead><tbody>'
      + L.map(function(m){ return '<tr><td>'+esc(m.name)+'</td>'
          + '<td style="text-align:left;color:var(--muted)">'+esc(m.wirkstoff||"")+'</td>'
          + '<td class="mono" style="color:var(--akzent)">'+esc(m.dosis||"")+'</td>'
          + '<td style="color:var(--faint)">'+esc(m.verordner||"")+'</td></tr>'; }).join("")
      + '</tbody></table></div>' });

async function medSpeichern(){
  var A = (UI.medListe||[]).filter(function(m){ return String(m.name||"").trim()!==""; });
  var K = UI.medKopf||{};
  var N = JSON.parse(JSON.stringify(STATE));
  N.meds = N.meds||{};
  N.meds.liste = A;
  if(String(K.stand||"").trim()) N.meds.stand = String(K.stand).trim();
  if(String(K.quelle||"").trim()) N.meds.quelle = String(K.quelle).trim();
  N.updated = dmy(isoVon(new Date(heuteMs())));
  var ok;
  try{ ok = await ghSchreiben(N, false); }
  catch(e){ return meldung("Speichern fehlgeschlagen: "+(e&&e.message||e)+". Es wurde nichts geändert.", true); }
  if(ok!==true) return false;
  UI.medEdit = false; UI.medListe = null; UI.medKopf = null;
  zustandSetzen(N);
  return meldung(zahl(A.length,"Präparat","Präparate")+" gespeichert.");
}

function rohTage(){
  var T = {};
  function merk(iso){ return T[iso] = T[iso] || {iso:iso}; }
  rGewicht().forEach(function(x){ var z=merk(x.iso); z.gw = x.v; if(x.note) (z.nz=z.nz||[]).push(x.note); });
  rBzTage().forEach(function(x){ var z=merk(x.iso); z.bz = x.v; z.bzn = x.n; if(x.note) (z.nz=z.nz||[]).push(x.note); });
  rBp().forEach(function(x){ var z=merk(x.iso); (z.bp = z.bp||[]).push(Math.round(x.v)+"/"+Math.round(x.dia));
    if(x.note) (z.nz=z.nz||[]).push(x.note); });
  return Object.keys(T).sort().reverse().map(function(k){ var z=T[k];
    z.notiz = z.nz ? z.nz.join(" · ") : ""; return z; });
}

/* CSV, nicht JSON: die Rohdaten sind der Ort, an dem man die Zahlen in etwas anderes
   tragen will. Semikolon und Komma als Dezimaltrennzeichen samt BOM, damit Excel auf
   einem deutschen System nicht jede Zahl als Datum liest. */
function csvExport(){
  var alle = rohTage(), liste = (UI.wahl==="14") ? alle.slice(0,14) : alle;
  var mitNotiz = zeigeNotizen();
  var kopf = ["Tag","Gewicht kg","Blutzucker Mittel","Messungen","Blutdruck"]
    .concat(mitNotiz?["Notiz"]:[]);
  var zeilen = liste.map(function(z){
    return [z.iso, z.gw!=null?nf(z.gw,1):"", z.bz!=null?nf(z.bz,1):"", z.bzn||"",
      z.bp?z.bp.join(" "):""]
      .concat(mitNotiz?[String(z.notiz||"").replace(/[;\r\n]/g," ")]:[]).join(";"); });
  var txt = "\ufeff"+kopf.join(";")+"\r\n"+zeilen.join("\r\n")+"\r\n";
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"text/csv;charset=utf-8"}));
  a.download = "Monitoring_Rohdaten_"+isoVon(new Date(heuteMs()))+".csv";
  document.body.appendChild(a); a.click(); a.remove();
}
