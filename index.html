  h += '<div class="abschnitt">Selten · nur bei Bedarf</div>'
    + zeile("selten","Körpermasse","","","alle vier Wochen");
  if(auf==="selten") h += '<div class="koerper"><div class="felder">'
    + feld("brust","Brust cm")+feld("taille","Taille cm")+feld("huefte","Hüfte cm")
    + '</div></div>';

  var anzahl = Object.keys(UI.erfWerte).filter(function(k){ return String(UI.erfWerte[k]).trim()!==""; }).length + bpNeu;
  h += '</div><div class="fuss-erf"><div>'+zahl(anzahl,"Wert","Werte")+' eingetippt · geschrieben wird direkt in die '
    + esc((CFG&&CFG.file)||"monitoring.json")+'</div><div style="display:flex;gap:9px">'
    + '<button class="btn" data-zu="1">Abbrechen</button>'
    + '<button class="btn stark" id="btnSpeichern"'+(anzahl?"":" disabled")+'>Speichern</button></div></div>';
  if(UI.erfMeldung) h += '<div class="meldung '+(UI.erfMeldung.fehler?"fehler":"ok")+'">'+esc(UI.erfMeldung.text)+'</div>';
  return h + '</div>';
}

/* Schreiben: an dieselben Stellen, aus denen gelesen wird. Tageswerte auf das Datum,
   Wochenwerte auf ihren Wochenanker - Trinkmenge und Verdauung auf den MONTAG (so
   liegen sie in der Datei), Fitbit auf den SONNTAG, der die Woche beschliesst. */
function montagVon(iso){ var d=new Date(iso+"T12:00:00"), w=(d.getDay()+6)%7;
  d.setDate(d.getDate()-w); return isoVon(d); }
function sonntagVon(iso){ var d=new Date(iso+"T12:00:00"), w=(d.getDay()+6)%7;
  d.setDate(d.getDate()+(6-w)); return isoVon(d); }
function punktSetzen(liste, schluessel, iso, felder){
  var p = liste.filter(function(x){ return x[schluessel]===iso; })[0];
  if(!p){ p={}; p[schluessel]=iso; liste.push(p); }
  for(var k in felder) if(felder[k]!=null) p[k]=felder[k];
  liste.sort(function(a,b){ return a[schluessel]<b[schluessel]?-1:1; });
  return p;
}

async function speichern(){
  /* Erst pruefen, dann rechnen, dann schreiben - und die Mutationen laufen auf einer
     KOPIE. Der erste Anlauf hat STATE sofort geaendert und danach gemeldet «es wurde
     nichts geschrieben»: die Kacheln zeigten den Wert als erfasst, im Repo stand er
     nicht. Ein Werkzeug, das ueber den eigenen Datenstand luegt, ist schlimmer als
     eines, das nicht speichert. */
  if(!CFG || !CFG.repo || !CFG.token)
    return meldung("Nicht verbunden — bitte zuerst über ⚙ den Datenspeicher verbinden. Es wurde nichts geändert.", true);
  var iso = erfIso(), W = UI.erfWerte, geschrieben = 0;
  var N = JSON.parse(JSON.stringify(STATE));
  N.weight = N.weight||{points:[]}; N.weight.points = N.weight.points||[];
  N.glucose = N.glucose||{days:[]}; N.glucose.days = N.glucose.days||[];
  N.bloodpressure = N.bloodpressure||{points:[]}; N.bloodpressure.points = N.bloodpressure.points||[];
  N.befinden = N.befinden||{entries:[]}; N.befinden.entries = N.befinden.entries||[];
  N.body = N.body||{points:[]}; N.body.points = N.body.points||[];
  N.fluid = N.fluid||{weeks:[]}; N.fluid.weeks = N.fluid.weeks||[];
  N.digestion = N.digestion||{weeks:[]}; N.digestion.weeks = N.digestion.weeks||[];
  N.fitbit = N.fitbit||{weeks:[]}; N.fitbit.weeks = N.fitbit.weeks||[];

  var g = num(W.gewicht);
  if(g!=null){ punktSetzen(N.weight.points, "date", iso, {value:g}); geschrieben++; }

  var slots = N.glucose.slots||[], neueRows = [];
  slots.forEach(function(s,i){ var v=num(W["bz"+i]); if(v!=null) neueRows.push({slot:s, values:[{v:v}]}); });
  if(neueRows.length){
    var tag = N.glucose.days.filter(function(d){ return d.iso===iso; })[0];
    if(!tag){ tag={iso:iso, date:dm(iso), rows:[]}; N.glucose.days.push(tag);
      N.glucose.days.sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
    tag.rows = tag.rows||[];
    neueRows.forEach(function(nr){
      var r = tag.rows.filter(function(x){ return x.slot===nr.slot; })[0];
      if(r){ r.values = (r.values||[]).concat(nr.values); } else { tag.rows.push(nr); }
      geschrieben++;
    });
  }

  UI.erfBp.forEach(function(r){
    var sys=num(r.sys), dia=num(r.dia);
    if(sys==null || dia==null) return;
    /* Dieselbe Messung zweimal am selben Tag ist moeglich - dieselben ZAHLEN zweimal
       sind aber fast immer ein zweiter Klick auf Speichern. */
    if(N.bloodpressure.points.some(function(p){ return p.iso===iso && +p.sys===sys && +p.dia===dia; })) return;
    var p = {iso:iso, sys:sys, dia:dia};
    var pl = num(r.puls); if(pl!=null) p.pulse = pl;
    N.bloodpressure.points.push(p);
    geschrieben++;
  });
  N.bloodpressure.points.sort(function(a,b){ return a.iso<b.iso?-1:1; });

  var dims = befDims(), bfFelder = {};
  dims.forEach(function(d){ if(W["bf_"+d.key]!=null) bfFelder[d.key] = W["bf_"+d.key]; });
  if(Object.keys(bfFelder).length){ punktSetzen(N.befinden.entries, "iso", iso, bfFelder); geschrieben++; }

  var kf = {chest:num(W.brust), waist:num(W.taille), hip:num(W.huefte)};
  if(kf.chest!=null || kf.waist!=null || kf.hip!=null){ punktSetzen(N.body.points, "date", iso, kf); geschrieben++; }

  if(W.trinken!=null){ punktSetzen(N.fluid.weeks, "weekStart", montagVon(iso), {goalMet:W.trinken===1}); geschrieben++; }
  if(W.verdauung!=null){ punktSetzen(N.digestion.weeks, "weekStart", montagVon(iso), {stars:+W.verdauung}); geschrieben++; }

  var sl=num(W.schlaf), st=num(W.schritte), rh=num(W.rhr);
  if(sl!=null || st!=null || rh!=null){
    var wk = punktSetzen(N.fitbit.weeks, "weekStart", sonntagVon(iso), {});
    if(sl!=null){ wk.sleep = wk.sleep||{}; wk.sleep.avgH = sl; }
    if(st!=null){ wk.steps = wk.steps||{}; wk.steps.avg = st; }
    if(rh!=null){ wk.rhr = wk.rhr||{}; wk.rhr.avg = rh; }
    geschrieben++;
  }

  if(!geschrieben) return meldung("Nichts eingetippt — es wurde nichts geschrieben.", true);
  N.updated = dmy(isoVon(new Date(heuteMs())));
  var ok;
  try{ ok = await ghSchreiben(N, false); }
  catch(e){ return meldung("Speichern fehlgeschlagen: "+(e&&e.message||e)+". Es wurde nichts geändert.", true); }
  if(ok!==true) return false;   // STATE bleibt unangetastet, der Entwurf steht noch da
  UI.erfWerte = {}; UI.erfBp = [{sys:"",dia:"",puls:""}]; UI.erfAuf = "auto";
  zustandSetzen(N);
  return meldung(zahl(geschrieben,"Eintrag","Einträge")+" unter dem "+dmy(iso)+" gespeichert.");
}

/* ══ Arzt-Export ════════════════════════════════════════════════════════════════
   Dieselbe Ansicht, nur ohne Bedienung. Das Werkzeug klont sich selbst, friert den
   Datenstand ein und knipst Verbinden, Erfassen und Export aus - darum gibt es keine
   zweite Darstellung, die veralten koennte. Der Verbinden-Dialog wird entfernt: ein
   Token hat in einer Datei, die aus dem Haus geht, nichts verloren. */
var EXP_BEREICHE = [ {k:"gewicht",t:"Gewicht"}, {k:"bz",t:"Blutzucker"}, {k:"bd",t:"Blutdruck"},
  {k:"schlaf",t:"Schlaf und Schritte"}, {k:"befinden",t:"Befinden"}, {k:"woche",t:"Trinkmenge und Verdauung"},
  {k:"labor",t:"Labor"}, {k:"history",t:"Krankengeschichte"}, {k:"meds",t:"Medikation"},
  {k:"stamm",t:"Diagnosen und Stammdaten"} ];
var EXP_AN = {};
EXP_BEREICHE.forEach(function(b){ EXP_AN[b.k]=true; });
var EXP_DOCS = false;

function exportModal(){
  return '<div class="modal-bg" id="expBg"><div class="modal"><div class="modal-kopf">'
    + '<h2>Für Arzt exportieren</h2><button class="btn rund" data-modalzu="1">×</button></div>'
    + '<div class="modal-koerper">'
    + '<p style="margin:0 0 16px;font-size:14px;color:var(--muted)">Eine einzelne HTML-Datei mit dem heutigen Datenstand — dieselbe Ansicht, ohne Erfassen und ohne Zugang zum Datenspeicher. Abgewählte Bereiche sind in der Kopie nicht enthalten.</p>'
    + EXP_BEREICHE.map(function(b){
        return '<div class="exp-zeile" data-exp="'+b.k+'"><div class="exp-name">'+esc(b.t)+'</div>'
          + '<button class="schieber'+(EXP_AN[b.k]?" an":"")+'"><span class="knopf"></span></button></div>'; }).join("")
    + '<div class="exp-zeile" data-exp="__docs"><div class="exp-name">Dokumentpfade und Links<br>'
    +   '<span style="font-size:12px;color:var(--faint)">zeigen auf Deine private OneDrive</span></div>'
    +   '<button class="schieber'+(EXP_DOCS?" an":"")+'"><span class="knopf"></span></button></div>'
    + '<button class="btn stark" id="btnExpGo" style="margin-top:18px;width:100%">Kopie erzeugen</button>'
    + '</div></div></div>';
}

function exportZustand(){
  var S = JSON.parse(JSON.stringify(STATE));
  if(!EXP_AN.gewicht){ S.weight.points=[]; S.body.points=[]; }
  if(!EXP_AN.bz){ S.glucose.days=[]; S.glucose.histDays=[]; delete S.glucose.baseline; }
  if(!EXP_AN.bd) S.bloodpressure.points=[];
  if(!EXP_AN.schlaf) S.fitbit.weeks=[];
  if(!EXP_AN.befinden) S.befinden.entries=[];
  if(!EXP_AN.woche){ S.fluid.weeks=[]; S.digestion.weeks=[]; }
  if(!EXP_AN.labor) S.lab={params:[],panels:[]};
  if(!EXP_AN.history) S.history={events:[]};
  if(!EXP_AN.meds) S.meds={liste:[]};
  if(!EXP_AN.stamm) S.patient={};
  S.review = EXP_AN.stamm ? S.review : [];
  S.__export = { made:isoVon(new Date(heuteMs())), docPaths:EXP_DOCS, bereiche:JSON.parse(JSON.stringify(EXP_AN)) };
  if(!EXP_DOCS){
    var putzen = function(arr){ (arr||[]).forEach(function(x){ if(x.docs) delete x.docs; }); };
    putzen(S.history.events); putzen(S.lab.panels);
  }
  return S;
}

function exportErzeugen(){
  var klon = document.documentElement.cloneNode(true);
  ["haupt","status","stamm","modale"].forEach(function(id){
    var n = klon.querySelector("#"+id); if(n) n.innerHTML = "";
  });
  var html = klon.outerHTML;
  var json = "/*STATE-ANFANG*/\nvar STATE = "+JSON.stringify(exportZustand())+";\n/*STATE-ENDE*/";
  var a = html.indexOf("/*STATE-ANFANG*/"), b = html.indexOf("/*STATE-ENDE*/");
  if(a<0 || b<a){ alert("Der Export findet die STATE-Marken nicht — die Kopie wäre leer."); return; }
  html = html.slice(0,a) + json + html.slice(b+"/*STATE-ENDE*/".length);
  html = html.replace("var FROZEN = false;", "var FROZEN = true;");
  var blob = new Blob(["<!doctype html>\n"+html], {type:"text/html"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Monitoring_Arzt_"+isoVon(new Date(heuteMs()))+".html";
  document.body.appendChild(a); a.click(); a.remove();
  document.getElementById("modale").innerHTML = "";
}

/* ══ Verbinden ══════════════════════════════════════════════════════════════════ */
function connModal(){
  var c = CFG||{};
  return '<div class="modal-bg" id="ghBg"><div class="modal"><div class="modal-kopf">'
    + '<h2>Datenspeicher</h2><button class="btn rund" data-modalzu="1">×</button></div>'
    + '<div class="modal-koerper">'
    + '<p style="margin:0 0 16px;font-size:14px;color:var(--muted)">Deine Messwerte liegen in Deinem privaten Repo. Auf diesem Gerät bleibt nur der Zugang — im Speicher dieses Browsers, nicht in der Datei.</p>'
    + '<div class="feld" style="margin-bottom:12px"><div class="lbl">Repo</div>'
    +   '<input type="text" id="ghRepo" value="'+esc(c.repo||"")+'" placeholder="Name/health_monitoring_data"></div>'
    + '<div class="feld" style="margin-bottom:12px"><div class="lbl">Datei</div>'
    +   '<input type="text" id="ghFile" value="'+esc(c.file||"monitoring.json")+'"></div>'
    + '<div class="feld" style="margin-bottom:12px"><div class="lbl">Branch (leer = Standard)</div>'
    +   '<input type="text" id="ghBranch" value="'+esc(c.branch||"")+'"></div>'
    + '<div class="feld" style="margin-bottom:16px"><div class="lbl">Token</div>'
    +   '<input type="text" id="ghToken" value="'+esc(c.token||"")+'" placeholder="ghp_…"></div>'
    + '<div style="display:flex;gap:9px;flex-wrap:wrap">'
    +   '<button class="btn stark" id="ghGo">Verbinden</button>'
    +   '<button class="btn" id="ghDown">JSON herunterladen</button>'
    +   (CFG?'<button class="btn" id="ghWeg">Zugang löschen</button>':'')
    + '</div></div></div></div>';
}

/* ══ Zeichnen und Bedienung ═════════════════════════════════════════════════════ */
function zeichne(){
  var kopfE = document.getElementById("kopfEyebrow"), kopfZ = document.getElementById("kopfZeile");
  var kopie = FROZEN, stand = STATE.updated||"—";
  kopfE.textContent = kopie ? "Arztkopie · reine Ansicht" : "Monitoring";
  kopfZ.textContent = kopie ? "MOPP+ · Kopie vom "+((STATE.__export&&STATE.__export.made)?dmy(STATE.__export.made):stand) : "MOPP+ | "+stand;
  document.getElementById("werkzeuge").hidden = kopie;
  document.getElementById("fussText").textContent = kopie
    ? "Arztkopie · Datenstand "+stand+" · reine Ansicht, keine Erfassung"
    : "Ebene 1 bis 3 · Datenstand "+stand;

  var st = document.getElementById("stamm");
  if(kopie && (STATE.patient||{}).name){
    st.hidden = false;
    st.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap">'
      + '<div style="font-size:18px;font-weight:640">'+esc(STATE.patient.name)+'</div>'
      + '<div style="font-size:13.5px;color:var(--faint)">'
      + [(STATE.patient.geboren?"geboren "+dmy(STATE.patient.geboren):""), STATE.patient.adresse||""].filter(Boolean).map(esc).join(" · ")
      + '</div></div><div class="diag">'
      + (STATE.patient.diagnosen||[]).map(function(d){ return '<span>'+esc(d)+'</span>'; }).join("")+'</div>';
  } else st.hidden = true;

  var haupt = document.getElementById("haupt");
  if(!rGewicht().length && !rBzAlle().length && !STATE.updated){
    document.getElementById("status").innerHTML = "";
    haupt.innerHTML = '<div class="karte leer"><div class="k-name">Erster Start</div>'
      + '<div style="font-size:20px;font-weight:640">Willkommen bei MOPP+</div>'
      + '<p style="margin:0;font-size:14.5px;color:var(--muted)">Deine Messwerte liegen in Deinem privaten Datenspeicher. MOPP+ holt sie von dort und schreibt sie dorthin zurück — auf diesem Gerät bleibt nichts ausser dem Zugang.</p>'
      + '<button class="btn stark" id="btnStart" style="align-self:flex-start;margin-top:6px">Datenspeicher verbinden</button></div>';
    return;
  }
  zeichneStatus();
  if(UI.seite==="wand") haupt.innerHTML = zeichneWand();
  if(UI.seite==="voll") haupt.innerHTML = zeichneVoll();
  if(UI.seite==="akten") haupt.innerHTML = zeichneAkten();
  if(UI.seite==="erf") haupt.innerHTML = zeichneErf();
}

document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;

  if(t.id==="btnConn" || t.id==="btnStart"){ document.getElementById("modale").innerHTML = connModal(); return; }
  if(t.id==="btnExp"){ document.getElementById("modale").innerHTML = exportModal(); return; }
  if(t.dataset.modalzu){ document.getElementById("modale").innerHTML = ""; return; }

  if(t.id==="ghGo"){
    cfgSchreiben({ repo:document.getElementById("ghRepo").value.trim(),
      file:document.getElementById("ghFile").value.trim()||"monitoring.json",
      branch:document.getElementById("ghBranch").value.trim(),
      token:document.getElementById("ghToken").value.trim() });
    document.getElementById("modale").innerHTML = "";
    ghHolen(); return;
  }
  if(t.id==="ghDown"){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"}));
    a.download=(CFG&&CFG.file)||"monitoring.json"; document.body.appendChild(a); a.click(); a.remove(); return;
  }
  if(t.id==="ghWeg"){ localStorage.removeItem("mopp.gh"); CFG=null; SHA=null; ampel("aus");
    document.getElementById("modale").innerHTML = ""; return; }

  if(t.dataset.exp!==undefined){
    if(t.dataset.exp==="__docs") EXP_DOCS = !EXP_DOCS; else EXP_AN[t.dataset.exp] = !EXP_AN[t.dataset.exp];
    document.getElementById("modale").innerHTML = exportModal(); return;
  }
  if(t.closest(".exp-zeile")){
    var z = t.closest(".exp-zeile");
    if(z.dataset.exp==="__docs") EXP_DOCS = !EXP_DOCS; else EXP_AN[z.dataset.exp] = !EXP_AN[z.dataset.exp];
    document.getElementById("modale").innerHTML = exportModal(); return;
  }
  if(t.id==="btnExpGo"){ exportErzeugen(); return; }

  if(t.dataset.kz){ UI.kz = t.dataset.kz; UI.seite = "voll"; zeichne(); window.scrollTo(0,0); return; }
  /* × heisst überall dasselbe: eine Ebene hoch. Im Akten-Detail zurück zu den Kacheln,
     in der Kachelübersicht zurück zu «Heute». */
  if(t.dataset.zu==="akten"){ UI.akte = null; UI.blatt = 0; UI.sicht = null; UI.wahl = null; zeichne(); window.scrollTo(0,0); return; }
  if(t.dataset.zu){ UI.seite = "wand"; UI.akte = null; UI.erfMeldung = null; zeichne(); return; }
  if(t.id==="btnAkten"){ UI.seite = "akten"; UI.akte = null; zeichne(); window.scrollTo(0,0); return; }
  if(t.dataset.akte){ UI.akte = t.dataset.akte; UI.blatt = 0; UI.sicht = null; UI.wahl = null; zeichne(); window.scrollTo(0,0); return; }
  if(t.dataset.blatt!==undefined){ UI.blatt = +t.dataset.blatt; zeichne(); return; }
  if(t.dataset.sicht){ UI.sicht = t.dataset.sicht; UI.wahl = null; zeichne(); return; }
  if(t.dataset.wahl){ UI.wahl = t.dataset.wahl; zeichne(); return; }
  if(t.id==="btnCsv"){ csvExport(); return; }
  if(t.dataset.sch){ if(UI.kz==="bz") UI.bzView = t.dataset.sch; else UI.reihe = t.dataset.sch; zeichne(); return; }
  if(t.id==="btnErf" || t.id==="btnErf2"){ UI.seite = "erf"; UI.erfMeldung = null; zeichne(); window.scrollTo(0,0); return; }

  /* Der Entwurf gehoert zu EINEM Tag. Wandert er beim Blaettern mit, landet der Wert
     am falschen Datum - darum wird er beim Datumswechsel geleert. */
  if(t.dataset.tag){ UI.erfTag = Math.max(0, UI.erfTag - (+t.dataset.tag));
    UI.erfAuf="auto"; UI.erfMeldung=null; UI.erfWerte={}; UI.erfBp=[{sys:"",dia:"",puls:""}];
    zeichne(); return; }
  if(t.dataset.erf){ UI.erfAuf = (UI.erfAuf===t.dataset.erf) ? null : t.dataset.erf; UI.erfMeldung=null; zeichne(); return; }
  if(t.dataset.bf){ UI.erfWerte["bf_"+t.dataset.bf] = +t.dataset.v; UI.erfMeldung=null; zeichne(); return; }
  if(t.dataset.stern){ UI.erfWerte.verdauung = +t.dataset.stern; UI.erfMeldung=null; zeichne(); return; }
  if(t.id==="btnTrinken"){ UI.erfWerte.trinken = (UI.erfWerte.trinken===1?0:1); UI.erfMeldung=null; zeichne(); return; }
  if(t.id==="btnBpPlus"){ UI.erfBp.push({sys:"",dia:"",puls:""}); zeichne(); return; }
  if(t.id==="btnSpeichern"){ speichern(); return; }
});

/* Eingaben landen sofort im Entwurf, nicht erst beim Speichern - ein Klick auf eine
   andere Zeile darf nichts verlieren. */
document.addEventListener("input", function(e){
  var i = e.target;
  if(i.dataset.w){ UI.erfWerte[i.dataset.w] = i.value; return; }
  if(i.dataset.bp!==undefined){ UI.erfBp[+i.dataset.bp][i.dataset.f] = i.value; return; }
});

/* ══ Start ══════════════════════════════════════════════════════════════════════ */
(function boot(){
  if(FROZEN){ zeichne(); return; }
  CFG = cfgLesen();
  zeichne();
  if(CFG && CFG.repo && CFG.token) ghHolen();
})();
</script>
