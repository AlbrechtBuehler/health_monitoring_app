<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOPP+ · Monitoring</title>
<style>
  /* MOPP+ · Neubau 15.08.2026. Eine Frage, eine Antwort, ein Weg.
     Drei Kurven — Gewicht, Blutzucker, Blutdruck — und die Akten; mehr traegt das
     Werkzeug nicht. Drei Ebenen: Heute (Kachelwand) · eine Kennzahl gross · Akten.
     Farben: Palette «Mitternacht». Ampel nur fuer ZUSTAND, --akzent fuer eine Datenreihe,
     --zweit nur dort, wo zwei echte Reihen in einem Bild liegen (Blutdruck). */
  :root{
    --bg:#0F1216; --surface:#171B21; --surface2:#13171C; --line:#272E38; --line2:#1F242B;
    --ink:#F1F4F7; --muted:#A9B3BE; --faint:#7E8894;
    --akzent:#8FB8E8; --akzent-hell:#B6D2F2; --akzent-fg:#0F1216; --zweit:#6FA8E0;
    --good:#5FC08C; --warn:#E0B25C; --high:#E8735E;
    --zone:rgba(95,192,140,.12); --zone-kante:rgba(95,192,140,.45); --grid:rgba(255,255,255,.07);
    --marke:#F08C1A;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:15px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:22px 18px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  a{color:var(--akzent);text-decoration:none;border-bottom:1px solid var(--line)}
  a:hover{color:var(--ink);border-bottom-color:var(--good)}
  button{font-family:inherit;color:inherit}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .mono{font-family:var(--mono)}
  h1{font-size:25px;font-weight:660;letter-spacing:-.015em;margin:3px 0 0}
  .kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .werkzeuge{display:flex;gap:8px;flex-wrap:wrap}
  /* display:flex schlaegt die Browser-Regel [hidden]{display:none} - ohne diese
     Zeile zeigt die Arztkopie Zahnrad, Erfassen und Export weiter an. */
  .werkzeuge[hidden]{display:none}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;
    font-size:14px;color:var(--muted);cursor:pointer}
  .btn:hover{border-color:var(--akzent)}
  .btn.stark{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-fg);font-weight:600}
  .btn.stark:hover{background:var(--akzent-hell);border-color:var(--akzent-hell)}
  .btn[disabled]{background:var(--line);border-color:var(--line);color:var(--faint);cursor:default}
  .btn.rund{width:38px;height:38px;padding:0;font-size:17px}
  .ampel{width:9px;height:9px;border-radius:50%;background:var(--high);display:inline-block;margin-right:7px}
  .ampel.an{background:var(--good)} .ampel.busy{background:var(--warn)}
  .status{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;padding:13px 0 16px;
    border-bottom:1px solid var(--line2);margin-bottom:20px;font-size:14.5px}
  /* Ohne diese Regel bliebe die Leiste stehen: .status setzt display:flex und schlaegt
     damit die UA-Regel [hidden]{display:none} - das Attribut allein blendet nichts aus. */
  .status[hidden]{display:none}
  .karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .wand{display:flex;flex-direction:column;gap:14px}
  .kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
  .kachel{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
  .kachel:hover{border-color:var(--akzent)}
  .kachel.leit{padding:22px 24px;display:block;width:100%}
  .k-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .k-zahl{font-size:36px;font-weight:640;letter-spacing:-.03em;line-height:1.05}
  .kachel.leit .k-zahl{font-size:46px}
  .k-einheit{font-size:15px;color:var(--muted)}
  .k-unter{font-size:13.5px;color:var(--faint);margin-top:6px;min-height:20px}
  .k-meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:9px}
  .k-reihe{display:flex;align-items:baseline;gap:9px;margin-top:8px;flex-wrap:wrap}
  .aktenknopf{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    width:100%;text-align:left;padding:16px 22px;background:var(--surface);border:1px solid var(--line);
    border-radius:13px;cursor:pointer;font-size:14.5px;color:var(--muted)}
  .aktenknopf:hover{border-color:var(--akzent)}
  .buehne{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px 26px}
  .b-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .b-zahl{font-size:42px;font-weight:640;letter-spacing:-.03em;line-height:1.05}
  .satz{margin:14px 0 0;font-size:15.5px;color:var(--muted);max-width:80ch;text-wrap:pretty}
  .bildtext{font-size:13px;color:var(--faint);margin-top:10px}
  .schalter{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .sch{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;
    font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .sch.an{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-fg)}
  .neben{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;margin-top:22px;
    border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--line)}
  .neben > div{background:var(--surface2);padding:14px 18px}
  .n-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .n-wert{font-size:19px;font-weight:620}
  .n-unter{font-size:12.5px;color:var(--faint);margin-top:2px}
  /* Erfassen: eine Liste, offen ist immer nur eine Zeile. */
  .abschnitt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);padding:22px 0 9px;border-bottom:1px solid var(--line)}
  .zeile{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line2);padding:15px 6px;cursor:pointer}
  .zeile:hover{background:var(--surface2)}
  .zeile b{font-size:16px;font-weight:600}
  .zeile .st{font-size:14.5px} .zeile .pf{font-size:12px;color:var(--faint)}
  .koerper{padding:14px 6px 18px;border-bottom:1px solid var(--line2)}
  .felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
  .feld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .feld .lbl,.vonbis .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  input[type=text]{width:100%;height:46px;font-size:16px;font-family:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 12px}
  input[type=text]:focus{outline:none;border-color:var(--akzent)}
  /* Kein Raster mit festen Spalten: Etikett, Eingabefeld und Hinweis einer
     Blutzucker-Zeile passen auf dem Telefon nicht in eine Reihe, und feste Spalten
     koennen nicht schrumpfen — auf dem Telefon scrollte die Seite quer. Flex mit
     Umbruch stapelt von selbst, sobald es eng wird, ohne Schwelle und auf jeder
     Breite. Die 46 px Hoehe bleiben: sie sind das Einzige, was auf dem Telefon
     zuverlaessig trifft. */
  .bz-zeile{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
  /* Vier Kinder, alle mit flex-basis statt fester Breite: auf dem Rechner stehen
     Messpunkt, Zeit und Wert nebeneinander, auf dem Telefon rutscht der Wert eine Zeile
     tiefer - von selbst, ohne Schwelle. Notiz und Hinweis nehmen immer die ganze Breite:
     ein Notizfeld von 90 px nimmt keine Notiz auf. */
  .bz-zeile > .sel{flex:3 1 168px;min-width:0}
  .bz-zeile > .zeit{flex:0 1 96px;min-width:84px}
  .bz-zeile > .wert{flex:1 1 104px;min-width:92px}
  .bz-zeile > .anmerk{flex:1 1 100%;min-width:0}
  .bz-zeile > .anker{flex:1 1 100%;min-width:0;font-size:13px;color:var(--faint)}
  .bz-zeile input[type=text]{width:100%}
  .bz-zeile select{width:100%;height:46px;font-size:15px;font-family:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 10px}
  .bz-zeile select:focus{outline:none;border-color:var(--akzent)}
  /* Der Blutdruck traegt dieselbe Zeilenform: Messpunkt, Uhrzeit, dann drei Zahlen. Die
     frueheren festen Rasterspalten (.bp-zeile) sind ersatzlos weg - sie konnten nicht
     schrumpfen und wussten von Messpunkt und Uhrzeit nichts. Die drei Zahlen bekommen
     eine Klasse und keine inline gesetzte Breite: eine Media Query erreicht keinen
     inline gesetzten Stil. */
  .bz-zeile > .zahl{flex:1 1 78px;min-width:68px}
  .bz-zeile > .zahl input[type=text]{text-align:center;padding:0 6px}
  /* Auf dem Telefon bekommt die Uhrzeit der Blutdruckzeile eine eigene Reihe. Sonst
     rutscht sys neben die Uhrzeit und dia in die naechste - und sys und dia sind EIN
     Messwert, kein Paar aus zwei Reihen. Nur die Blutdruckzeile: beim Blutzucker gehoeren
     Uhrzeit und Wert zusammen in eine Reihe. */
  @media (max-width:430px){
    .bz-zeile.bp > .zeit{flex:1 1 100%}
    .bz-zeile.bp > .zeit input[type=text]{max-width:150px}
  }
  /* Zeitraum «von–bis». Das Datumsfeld traegt dieselbe Hoehe wie jedes andere Feld -
     46 px sind das Einzige, was auf dem Telefon zuverlaessig trifft. */
  input[type=date]{width:100%;height:46px;font-size:15px;font-family:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 10px}
  input[type=date]:focus{outline:none;border-color:var(--akzent)}
  .vonbis{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px 12px;margin-top:12px}
  .vonbis label{display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:150px;max-width:230px}
  .vonbis .btn{height:46px;flex:0 0 auto}
  .vonbis .hinweis{flex:1 1 100%;font-size:13px;color:var(--faint)}
  /* Erfassen-Kopf: Blaetterpfeile, Datum und × in EINER ruhigen Zeile, auch bei 390 px.
     Vorher brach «heute · 21.08.2026» um und schob das × in eine eigene Zeile. */
  .erf-kopf{display:flex;align-items:center;gap:10px;margin-top:6px}
  .erf-kopf .tag{font-size:22px;font-weight:640;white-space:nowrap}
  .erf-kopf .nav{width:34px;height:34px;padding:0;flex:0 0 auto}
  .erf-kopf .btn.rund{margin-left:auto;flex:0 0 auto}
  @media (max-width:460px){
    .erf-kopf{gap:7px}
    .erf-kopf .tag{font-size:16.5px}
    .erf-kopf .nav{width:32px;height:32px;font-size:15px}
    .erf-kopf .btn.rund{width:34px;height:34px;font-size:16px}
  }
  /* flex:0 0 auto ist nicht Schmuck: der Schieber steht in einer Flex-Zeile, und eine lange
     Zeile links (die Mengenangabe des Exports) staucht ihn sonst von 56 auf 46 px - der
     Knopf sitzt bei 27 px und waere abgeschnitten. Ein Schalter, der je nach Nachbartext
     anders aussieht, sieht kaputt aus. */
  .schieber{width:56px;height:32px;flex:0 0 auto;border-radius:16px;border:1px solid var(--line);background:var(--bg);
    position:relative;cursor:pointer;padding:0}
  .schieber .knopf{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:var(--faint);transition:left .12s,background .12s}
  .schieber.an{border-color:var(--good);background:var(--good)}
  .schieber.an .knopf{left:27px;background:var(--bg)}
  .fuss-erf{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:20px;padding-top:18px;border-top:1px solid var(--line2);font-size:13.5px;color:var(--faint)}
  .meldung{margin-top:14px;border-radius:11px;padding:13px 16px;font-size:14px}
  .meldung.ok{background:var(--zone);border:1px solid var(--zone-kante)}
  .meldung.fehler{background:rgba(232,115,94,.12);border:1px solid var(--high)}
  /* Akten */
  .akten-liste{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .akten-tabelle{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:16px}
  .akten-tabelle th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .akten-tabelle th:first-child,.akten-tabelle td:first-child{text-align:left}
  .akten-tabelle td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
  .akten-tabelle tr.grp td{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);background:var(--surface2);padding-top:11px;padding-bottom:11px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px;margin-top:16px}
  .scroll .akten-tabelle{margin:0;min-width:820px}
  /* Die THQ-Zahl in der Unterzeile der Gewichtskachel. Sie sitzt IN einem Knopf, darum
     kein zweiter button, sondern ein Feld mit eigener Trefferbehandlung; die gepunktete
     Linie sagt, dass dahinter etwas liegt. */
  .hoch{color:var(--high)} .tief{color:var(--zweit)} .imsoll{color:var(--good)}
  .ev{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line2)}
  .ev .d{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .ev h4{margin:0 0 4px;font-size:16px;font-weight:620}
  .ev p{margin:0;font-size:14px;color:var(--muted)}
  .ev .lern{margin-top:6px;font-size:13.5px;color:var(--faint);font-style:italic}
  .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-left:8px}
  .diag{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .diag span{font-size:13px;color:var(--muted);background:var(--surface2);border:1px solid var(--line2);
    border-radius:8px;padding:5px 11px}
  .rb{padding:16px 0;border-bottom:1px solid var(--line2)}
  .rb .kw{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .rb h4{margin:4px 0 8px;font-size:16px;font-weight:620}
  .rb .txt{font-size:14px;color:var(--muted)}
  .rb .txt b{color:var(--ink)} .rb .txt ul{margin:6px 0;padding-left:20px}
  .ts{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px;align-items:flex-start}
  .ts-links{flex:1 1 420px;min-width:0}
  .ts-rechts{flex:1 1 240px;max-width:300px;min-width:0}
  .liste-kopf{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);padding-bottom:9px;border-bottom:1px solid var(--line)}
  .liste-roll{max-height:560px;overflow-y:auto}
  .lz{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line2);border-left:2px solid transparent;
    padding:11px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
  .lz:hover{background:var(--surface2)}
  .lz.an{background:var(--surface2);border-left-color:var(--akzent);color:var(--ink)}
  .lz i{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:0 0 auto;font-style:normal}
  .blatt{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .bz-row{display:grid;grid-template-columns:1fr auto 92px;gap:12px;align-items:baseline;padding:11px 16px;
    border-bottom:1px solid var(--line2)}
  .bz-row.grp{background:var(--surface2);font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint)}
  .bz-row .w{font-size:16px;font-weight:620}
  .bz-row .r{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
  .docs{margin-top:18px;border:1px solid var(--line);border-radius:13px;padding:15px 18px;background:var(--surface2)}
  /* Merkzettel: EIN schwebendes Element fuer alle Bilder. Der Zustand haengt nicht am
     UI-Objekt - sonst zeichnete jede Mausbewegung die ganze Seite neu.
     ZWEI STUFEN (Entscheid Albrecht vom 15.08.2026: «ziemlich ueberbordend, nimmt viel
     Raum ein»): Ueberfahren zeigt nur Datum, Wert und eine kurze Zeile - erst Anklicken
     bzw. Antippen klappt die Notiz auf. Eine Karte, die beim blossen Vorbeifahren ein
     Drittel des Bildes verdeckt, verdeckt das, worueber sie spricht. */
  .hit{fill:transparent;cursor:crosshair}
  #tip{position:fixed;z-index:60;pointer-events:none;background:var(--bg);border:1px solid var(--akzent);
    border-radius:10px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-width:270px}
  #tip .t-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  #tip .t-wert{font-size:19px;font-weight:640;letter-spacing:-.02em;margin-top:1px;white-space:nowrap}
  #tip .t-einheit{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:5px}
  #tip .t-sub{font-size:12px;color:var(--faint);margin-top:2px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #tip .t-wink{font-size:11.5px;color:var(--warn);margin-top:5px;white-space:nowrap}
  #tip .t-notiz{font-size:12.5px;color:var(--warn);margin-top:6px;padding-top:6px;border-top:1px solid var(--line);
    line-height:1.4}
  .notizpunkt{fill:var(--warn)}
  .roh-edit{width:30px;height:30px;padding:0;font-size:13px;border:1px solid var(--line);background:var(--surface2);
    border-radius:8px;color:var(--faint);cursor:pointer}
  .roh-edit:hover{border-color:var(--akzent);color:var(--akzent)}
  /* Erfassen als Kachelwand */
  .ek{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 20px;cursor:pointer;display:block;width:100%;min-width:0}
  .ek:hover{border-color:var(--akzent)}
  .ek.fertig{border-color:var(--zone-kante)}
  .ek.offen{border-color:var(--akzent);cursor:default}
  .ek-wert{font-size:30px;font-weight:640;letter-spacing:-.03em;line-height:1}
  .ek-plus{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--faint)}
  .ek-sub{font-size:12.5px;color:var(--faint);margin-top:7px}
  .kuerzel{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .kz-knopf{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:9px;
    padding:0 13px;height:38px;display:flex;align-items:center;font-size:14px;cursor:pointer}
  .kz-knopf.an{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-fg);font-weight:600}
  textarea.notiz{width:100%;min-height:58px;font-family:inherit;font-size:15px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;line-height:1.5;resize:vertical}
  textarea.notiz:focus{outline:none;border-color:var(--akzent)}
  .med-z{display:grid;grid-template-columns:1fr 1fr 96px 34px;gap:8px;align-items:center;padding:7px 0;
    border-bottom:1px solid var(--line2)}
  .med-z input[type=text]{height:40px;font-size:14.5px}
  .med-weg{width:34px;height:34px;padding:0;font-size:15px;border:1px solid var(--line);background:var(--surface2);
    border-radius:9px;color:var(--faint);cursor:pointer}
  .med-weg:hover{border-color:var(--high);color:var(--high)}
  /* Modale */
  .modal-bg{position:fixed;inset:0;background:rgba(8,10,13,.72);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:40}

  /* Der Dialog ist mit dem Zeitraum und den Mengen laenger geworden als das Fenster: bei

<body>
<div class="wrap">

  <header class="kopf">
    <div>
      <div class="eyebrow" id="kopfEyebrow">Monitoring</div>
      <h1 id="kopfZeile">MOPP+</h1>
    </div>
    <div class="werkzeuge no-print" id="werkzeuge">
      <button class="btn" id="btnConn" title="Datenspeicher"><span class="ampel" id="ampel"></span>⚙</button>
      <button class="btn stark" id="btnErf">✎ Erfassen</button>
      <button class="btn" id="btnExp" title="Für Arzt exportieren">⇪</button>
    </div>
  </header>

  <section class="karte stamm" id="stamm" hidden></section>
  <div class="status" id="status"></div>

  <main id="haupt"></main>

  <div class="fuss">
    <div class="pp">PASSEND | PRÄZISE | PRAKTISCH</div>
    <div class="st" id="fussText"></div>
  </div>
</div>

<div id="modale"></div>
<div id="tip"></div>

<script>
/* ══ Daten ══════════════════════════════════════════════════════════════════════
   STATE ist die monitoring.json, unveraendert. Der Neubau liest sie, er formt sie
   nicht um: was die Datei sagt, sagt die Ansicht. Geschrieben wird an dieselben
   Stellen, aus denen gelesen wird. */
/* Die beiden Marken sind kein Schmuck: der Arzt-Export ersetzt genau das, was zwischen
   ihnen steht, durch den eingefrorenen Datenstand. Ein Muster auf den Inhalt dieser
   Zeilen waere beim ersten Umbau still gebrochen. Marken nicht entfernen. */
/*STATE-ANFANG*/
var STATE = { updated:"", patient:{}, domain:{}, weight:{points:[]}, body:{points:[]},
  glucose:{days:[],slots:[],slotType:{},th:{}}, bloodpressure:{points:[]},
  lab:{params:[],panels:[]}, history:{events:[]}, meds:{liste:[]}, termine:[] };
/*STATE-ENDE*/

/* Ein Zeitraum JE KENNZAHL, nicht einer fuer alle. Das Gewicht startet auf «alles»: vier
   Wochen zeigen davon nur −3,9 kg statt −20,3 kg — die Geschichte verschwaende aus dem
   Bild. Blutzucker und Blutdruck starten auf vier Wochen; dort lautet die Frage «wie steht
   es jetzt», und zwei Monate alte Werte beantworten sie nicht.
   Der Taille-Huft-Quotient startet wie das Gewicht auf «alles»: zwischen zwei Messungen
   liegen Wochen bis Jahre, jedes Wochenfenster waere leer.
   «export» ist keine Kennzahl, sondern der Zeitraum des Arzt-Exports - er benutzt dieselben
   Stufen und dieselbe Rechnung. Eine zweite Zeitraum-Mechanik daneben liefe auseinander.
   zeitFrei haelt den ANGEWANDTEN Bereich von «von–bis», zeitEntwurf das, was in den beiden
   Datumsfeldern steht - uebernommen wird erst beim Klick auf «anwenden». */
var UI = { seite:"wand", kz:null, bzView:"verlauf", akte:null, blatt:0, sicht:null, wahl:null,
  zeit:{gewicht:"alles", bz:"28", bd:"28", thq:"alles", export:"alles"}, zeitFrei:{}, zeitEntwurf:{},
  erfTag:0, erfAuf:"auto", erfWerte:{}, erfBz:[neueBzZeile()], erfBzAlt:{},
  erfBp:[neueBpZeile()], erfBpNote:{}, erfKuerzel:{}, erfMeldung:null,
  medEdit:false, medListe:null, medKopf:null };

/* Kuerzel: der wiederkehrende Teil einer Notiz als Knopf, der Rest als Freitext. Deine
   Blutdruck-Notizen zeigen, warum - «Linker Arm | Sitzt» steht vier Mal woertlich gleich
   da, dahinter jedes Mal etwas anderes. Ein reines Textfeld schlaeft nach zwei Wochen ein. */
var KUERZEL = {
  gw:["salzig gegessen","viel getrunken","nach Sport","später als sonst"],
  bz:["viel Kohlenhydrate","spät gegessen","auswärts","nach Sport","krank"],
  bd:["Linker Arm, sitzend","nach Kaffee","auf Arbeit","nach dem Heimweg"]
};

var FROZEN = false;   // wird in der Arztkopie auf true gesetzt

/* ══ Datenkanal ═════════════════════════════════════════════════════════════════
   Vier Fallen, alle vier absichtlich behandelt:
   1. Ein privates Repo antwortet auf eine fehlende Datei UND auf einen Token ohne
      Zugriff mit 404. "gibt es nicht" und "darfst du nicht" sehen gleich aus. Wer das
      als "Datei noch nicht angelegt" liest, stellt die Ampel auf gruen und gibt das
      Schreiben frei - in ein Repo, in das er nicht schreiben darf. Darum wird bei 404
      zuerst das Repo selbst geprueft.
   2. Ueber 1 MB liefert die Contents-API kein content, sondern encoding:"none". Dann
      muss der Rohtext in einer zweiten Anfrage geholt werden.
   3. Beim Schreiben braucht GitHub den sha der Fassung, auf der man aufsetzt. Ist er
      alt (zweites Geraet), kommt 409 oder 422 - dann sha neu holen und EINMAL erneut
      versuchen. Ohne das gehen Eintraege verloren.
   4. Der Token liegt im localStorage dieses Geraets und darf niemals in eine Kopie
      wandern, die aus dem Haus geht. Der Verbinden-Dialog wird darum vor dem Export
      aus dem Dokument entfernt. */
var CFG = null, SHA = null;
function cfgLesen(){ try{ return JSON.parse(localStorage.getItem("mopp.gh")||"null"); }catch(e){ return null; } }
function cfgSchreiben(c){ CFG=c; localStorage.setItem("mopp.gh", JSON.stringify(c)); }
function ghUrl(){ return "https://api.github.com/repos/"+CFG.repo+"/contents/"+CFG.file; }
function ghRef(){ return CFG.branch ? "?ref="+encodeURIComponent(CFG.branch) : ""; }
function ghKopf(x){ var h={ "Authorization":"Bearer "+CFG.token, "X-GitHub-Api-Version":"2022-11-28" };
  if(x) for(var k in x) h[k]=x[k]; return h; }
function ampel(z){ var a=document.getElementById("ampel"); if(!a) return;
  a.className = "ampel" + (z==="an"?" an":z==="busy"?" busy":""); }

async function ghHolen(){
  if(!CFG||!CFG.repo||!CFG.token) return false;
  ampel("busy");
  try{
    var r = await fetch(ghUrl()+ghRef(), {headers:ghKopf({"Accept":"application/vnd.github.object+json"}), cache:"no-store"});
    if(r.status===404){
      var rp = await fetch("https://api.github.com/repos/"+CFG.repo, {headers:ghKopf(), cache:"no-store"});
      if(!rp.ok){ ampel("aus"); return meldung("Kein Zugriff auf "+CFG.repo+". Repo-Name oder Token prüfen.", true); }
      ampel("an"); return meldung("Verbunden. Die Datei "+CFG.file+" gibt es dort noch nicht — der erste Speichervorgang legt sie an.");
    }
    if(!r.ok){ ampel("aus"); return meldung("GitHub antwortet "+r.status+".", true); }
    var j = await r.json();
    SHA = j.sha || null;
    var text;
    if(j.content && j.encoding==="base64"){
      text = new TextDecoder("utf-8").decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")), function(c){ return c.charCodeAt(0); }));
    } else {
      var rr = await fetch(j.download_url, {cache:"no-store"});
      text = await rr.text();
    }
    zustandSetzen(JSON.parse(text));
    ampel("an");
    return true;
  }catch(e){ ampel("aus"); return meldung("Laden fehlgeschlagen: "+e.message, true); }
}

async function ghSchreiben(obj, nochmal){
  if(!CFG||!CFG.repo||!CFG.token) return meldung("Nicht verbunden — es wurde nichts geändert.", true);
  ampel("busy");
  var text = JSON.stringify(obj, null, 2);
  /* In Bloecken kodieren. btoa(String.fromCharCode.apply(null, bytes)) sieht kuerzer aus
     und stirbt bei dieser Dateigroesse: apply mit 166'000 Argumenten wirft RangeError,
     und ein Speichern, das stumm scheitert, ist an dieser Stelle das Schlimmste. */
  var bytes = new TextEncoder().encode(text), roh = "";
  for(var i=0;i<bytes.length;i+=0x8000) roh += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  var b64 = btoa(roh);
  var koerper = { message:"Monitoring "+obj.updated, content:b64 };
  if(CFG.branch) koerper.branch = CFG.branch;
  if(SHA) koerper.sha = SHA;
  var r = await fetch(ghUrl(), {method:"PUT", headers:ghKopf({"Content-Type":"application/json"}), body:JSON.stringify(koerper)});
  if((r.status===409 || r.status===422) && !nochmal){
    var g = await fetch(ghUrl()+ghRef(), {headers:ghKopf(), cache:"no-store"});
    if(g.ok){ var gj = await g.json(); SHA = gj.sha; return ghSchreiben(obj, true); }
  }
  if(!r.ok){ ampel("aus"); return meldung("Speichern fehlgeschlagen ("+r.status+"). Es wurde nichts geändert.", true); }
  var j = await r.json();
  SHA = j.content && j.content.sha;
  ampel("an");
  return true;
}

function meldung(t, fehler){ UI.erfMeldung = {text:t, fehler:!!fehler}; zeichne(); return !fehler; }

/* Der Rueckblick ist am 21.08.2026 ersatzlos gestrichen worden (Entscheid Albrecht):
   persoenliche Wochennotizen gehoeren nicht in eine Krankenakte, die das Haus verlaesst.
   Weggelassen heisst weggelassen - darum wird `review` schon beim Laden verworfen und
   nicht bloss nicht angezeigt. Beim naechsten Speichern faellt der Block aus der Datei. */
function zustandSetzen(o){
  UI.erfStandIso = null;
  for(var k in STATE) delete STATE[k];
  for(var k2 in o) STATE[k2] = o[k2];
  delete STATE.review;
  zeichne();
}

/* ══ Format ═════════════════════════════════════════════════════════════════════ */
function nf(v,dz){ return (v==null||!isFinite(v)) ? "—" : (+v).toFixed(dz==null?1:dz).replace(".",","); }
function dm(iso){ return iso ? iso.slice(8,10)+"."+iso.slice(5,7)+"." : "—"; }
function dmy(iso){ return iso ? dm(iso)+iso.slice(0,4) : "—"; }
function ms(iso){ return new Date(iso+"T12:00:00").getTime(); }
function vz(v,dz){ return (v<0?"−":"+")+nf(Math.abs(v),dz); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function isoVon(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function heuteMs(){ return Date.now(); }
function tage(iso){ return Math.round((heuteMs()-ms(iso))/86400000); }
function zahl(n,e,m){ return n+" "+(n===1?e:m); }
function mittel(a){ return a.length ? a.reduce(function(s,x){return s+x;},0)/a.length : null; }

/* ══ Zeitraum ═══════════════════════════════════════════════════════════════════
   Ein Tag ist eine Kalendereinheit, keine Dauer. «Heute minus sieben Tage» wird darum
   ueber den Kalender gerechnet und nie ueber Millisekunden; und ein Kalendertag wird
   nie mit toISOString() gelesen - unter Europe/Zurich liefert das nachts den Vortag.
   Beide Grenzen sind ISO-Texte und werden als Text verglichen: bei JJJJ-MM-TT ist das
   dieselbe Ordnung wie auf dem Kalender. */
function heuteIso(){ return isoVon(new Date(heuteMs())); }
function isoMinus(iso, n){
  var a = String(iso).split("-");
  return isoVon(new Date(+a[0], +a[1]-1, +a[2]-n, 12, 0, 0));
}
var ZEIT_STUFEN = [ {k:"7", t:"1 Woche", tage:7}, {k:"14", t:"2 Wochen", tage:14},
  {k:"28", t:"4 Wochen", tage:28}, {k:"alles", t:"alles", tage:null}, {k:"frei", t:"von–bis"} ];
/* Ein Zeitraum ohne Messung wird BENANNT, nicht versteckt: ein leeres Bild sieht aus wie
   ein Fehler, dieser Satz sagt, was los ist. */
var LEER_ZEITRAUM = "In diesem Zeitraum liegt keine Messung.";
function fenster(kzk){
  var s = UI.zeit[kzk];
  if(s==="frei"){ var w = UI.zeitFrei[kzk]||{};
    return {k:"frei", tage:null, von:w.von||null, bis:w.bis||null}; }
  var st = ZEIT_STUFEN.filter(function(x){ return x.k===s; })[0] || ZEIT_STUFEN[3];
  return {k:st.k, tage:st.tage, von:(st.tage!=null?isoMinus(heuteIso(), st.tage):null), bis:null};
}
/* DIE Stelle, an der eine Reihe auf ein Fenster gekappt wird. Es gibt keine zweite - zwei
   Grenzwertlogiken laufen auseinander, und dann zeigt das Bild einen anderen Zeitraum als
   die Zahl daneben. Genau das schafft dieser Umbau ab. Eine leere Grenze ist offen. */
function imFenster(reihe, f){
  if(!f || (!f.von && !f.bis)) return (reihe||[]).slice();
  return (reihe||[]).filter(function(x){
    return (!f.von || x.iso>=f.von) && (!f.bis || x.iso<=f.bis); });
}
/* Der Bezug wird ausgeschrieben, nie abgekuerzt: «Ø der letzten 4 Wochen» sagt, wofuer die
   Zahl gilt, «Ø» allein sagt es nicht. */
function fensterLang(f){
  if(f.k==="frei"){
    if(f.von && f.bis) return "vom "+dmy(f.von)+" bis "+dmy(f.bis);
    if(f.von) return "seit dem "+dmy(f.von);
    if(f.bis) return "bis zum "+dmy(f.bis);
    return "der ganzen Periode";
  }
  if(f.tage==null) return "der ganzen Periode";
  if(f.tage===7) return "der letzten Woche";
  return "der letzten "+(f.tage/7)+" Wochen";
}
function zeitEntwurf(kzk){
  if(!UI.zeitEntwurf[kzk]){ var w = UI.zeitFrei[kzk]||{};
    UI.zeitEntwurf[kzk] = {von:w.von||"", bis:w.bis||""}; }
  return UI.zeitEntwurf[kzk];
}
/* Der Schalter selbst. Er steht bei jeder der drei Kurven und nirgends in den Akten: «Ein
   Wert über die Jahre» liegt zwischen 2013 und 2025, jedes Wochenfenster waere dort leer. */
function zeitschalterHtml(kzk){
  var h = '<div class="schalter no-print">'+ZEIT_STUFEN.map(function(s){
      return '<button class="sch'+(UI.zeit[kzk]===s.k?" an":"")+'" data-zeitstufe="'+s.k
        + '" data-zeitkz="'+kzk+'">'+esc(s.t)+'</button>'; }).join("")+'</div>';
  if(UI.zeit[kzk]!=="frei") return h;
  var e = zeitEntwurf(kzk);
  return h + '<div class="vonbis no-print">'
    + '<label><span class="lbl">von</span><input type="date" data-zeitvon="'+kzk+'" value="'+esc(e.von)+'"></label>'
    + '<label><span class="lbl">bis</span><input type="date" data-zeitbis="'+kzk+'" value="'+esc(e.bis)+'"></label>'
    + '<button class="btn" data-zeitanwenden="'+kzk+'">anwenden</button>'
    + '<div class="hinweis">Ein leeres Feld heisst offene Grenze. Übernommen wird erst mit «anwenden».</div></div>';
}

/* ══ Merkzettel-Register ════════════════════════════════════════════════════════
   Der Inhalt der Merkzettel liegt in einem Register, nicht in HTML-Attributen: eine
   Notiz kann Anfuehrungszeichen, Zeilenumbrueche und Emoji enthalten, und was in ein
   Attribut geschrieben und wieder gelesen wird, ist irgendwann kaputt. Das Register
   wird bei jedem zeichne() geleert - sonst waechst es mit jeder Mausbewegung. */
var TIPS = {}, TIPN = 0;
function tipReg(o){ var id = "t"+(++TIPN); TIPS[id] = o; return id; }

/* ══ Blutzucker: acht Messpunkte und zwei Massstaebe ════════════════════════════
   NORM sind die Werte eines Nicht-Diabetikers - sie stehen als gestrichelte Linie im
   Bild und sind das ZIEL. STATE.glucose.th sind Deine Therapiegrenzen und entscheiden
   ueber «im Soll». Beides gleichzeitig, beides beschriftet; wer sie vermischt, macht
   aus einem erreichten Therapieziel ein Versagen oder umgekehrt.
   Gegen feine Messpunkte steht ein statistischer Einwand, und er ist ernst zu nehmen:
   mit 17/35/42 Werten je Gruppe tragen Quartile etwas, mit 6 und 8 nicht. Der Einwand
   ist richtig - falsch ist nur die Antwort, dafuer grob zu gruppieren. Einen Messpunkt zu verschweigen
   loescht die duenne Gruppe nicht, es versteckt sie bloss in einer dicken. Die Antwort
   ist jetzt die ZEILENFORM: sie haengt an der Zahl der Werte, und unter zehn Werten
   steht gar kein Quartilkasten mehr (siehe tagesmuster). So kostet ein feiner Messpunkt
   keine Genauigkeit - er kostet nur einen Kasten, den es nie zu tragen gab. */
var NORM = { pre:5.6, post:7.8 };
/* Eine Messluecke wird fein gestrichelt UEBERBRUECKT, nie gebrochen (Entscheid
   Albrecht vom 21.08.2026). Das Muster ist absichtlich weit von den Ziellinien
   entfernt - die tragen "6 5" bei 1.4 px, diese hier "2 5" bei 1 px und halber
   Deckkraft. Drei Unterschiede, damit niemand eine Luecke fuer ein Ziel haelt. */
var STRICH = "2 5";
/* Die acht Messpunkte in der Reihenfolge EINES TAGES: aufwachen, dann je vor und nach den
   drei Mahlzeiten, zuletzt vor dem Schlafen. Die Reihenfolge ist nicht Geschmack, sie ist
   die Aussage - das Tagesmuster liest sich von oben nach unten wie ein Tag, und wer eine
   Zeile herausnimmt, weil sie leer ist, verbiegt die Form des Tages. Darum bleibt die
   Liste vollstaendig und in dieser Folge.
   Die Schluessel k sind KEINE Anzeigetexte. Es sind die Namen, unter denen die Werte in
   der monitoring.json stehen - «vor Frühstück», «nach Abend», klein und mit Umlaut, so
   wie sie dort einmal geschrieben wurden. Wer sie hier «schoener» schreibt, trennt 98 von
   102 bestehenden Werten von ihrer Gruppe und legt sie unter «ohne Zuordnung» ab.
   Ausgeschrieben wird allein lang, und lang wird nur angezeigt, nie gespeichert. */
var SLOT8 = [
  {k:"nüchtern",         t:"pre",  lang:"morgens nüchtern",     hint:"vor dem Aufstehen oder gleich danach"},
  {k:"vor Frühstück",     t:"pre",  lang:"vor dem Frühstück",   hint:"unmittelbar vor der ersten Mahlzeit"},
  {k:"nach Frühstück",    t:"post", lang:"nach dem Frühstück",  hint:"ein bis zwei Stunden danach"},
  {k:"vor Mittag",        t:"pre",  lang:"vor dem Mittagessen", hint:"unmittelbar davor"},
  {k:"nach Mittag",       t:"post", lang:"nach dem Mittagessen",hint:"ein bis zwei Stunden danach"},
  {k:"vor Abend",         t:"pre",  lang:"vor dem Abendessen",  hint:"unmittelbar davor"},
  {k:"nach Abend",        t:"post", lang:"nach dem Abendessen", hint:"ein bis zwei Stunden danach"},
  {k:"vor dem Schlafen",  t:"post", lang:"vor dem Schlafen",    hint:"die letzte Messung des Tages"} ];

/* Altnamen und Schreibvarianten. null heisst ausdruecklich «nicht zuzuordnen», nicht
   «unbekannt»: «vor Essen» sagt eben NICHT, ob vor Mittag oder vor Abend gemessen wurde. */
var SLOT_ALIAS = {
  "vor dem Essen":null, "vor Essen":null,
  "nach dem Essen":null, "nach Essen":null,
  "vor Frühstueck":"vor Frühstück", "vor Fruehstueck":"vor Frühstück",
  "vor Fruehstück":"vor Frühstück", "vor dem Fruehstueck":"vor Frühstück",
  "nach Frühstueck":"nach Frühstück", "nach Fruehstueck":"nach Frühstück",
  "nach Fruehstück":"nach Frühstück", "nach dem Fruehstueck":"nach Frühstück",
  "Fruehstueck":"nach Frühstück", "Frühstueck":"nach Frühstück"
};

/* Einen beliebigen Slotnamen auf einen der acht Schluessel bringen - oder auf null.
   Die Datei bleibt dabei wie sie ist: was einmal als «nach Essen» erfasst wurde, heisst
   dort weiter so; abgebildet wird nur fuer die Anzeige.
   Die alte Fassung hat in der letzten Zeile GERATEN: alles Unbekannte wurde je nach
   slotType zu «vor Essen» oder «nach Essen». Bei drei groben Gruppen fiel das nicht auf,
   bei acht feinen waere es eine Falschaussage - ein geratener Wert saesse in einer Zeile,
   in der er nie gemessen wurde. Darum am Ende null und kein Rateschluss.
   Ein Wert mit null zaehlt weiter VOLL in Ø, «im Soll» und «unter Norm»; er ist gemessen
   worden, nur sein Zeitpunkt im Tag ist unbekannt. Er steht darum in keiner der acht
   Musterzeilen, sondern in einer eigenen Zeile «ohne Zuordnung». */
function slotKanon(s){
  s = String(s||"");
  if(SLOT8.some(function(x){ return x.k===s; })) return s;
  if(Object.prototype.hasOwnProperty.call(SLOT_ALIAS, s)) return SLOT_ALIAS[s];
  if(/^nüchtern/i.test(s)) return "nüchtern";
  if(/schlaf|nacht/i.test(s)) return "vor dem Schlafen";
  var mahl = /früh|morgen/i.test(s) ? "Frühstück"
    : (/mittag/i.test(s) ? "Mittag" : (/abend/i.test(s) ? "Abend" : null));
  if(mahl){
    if(/^vor/i.test(s))  return "vor "+mahl;
    if(/^nach/i.test(s)) return "nach "+mahl;
  }
  return null;
}
/* EINE Stelle fuer die Typfrage. Vorher lasen zwei Stellen STATE.glucose.slotType[slot]
   unmittelbar - und ein Name, der in dieser Tabelle FEHLT, galt dort still als «post».
   «vor Frühstück» waere so gegen 10,0 gemessen worden statt gegen 7,2: eine stille
   Beschoenigung, die den Anteil «im Soll» zu gut ausfallen laesst und niemandem auffaellt.
   Der Code muss den Typ SELBST wissen. Die Tabelle in der Datei ist Beleg, nicht Quelle -
   sie kann veralten, der eigene Messpunkt nicht. Reihenfolge: SLOT8, dann die Datei,
   dann «post» als letzte Notloesung (die strengere Annahme waere «pre» - aber sie machte
   aus jedem unbekannten Nach-Essen-Wert einen Ausreisser). */
function sollTyp(slot){
  var k = slotKanon(slot);
  var f = k ? SLOT8.filter(function(x){ return x.k===k; })[0] : null;
  if(f) return f.t;
  var ty = (STATE.glucose.slotType||{})[slot];
  return ty || "post";
}
function normFuer(slot){ return sollTyp(slot)==="pre" ? NORM.pre : NORM.post; }

/* ══ Reihen ═════════════════════════════════════════════════════════════════════
   Eine Rechenstelle je Reihe. Wer eine Zahl braucht, holt sie hier - nicht in der
   Ansicht. Es sind sechs: rGewicht, rKoerper, rBzAlle, rBzTage, rBp und rHba1c. */
function rGewicht(){ return (STATE.weight.points||[]).filter(function(p){ return !p.hist && p.value!=null; })
  .map(function(p){ return {iso:p.date, v:+p.value, note:p.note||null}; }).sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function rBzAlle(){ var out=[];
  (STATE.glucose.days||[]).forEach(function(d){ (d.rows||[]).forEach(function(r){ (r.values||[]).forEach(function(v){
    if(v && v.v!=null) out.push({iso:d.iso, slot:r.slot, grp:slotKanon(r.slot), v:+v.v, t:v.t||null, note:v.note||null}); }); }); });
  return out.sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function rBzTage(){ var m={}, nz={};
  rBzAlle().forEach(function(x){ (m[x.iso]=m[x.iso]||[]).push(x.v);
    if(x.note) (nz[x.iso]=nz[x.iso]||[]).push(x.note); });
  (STATE.glucose.days||[]).forEach(function(d){ if(d.note) (nz[d.iso]=nz[d.iso]||[]).unshift(d.note); });
  return Object.keys(m).sort().map(function(iso){ return {iso:iso, v:mittel(m[iso]), n:m[iso].length,
    note:nz[iso]?nz[iso].join(" · "):null}; }); }
function rBp(){ return (STATE.bloodpressure.points||[]).filter(function(p){ return p.sys!=null; })
  .map(function(p){ return {iso:p.iso, v:+p.sys, dia:p.dia!=null?+p.dia:null, pulse:p.pulse!=null?+p.pulse:null,
    slot:p.slot||null, time:p.time||null, note:p.note||null}; })
  .sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
/* HbA1c ist eine Laborreihe, keine Tagesreihe - aber die einzige Laborzahl, die auf
   «Heute» gehoert: sie ist der Wert, nach dem in der Praxis gefragt wird, und ihr ALTER
   ist selbst eine Aussage. Vier Monate sind der uebliche Abstand bei behandeltem Diabetes. */
function rHba1c(){ return (STATE.lab.panels||[]).filter(function(p){ return p.values && p.values.hba1c!=null; })
  .map(function(p){ return {iso:p.date, v:+p.values.hba1c, quelle:p.source||""}; })
  .sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function hba1cAlter(iso){ return Math.round(tage(iso)/30.44); }

/* ── Taille-Hueft-Quotient ───────────────────────────────────────────────────────
   THQ = Taille ÷ Hüfte. Er sagt, WO das Gewicht sitzt - und das sagt keine andere Zahl im
   Werkzeug: waehrend das Gewicht um 20 kg fiel, ist der THQ von 1,205 auf 1,222 gestiegen,
   weil die Huefte prozentual mehr verloren hat als die Taille. 1,0 ist die Grenze, ab der
   Bauchfett beim Mann als Risiko eingestuft wird; sie ist ein Massstab, keine Mahnung.
   Diese Funktion ist die EINZIGE Stelle, an der geteilt wird. Eine zweite Division in einer
   Ansicht liefe beim ersten Rundungswunsch auseinander - und dann stuenden in Kachel und
   Vollbild zwei verschiedene Zahlen fuer dasselbe.
   Die alten Punkte (hist:true) bleiben drin: anders als beim Gewicht gibt es hier keine
   Periode, die zaehlt, sondern nur die Reihe - 2018 ist der Beleg, dass es schon einmal
   tiefer war. Ein Punkt ohne Taille ODER ohne Huefte ergibt keinen Quotienten und faellt
   weg; die Brust faehrt mit, sie ist gemessen worden. */
var THQ_GRENZE = 1.0;
function rKoerper(){ return ((STATE.body&&STATE.body.points)||[])
  .filter(function(p){ return p.waist!=null && p.hip!=null && +p.hip>0; })
  .map(function(p){ return {iso:p.date, v:(+p.waist)/(+p.hip), waist:+p.waist, hip:+p.hip,
    chest:p.chest!=null?+p.chest:null, note:p.note||null}; })
  .sort(function(a,b){ return a.iso<b.iso?-1:1; }); }

/* ══ Linien ═════════════════════════════════════════════════════════════════════
   Eine Messluecke ist kein Messwert. Bis zum doppelten ueblichen Abstand (mindestens
   acht Tage) laeuft die Linie durch, darueber eine fein gestrichelte Bruecke. Die
   Linie BRICHT NIE - egal wie lang die Luecke ist. Die Untergrenze von acht Tagen ist
   Absicht: der blosse Median bestraft jeden Kadenzwechsel - als im Juni wochentlich
   und im August taeglich gewogen wurde, sank er auf drei Tage und machte die voellig
   regelmaessige Wochenwaegung nachtraeglich zur Luecke. */
function segmente(reihe, XY, schwellen){
  var pts = (reihe||[]).filter(function(x){ return x && x.v!=null; });
  if(!pts.length) return [];
  if(pts.length===1) return [{p:stummel(XY(pts[0])), strich:null}];
  var iv=[]; for(var i=1;i<pts.length;i++) iv.push((ms(pts[i].iso)-ms(pts[i-1].iso))/86400000);
  var s = iv.slice().sort(function(a,b){return a-b;}), med = s[Math.floor(s.length/2)]||1;
  /* != null statt || : eine uebergebene 0 hiesse «jede Luecke ist eine Bruecke» und
     darf nicht still auf den Vorgabewert zurueckfallen. */
  var voll = (schwellen && schwellen.voll != null) ? schwellen.voll : Math.max(8, 2*med);
  var out=[], enden={}, lauf=[XY(pts[0])];
  function schliesse(){ if(lauf.length>1) out.push({p:lauf.join(" "), strich:null});
    else if(lauf.length===1) out.push({p:stummel(lauf[0]), strich:null, allein:lauf[0]}); }
  for(var j=1;j<pts.length;j++){
    var dt = (ms(pts[j].iso)-ms(pts[j-1].iso))/86400000;
    if(dt<=voll){ lauf.push(XY(pts[j])); continue; }
    schliesse();
    var a=XY(pts[j-1]), b=XY(pts[j]); out.push({p:a+" "+b, strich:STRICH}); enden[a]=1; enden[b]=1;
    lauf=[XY(pts[j])];
  }
  schliesse();
  return out.filter(function(x){ return !x.allein || !enden[x.allein]; });
}
function stummel(xy){ var a=xy.split(","), x=Math.max(0,+a[0]-1.6);
  return x.toFixed(1)+","+a[1]+" "+(x+3.2).toFixed(1)+","+a[1]; }

/* Funkenlinie fuer die Kacheln. Keine Achsen, keine Punkte - dafuer gilt in der Kachel:
   was fein gestrichelt ist, wurde nicht gemessen. Die Linie bricht nie, sonst saehe
   eine Luecke in der Kachel wie zwei getrennte Kurven aus. */
function funke(reihe, farbe, w, h, schwellen){
  var v = (reihe||[]).map(function(x){return x.v;});
  if(!v.length) return "";
  w=w||260; h=h||46;
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v), sp=(mx-mn)||1, p=3;
  var x0=ms(reihe[0].iso), x1=ms(reihe[reihe.length-1].iso), sx=(x1-x0)||1;
  function XY(r){ return (((ms(r.iso)-x0)/sx)*w).toFixed(1)+","+(p+(1-(r.v-mn)/sp)*(h-2*p)).toFixed(1); }
  return segmente(reihe, XY, schwellen).map(function(s){
    return '<polyline points="'+s.p+'" fill="none" stroke="'+farbe+'" stroke-width="'+(s.strich?1:1.6)+'"'
      + (s.strich?' stroke-dasharray="'+s.strich+'" stroke-linecap="round" opacity=".5"':'') + ' vector-effect="non-scaling-stroke"></polyline>';
  }).join("");
}
/* Trefferflaechen auch in der Kachel: die Funke ist klein, aber der Merkzettel soll
   ueberall dieselbe Antwort geben. In der Kachel nur beim Ueberfahren - ein Tippen
   gehoert dort dem Sprung ins Vollbild. */
function funkeHits(reihe, w, h, opt){
  opt = opt||{};
  var pts = (reihe||[]).filter(function(x){ return x && x.v!=null; });
  if(pts.length<2) return "";
  var x0=ms(pts[0].iso), x1=ms(pts[pts.length-1].iso), sx=(x1-x0)||1;
  var xs = pts.map(function(r){ return ((ms(r.iso)-x0)/sx)*w; });
  return pts.map(function(r,i){
    var lo = i ? (xs[i]+xs[i-1])/2 : 0, hi = i<pts.length-1 ? (xs[i]+xs[i+1])/2 : w;
    var id = tipReg({ tag:dmy(r.iso), wert:nf(r.v,opt.dez==null?1:opt.dez), einheit:opt.einheit||"",
      sub:opt.sub?opt.sub(r):"", notiz:r.note||"" });
    return '<rect class="hit" data-tip="'+id+'" data-nurhover="1" x="'+lo.toFixed(1)+'" y="0" width="'
      + Math.max(1,hi-lo).toFixed(1)+'" height="'+h+'"></rect>';
  }).join("");
}
function funkeSvg(inhalt, w, h, hits){
  return '<svg viewBox="0 0 '+(w||260)+' '+(h||46)+'" preserveAspectRatio="none" style="width:100%;height:'+(h||46)+'px;display:block;margin-top:12px">'+inhalt+(hits||"")+'</svg>';
}

/* Grosses Diagramm: Achsen, jeder Messpunkt als Raute. Hier darf keine Messung fehlen.
   Zwei Ebenen, die verschiedene Fragen beantworten: die FLAECHE (opt.zone) ist der
   Bereich, in dem ein Wert unbedenklich ist - Flaeche plus beide Kanten, damit der
   Rand nicht geraten werden muss. Die GESTRICHELTEN Linien (opt.linien) sind der
   angestrebte Massstab. Die Flaeche sagt «unbedenklich», die Linie sagt «Ziel». */
/* Wie breit das Bild auf dem Bildschirm wirklich wird. Gemessen wird am BEHAELTER, nicht
   am Fenster: jedes bild() sitzt in einer .buehne, und die nimmt 1 px Rand und 24 px
   Polsterung je Seite. window.innerWidth waere die falsche Zahl - ein Element in einer
   Kachel ist schmaler als das Fenster.
   Aus dieser Breite und der viewBox-Breite kommt der Faktor, mit dem der Browser das
   ganze Bild staucht: bei 390 px Fensterbreite ist das SVG 304 px breit, Faktor 0,42 -
   und font-size="10.5" erscheint als 4,4 px. bildHoch() ist der Kehrwert, mit dem jede
   Schrift im Bild hochgerechnet wird. Nach oben gedeckelt bei 1, damit auf breiten
   Fenstern nichts waechst; nach unten bei 4, damit die Raender ein sehr schmales
   Element nicht auffressen. */
var BILD_VB = 720;              // viewBox-Breite, unveraendert
var BILD_ZEICHEN = 0.64;        // Zeichenbreite der Monospace, in Vielfachen der Schrifthoehe
var bildBreiteMerk = 0, bildZweiterLauf = false, bildTakt = null;
function bildBreitePx(){
  var n = document.getElementById("haupt");
  var b = n ? n.clientWidth - 50 : 0;
  return b > 40 ? b : BILD_VB;
}
function bildHoch(){
  var f = BILD_VB / bildBreitePx();
  return f<=1 ? 1 : (f>4 ? 4 : f);
}
function fz(x){ return +x.toFixed(2); }

function bild(reihen, opt){
  opt = opt||{};
  var L=46,R=690,T=16,B=222, alle=[];
  reihen.forEach(function(r){ (r.pts||[]).forEach(function(p){ if(p.v!=null) alle.push(p); }); });
  if(!alle.length) return '<div class="bildtext">Noch nicht gemessen.</div>';
  var xs=alle.map(function(p){return ms(p.iso);});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  if(x1===x0){ x0-=86400000; x1+=86400000; }
  var vs=alle.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(opt.zone){ mn=Math.min(mn,opt.zone[0]); mx=Math.max(mx,opt.zone[1]); }
  (opt.linien||[]).forEach(function(l){ mn=Math.min(mn,l.v); mx=Math.max(mx,l.v); });
  var pad=(mx-mn)*0.12||1; mn-=pad; mx+=pad;
  /* ── Massstab ────────────────────────────────────────────────────────────────────
     Jede Schriftgroesse im Bild wird mit bildHoch() hochgerechnet, damit sie auf dem
     Bildschirm nicht unter rund 10 px faellt. Groessere Schrift braucht mehr Rand: die
     Achsenzahlen links, die Etiketten der Ziellinien rechts und die Datumsmarken unten
     bekommen ihren Platz aus der gerechneten Schriftgroesse und nicht aus einer festen
     Zahl. Bei hoch===1 kommt genau die alte Geometrie heraus - 46, 690, 242, 250. */
  var hoch = bildHoch(), fsA = fz(10.5*hoch), fsL = fz(10*hoch);
  /* Fuenf Achsenzahlen brauchen vier Abstaende. Waere die Schrift so gross, dass zwei
     einander beruehren, stehen drei statt fuenf: weniger Marken, nie kleinere Schrift.
     Bei 390 px greift das nicht - erst unterhalb von rund 200 px Bildbreite. */
  var nY = (1.35*fsA > (B-T)/4) ? 3 : 5;
  /* Die Achse braucht so viele Nachkommastellen, wie es fuer unterscheidbare Zahlen
     braucht. Mit dem Zeitraum-Schalter kann der Wertebereich sehr eng werden - im
     Wochenfenster des Gewichts liegen 0,3 kg zwischen erster und letzter Messung, und
     fuenfmal «112,4» untereinander ist keine Achse. Wo die Zahlen ohnehin schon
     verschieden sind, aendert sich nichts. */
  var adez = opt.dez==null?1:opt.dez, achse;
  while(true){
    achse = []; for(var q=0;q<nY;q++) achse.push(nf(mn+(mx-mn)*q/(nY-1), adez));
    if(adez>=3 || achse.filter(function(x,ix){ return achse.indexOf(x)===ix; }).length===nY) break;
    adez++;
  }
  var zA = BILD_ZEICHEN*fsA, zL = BILD_ZEICHEN*fsL;
  var breitAchse = Math.max.apply(null, achse.map(function(s){ return s.length; }))*zA;
  var breitLinie = Math.max.apply(null, (opt.linien||[]).map(function(l){
    return String(l.label||nf(l.v,1)).length; }).concat([0]))*zL;
  var halbDatum = 3*zA;                     // «20.08.» sind sechs Zeichen, halb davon
  /* Links Platz fuer die breiteste Achsenzahl samt 6 px Luft zur Gitterlinie - und fuer
     die halbe erste Datumsmarke, die genau ueber L sitzt. Rechts Platz fuer das Etikett
     der Ziellinie UND fuer die halbe letzte Datumsmarke, die genau ueber R sitzt. */
  L = +Math.max(46, breitAchse+12, halbDatum).toFixed(1);
  R = +Math.min(690, BILD_VB-halbDatum, breitLinie ? BILD_VB-5-breitLinie : 690).toFixed(1);
  /* Die Datumszeile haelt Abstand zur untersten Achsenzahl, und der Abstand waechst mit
     der Schrift: die unterste Achsenzahl haengt 0,55 Schrifthoehen unter die Grundachse,
     die Datumsmarke ragt 0,905 ueber ihre eigene Grundlinie, dazu 0,45 Luft. Mit fester
     Zahl statt Vielfachem lagen bei 390 px die «2,2» der Achse und die «18.06.» der
     Datumszeile aufeinander - der Folgefehler der groesseren Schrift. Bei fsA=10.5 kommt
     genau die alte Zeile 242 heraus, und die viewBox bleibt 250 hoch. */
  var yDatum = B + 1.9073*fsA;
  var VBH = Math.max(250, Math.ceil(yDatum + 0.25*fsA + 3));
  function X(iso){ return L+((ms(iso)-x0)/(x1-x0))*(R-L); }
  function Y(v){ return T+(1-(v-mn)/((mx-mn)||1))*(B-T); }
  var h="";
  if(opt.zone){
    var yz1=Y(opt.zone[1]), yz2=Y(opt.zone[0]);
    h += '<rect x="'+L+'" y="'+yz1.toFixed(1)+'" width="'+(R-L)+'" height="'+Math.abs(yz2-yz1).toFixed(1)+'" fill="var(--zone)"></rect>'
      +  '<line x1="'+L+'" y1="'+yz1.toFixed(1)+'" x2="'+R+'" y2="'+yz1.toFixed(1)+'" stroke="var(--zone-kante)" stroke-width="1"></line>'
      +  '<line x1="'+L+'" y1="'+yz2.toFixed(1)+'" x2="'+R+'" y2="'+yz2.toFixed(1)+'" stroke="var(--zone-kante)" stroke-width="1"></line>';
  }
  for(var i=0;i<nY;i++){
    var v=mn+(mx-mn)*i/(nY-1), y=Y(v);
    h += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"></line>'
      +  '<text x="'+(L-6)+'" y="'+(y+fsA/3).toFixed(1)+'" text-anchor="end" fill="var(--faint)" font-size="'+fsA+'" font-family="var(--mono)">'+achse[i]+'</text>';
  }
  (opt.linien||[]).forEach(function(l){
    var ly=Y(l.v);
    h += '<line x1="'+L+'" y1="'+ly.toFixed(1)+'" x2="'+R+'" y2="'+ly.toFixed(1)+'" stroke="'+(l.farbe||"var(--warn)")
      + '" stroke-width="1.4" stroke-dasharray="6 5"'+(l.blass?' opacity=".55"':'')+'></line>'
      + '<text x="'+(R+5)+'" y="'+(ly+0.35*fsL).toFixed(1)+'" fill="'+(l.farbe||"var(--warn)")+'" font-size="'+fsL+'" '
      + 'font-family="var(--mono)"'+(l.blass?' opacity=".7"':'')+'>'+esc(l.label||nf(l.v,1))+'</text>';
  });
  /* Datumsmarken: erste, letzte, mittlere - in DIESER Reihenfolge vergeben. Gesetzt wird
     eine Marke nur, wenn sie eine schon gesetzte nicht beruehrt; auf schmalen Fenstern
     weicht damit die mittlere und nie eine der beiden Grenzen. Das ist die Regel, nach
     der weggelassen wird - nicht der Zufall, und nie durch kleinere Schrift. */
  var isos=alle.map(function(p){return p.iso;}).sort();
  var gesetzt=[];
  [0,1,0.5].forEach(function(f){
    var iso=isos[Math.round(f*(isos.length-1))], x=X(iso), halb=dm(iso).length*zA/2;
    var a=x-halb, b=x+halb;
    if(gesetzt.some(function(g){ return b>g.a-4 && a<g.b+4; })) return;
    gesetzt.push({f:f, iso:iso, x:x, a:a, b:b});
  });
  gesetzt.sort(function(a,b){ return a.f-b.f; }).forEach(function(g){
    h += '<text x="'+g.x.toFixed(1)+'" y="'+yDatum.toFixed(1)+'" text-anchor="middle" fill="var(--faint)" font-size="'+fsA+'" font-family="var(--mono)">'+dm(g.iso)+'</text>'; });
  var bruecken=0;
  reihen.forEach(function(r){
    function XY(p){ return X(p.iso).toFixed(1)+","+Y(p.v).toFixed(1); }
    segmente(r.pts, XY, opt.schwellen).forEach(function(s){
      if(s.strich) bruecken++;
      h += '<polyline points="'+s.p+'" fill="none" stroke="'+r.farbe+'" stroke-width="'+(s.strich?1:(r.dick||2))+'"'
        + (s.strich?' stroke-dasharray="'+s.strich+'" stroke-linecap="round" opacity=".55"':'') + ' stroke-linejoin="round"></polyline>';
    });
    (r.pts||[]).forEach(function(p){ if(p.v==null) return;
      h += '<circle cx="'+X(p.iso).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(r.r||2.6)+'" fill="'+r.farbe+'"></circle>'; });
  });
  /* Merkzettel: eine Trefferflaeche je Tag, halber Weg zum Nachbarn. Was der Zettel
     zeigt, steht in der Reihe selbst - so muss die Ansicht nichts nachschlagen.
     An einem Tag mit mehreren Messungen wird ZUSAMMENGEFASST, nicht aufgezaehlt: am
     02.08. lagen sechs Blutdruckmessungen, und zwoelf Einzelwerte in einem Zettel sind
     keine Antwort, sondern eine Tabelle. */
  var proTag = {};
  reihen.forEach(function(r, ri){ (r.pts||[]).forEach(function(p){ if(p.v==null) return;
    var d = proTag[p.iso] = proTag[p.iso] || {};
    (d[ri] = d[ri] || {r:r, pts:[]}).pts.push(p); }); });
  var tage = Object.keys(proTag).sort();
  var tx = tage.map(X);
  var notizen = 0;
  h += tage.map(function(iso, i){
    var lo = i ? (tx[i]+tx[i-1])/2 : L, hi = i<tage.length-1 ? (tx[i]+tx[i+1])/2 : R;
    var d = proTag[iso], ks = Object.keys(d).sort();
    /* Der Durchschnitt ist die Antwort, nicht die Liste. Die Spanne kommt nur dazu, wenn
       sie etwas sagt - am 02.08. lagen sechs Blutdruckmessungen zwischen 100 und 126,
       das verschweigt ein Mittelwert. An einem gewoehnlichen Tag steht sie nicht da. */
    function zeig(g){
      var vs = g.pts.map(function(x){ return x.v; });
      var dez = g.r.dez==null ? (opt.dez==null?1:opt.dez) : g.r.dez;
      var m = mittel(vs);
      if(vs.length===1) return {txt:nf(m,dez), breit:false};
      var mn2=Math.min.apply(null,vs), mx2=Math.max.apply(null,vs);
      var breit = m ? (mx2-mn2)/Math.abs(m) > 0.08 : false;
      return {txt:(vs.length>1?"Ø ":"")+nf(m,dez), breit:breit,
        spanne:nf(mn2,dez)+"–"+nf(mx2,dez)};
    }
    var erste = d[ks[0]], n = erste.pts.length, e0 = zeig(erste);
    var teile = [];
    if(n>1) teile.push(zahl(n,"Messung","Messungen"));
    else if(opt.sub){ var s0 = opt.sub(erste.pts[0]); if(s0) teile.push(s0); }
    ks.slice(1).forEach(function(k){ var z=zeig(d[k]);
      teile.push((d[k].r.name?d[k].r.name+" ":"")+z.txt); });
    if(e0.breit) teile.push("Spanne "+e0.spanne);
    var note = ks.reduce(function(a,k){ return a.concat(d[k].pts.map(function(p){ return p.note||""; })); }, [])
      .filter(Boolean).filter(function(x,ix,arr){ return arr.indexOf(x)===ix; }).join(" · ");
    if(note) notizen++;
    var id = tipReg({ tag:dmy(iso), wert:e0.txt, einheit:opt.einheit||"",
      sub:teile.join(" · "), notiz:note });
    return '<rect class="hit" data-tip="'+id+'" x="'+lo.toFixed(1)+'" y="'+T+'" width="'
      + Math.max(1,hi-lo).toFixed(1)+'" height="'+(B-T)+'"></rect>'
      + (note ? '<circle class="notizpunkt" cx="'+tx[i].toFixed(1)+'" cy="'+(B+9)+'" r="2.4"></circle>' : "");
  }).join("");
  var text = opt.text||"";
  if(bruecken) text += " Wo fein gestrichelt, liegt zwischen zwei Messungen kein Wert — die Linie verbindet sie trotzdem.";
  if(notizen) text += " Der kleine gelbe Punkt unter der Achse heisst: an diesem Tag steht eine Notiz.";
  return '<svg viewBox="0 0 '+BILD_VB+' '+VBH+'" style="width:100%;height:auto;display:block;margin-top:18px">'+h+'</svg>'
    + (text?'<div class="bildtext">'+text+'</div>':'');
}

/* ══ Kennzahlen ═════════════════════════════════════════════════════════════════
   Vier, nicht zwanzig. Jede beantwortet eine Frage, die taeglich gestellt wird;
   alles Uebrige ist Nebenzahl und steht als Zeile im Vollbild. */
function ampelFarbe(gut, warn){ return gut ? "var(--good)" : (warn ? "var(--warn)" : "var(--ink)"); }

function KZ(){
  var Gall=rGewicht(), BZall=rBzAlle(), BZTall=rBzTage(), BPall=rBp();
  var th=STATE.glucose.th||{}, wt=STATE.weight||{};
  /* Ein Fenster je Kennzahl - und dasselbe Fenster fuer Bild UND Zahl. Vorher stand in der
     Blutzucker-Kachel die Zahl fuer 14 Messtage und der Prozentsatz fuer alle Messungen der
     Periode, in EINER Zeile. Genau das schafft der Schalter ab. */
  var fg=fenster("gewicht"), fb=fenster("bz"), fd=fenster("bd"), fq=fenster("thq");
  var G=imFenster(Gall,fg), BZ=imFenster(BZall,fb), BZT=imFenster(BZTall,fb), BP=imFenster(BPall,fd);
  /* Der THQ hat sein eigenes Fenster, seine eigene Kennzahl und seit dem 21.08.2026 eine
     eigene Kachel auf der Kachelwand. */
  var Kall=rKoerper(), K=imFenster(Kall,fq);
  var kL=K.length?K[K.length-1]:null, kLa=Kall.length?Kall[Kall.length-1]:null;
  var bzOe = mittel(BZ.map(function(x){return x.v;}));
  var HB = rHba1c(), hbL = HB.length?HB[HB.length-1]:null;
  var imSoll = BZ.filter(function(x){ return sollTyp(x.slot)==="pre" ? x.v<=th.preHigh : x.v<=th.postHigh; });
  var pSoll = BZ.length ? Math.round(100*imSoll.length/BZ.length) : null;
  var bpL = BP.length?BP[BP.length-1]:null;
  var bpD = BP.filter(function(p){ return p.dia!=null; });
  var bpOe = BP.length ? Math.round(mittel(BP.map(function(p){return p.v;}))) : null;
  var bpOeD = bpD.length ? Math.round(mittel(bpD.map(function(p){return p.dia;}))) : null;
  var bpTageN = Object.keys(BP.reduce(function(m,p){ m[p.iso]=1; return m; },{})).length;
  var gL = G.length?G[G.length-1]:null, gLa = Gall.length?Gall[Gall.length-1]:null;
  var start = wt.startRef!=null ? +wt.startRef : (Gall.length?Gall[0].v:null);

  return {
    gewicht:{ key:"gewicht", label:"Gewicht", einheit:"kg", reihe:G, farbe:"var(--good)", dez:1,
      wert:gL?nf(gL.v,1):"—", zustand:"var(--ink)", tempo:tempo(G),
      /* DIE Ausnahme, und die einzige: die Kachel traegt die GESAMTBILANZ seit dem
         Startwert. Das ist eine Bilanz, kein Fensterausschnitt - sie schrumpft nicht mit
         dem Schalter, sonst waeren aus −20,3 kg im Vier-Wochen-Fenster −3,9 kg geworden. */
      unter:(gLa ? "seit "+dm(Gall[0].iso)+" "+vz(gLa.v-start,1)+" kg" : "")
        + (gLa && wt.goal1!=null ? " · Ziel 1: "+nf(wt.goal1,0)+" kg · Abstand "+nf(gLa.v-wt.goal1,1)+" kg" : "")
        + (gLa && wt.heightCm ? " · BMI "+nf(gLa.v/Math.pow(wt.heightCm/100,2),1) : ""),
      meta:zahl(G.length,"Messung","Messungen")+" · "+fensterLang(fg) },
    /* Eigene Kachel, Entscheid Albrecht vom 21.08.2026. Zuerst stand der THQ als Zahl in
       der Unterzeile des Gewichts - das war zu vorsichtig. Er hat den zweitlaengsten
       Verlauf im Werkzeug (16 Messungen ueber acht Jahre) und sagt etwas, das keine andere
       Zahl sagt: das Gewicht fiel um 20 kg, der THQ STIEG. Dass er nur alle paar Wochen
       gemessen wird, spricht nicht dagegen - der HbA1c auf «Heute» ist 16 Monate alt, und
       dort ist das Alter die Aussage. Genau darum traegt die Kachel ihr Messdatum. */
    thq:{ key:"thq", label:"Taille-Hüft-Quotient", einheit:"Taille ÷ Hüfte", reihe:K,
      farbe:"var(--akzent)", dez:2,
      sub:function(p){ return "Taille "+nf(p.waist,0)+" · Hüfte "+nf(p.hip,0)+" cm"; },
      wert:kL?nf(kL.v,2):"—",
      zustand:kL?ampelFarbe(kL.v<THQ_GRENZE, kL.v>=THQ_GRENZE):"var(--ink)",
      unter:K.length ? "zuletzt "+dm(kL.iso)+" · Taille "+nf(kL.waist,0)+" zu Hüfte "+nf(kL.hip,0)
                       +" cm · Grenze "+nf(THQ_GRENZE,1) : "",
      meta:zahl(K.length,"Messung","Messungen")+" · "+fensterLang(fq) },
    bz:{ key:"bz", label:"Blutzucker", einheit:"mmol/l", reihe:BZT, farbe:"var(--akzent)", dez:1,
      sub:function(p){ return zahl(p.n||1,"Messung","Messungen"); },
      wert:BZ.length?nf(bzOe,1):"—",
      zustand:BZ.length?ampelFarbe(pSoll>=90, pSoll<75):"var(--ink)",
      /* Ohne Messung im Fenster steht hier NICHTS: die Leermeldung traegt die Kachel
         unten als Bildplatzhalter, so wie es das Gewicht macht. Stand sie zusaetzlich
         als Untertitel, sagte die Kachel denselben Satz zweimal. */
      unter:BZ.length ? "Ø "+fensterLang(fb)+" · im Soll: "+pSoll+" % dieser "+BZ.length+" Messungen"
                      : "",
      unter2: hbL
        ? '<span style="color:var(--faint)">HbA1c</span> <b style="font-weight:640;color:var(--ink)">'
          + nf(hbL.v,1)+' %</b> <span style="color:var(--faint)">vom '+dmy(hbL.iso)+' — '
          + zahl(hba1cAlter(hbL.iso),"Monat","Monate")+' alt</span>'
        : '<span style="color:var(--faint)">Kein HbA1c im Labor erfasst.</span>',
      meta:BZ.length+" Messungen · "+zahl(BZT.length,"Tag","Tage")+" · "+fensterLang(fb) },
    bd:{ key:"bd", label:"Blutdruck", einheit:"mmHg", reihe:BP, farbe:"var(--akzent)", dez:0,
      sub:function(p){ return [p.slot?slotLang(p.slot):"", p.dia!=null?"diastolisch "+Math.round(p.dia):"",
        p.pulse!=null?"Puls "+Math.round(p.pulse):"", p.time||""].filter(Boolean).join(" · "); },
      wert:bpL?(Math.round(bpL.v)+"/"+Math.round(bpL.dia)):"—",
      zustand:ampelFarbe(bpL&&bpL.v<130, bpL&&bpL.v>=140),
      unter:BP.length ? "zuletzt "+dm(bpL.iso)+" · Ø "+fensterLang(fd)+" "+bpOe+"/"+bpOeD+" mmHg"
                      : "",
      meta:BP.length+" Messungen · "+zahl(bpTageN,"Tag","Tage")+" · "+fensterLang(fd) }
  };
}

/* ══ Ebene 1 · Heute ════════════════════════════════════════════════════════════ */
function zeichneStatus(){
  var t = (STATE.termine||[]).filter(function(x){ return x.date && ms(x.date)>heuteMs(); })
    .sort(function(a,b){ return a.date<b.date?-1:1; })[0];
  var termin = t ? (t.wer||"Termin")+" am "+dm(t.date)+", in "+Math.abs(tage(t.date))+" Tagen." : "";
  /* Steht kein Termin an, bleibt keine leere Leiste stehen: die Zeile wird ausgeblendet. */
  var st = document.getElementById("status");
  st.hidden = !termin;
  st.innerHTML = termin ? '<div style="color:var(--faint)">'+esc(termin)+'</div>' : "";
}

function kachelHtml(d, leit){
  var w = leit?700:260, hh = leit?90:46;
  var f = funke(d.reihe, d.farbe, w, hh);
  var hits = funkeHits(d.reihe, w, hh, {dez:d.dez, einheit:d.einheit, sub:d.sub});
  /* Die Funke folgt dem Zeitraum ihrer Kennzahl - sonst zeigten Kachel und Vollbild
     verschiedene Strecken. Das Tempo daneben ebenso; die Bilanzzeile darunter nicht,
     sie ist die genannte Ausnahme (siehe KZ). */
  var zusatz = (leit && d.tempo!=null)
    ? '<div style="font-size:16px;color:var(--good);font-weight:600;margin-left:6px">'+vz(d.tempo,2)+' kg/Woche</div>'
    : '';
  return '<button class="kachel'+(leit?" leit":"")+'" data-kz="'+d.key+'">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">'
    +   '<div class="k-name">'+esc(d.label)+'</div>'
    +   (leit?'<div class="k-meta" style="margin:0">'+esc(d.meta)+'</div>':'')
    + '</div>'
    + '<div class="k-reihe"><div class="k-zahl" style="color:'+d.zustand+'">'+d.wert+'</div>'
    +   '<div class="k-einheit">'+esc(d.einheit)+'</div>'+zusatz+'</div>'
    + '<div class="k-unter">'+esc(d.unter||"")+'</div>'
    + (d.unter2?'<div class="k-unter" style="margin-top:2px">'+d.unter2+'</div>':'')
    + (d.reihe.length ? funkeSvg(f, w, hh, hits)
        : '<div class="bildtext" style="margin-top:12px">'+esc(LEER_ZEITRAUM)+'</div>')
    + (leit?'':'<div class="k-meta">'+esc(d.meta)+'</div>')
    + '</button>';
}

/* Tempo einer Reihe: vom ersten zum letzten Punkt, auf die Woche gerechnet. Welcher
   Ausschnitt gemeint ist, entscheidet der Aufrufer mit imFenster - hier wird kein zweites
   Mal gefiltert. */
function tempo(reihe){
  var p = reihe||[];
  if(p.length<2) return null;
  var a = p[0], b = p[p.length-1];
  var dt = (ms(b.iso)-ms(a.iso))/86400000;
  return dt>0 ? (b.v-a.v)/dt*7 : null;
}

function zeichneWand(){
  var kz = KZ();
  return '<div class="wand">'
    + kachelHtml(kz.gewicht, true)
    + '<div class="kacheln">'+[kz.bz,kz.bd,kz.thq].map(function(d){ return kachelHtml(d); }).join("")+'</div>'
    + '<button class="aktenknopf" id="btnAkten"><div>Labor, Krankengeschichte, Medikation, Rohdaten</div>'
    +   '<div style="border:1px solid var(--line);border-radius:9px;padding:7px 14px;color:var(--akzent)">Akten</div></button>'
    + '</div>';
}

/* ══ Ebene 2 · eine Kennzahl gross ══════════════════════════════════════════════ */

    return '<div><div class="n-lbl">'+esc(r.l)+'</div><div class="n-wert"'+(r.f?' style="color:'+r.f+'"':'')+'>'+esc(r.w)+'</div>'
      + '<div class="n-unter">'+esc(r.u||"")+'</div></div>'; }).join("")+'</div>';
}
function schalterHtml(items){
