/* ══ Erfassen ═══════════════════════════════════════════════════════════════════
   Eine Liste, nicht eine Seite. Offen ist immer nur eine Zeile - von selbst die erste,
   die an diesem Tag noch fehlt. Es gibt nur den Tag: Gewicht, Blutzucker, Blutdruck -
   drei Werte, die alle auf dasselbe Datum gehoeren. */
/* Ein Tag ist eine KALENDEREINHEIT, keine Dauer. Mit Millisekunden gerechnet sprang
   «einen Tag zurueck» unter Europe/Zurich am 30.03.2026 um 00:30 vom 30. direkt auf den
   28. Maerz - der 29. war unerreichbar, ein Nachtrag waere am falschen Datum gelandet.
   Der Date-Konstruktor zaehlt ueber Kalendertage und kennt die Zeitumstellung. */
function erfIso(){ var d = new Date(heuteMs()); d.setDate(d.getDate() - UI.erfTag); return isoVon(d); }
/* «heute» gilt nur heute. Wird ein zurueckliegender Tag nachgetragen, nennt die Kachel
   den TAG, um den es geht - «2 Messungen heute» an einem Tag, der eine Woche zurueckliegt,
   ist schlicht falsch und laesst den Nachtrag am richtigen Datum zweifeln. */
function erfWann(){ return UI.erfTag===0 ? "heute" : "am "+dmy(erfIso()); }
/* Was am gewaehlten Tag schon in der Datei steht, gehoert IN die Maske. Sonst laesst sich
   ein einmal falsch eingetippter Wert nie mehr berichtigen - gemeldet am 16.08.2026 an
   einem unsinnigen Taille-Wert, an den die Erfassung nicht mehr herankam.
   UI.erfStand haelt daneben den Dateistand: geschrieben wird nur, was davon abweicht,
   ein geleertes Feld entfernt den Wert. So ist die Maske Anzeige UND Korrektur. */
function standVom(iso){
  var S = {};
  var g = ((STATE.weight&&STATE.weight.points)||[]).filter(function(p){ return p.date===iso; })[0];
  if(g && g.value!=null) S.gewicht = nf(g.value,1);
  /* Taille, Huefte und Brust tragen denselben Tagesstand wie das Gewicht: was fuer diesen
     Tag in der Datei steht, steht im Feld. Geschrieben wird als Text der Datei, nicht
     gerundet - sonst machte ein Oeffnen der Maske aus 132,5 stillschweigend 133. */
  var b = ((STATE.body&&STATE.body.points)||[]).filter(function(p){ return p.date===iso; })[0];
  if(b){
    if(b.waist!=null) S.taille = String(b.waist).replace(".",",");
    if(b.hip!=null)   S.huefte = String(b.hip).replace(".",",");
    if(b.chest!=null) S.brust  = String(b.chest).replace(".",",");
  }
  /* Der Blutzucker steht NICHT mehr hier drin. Frueher fuellte diese Stelle ein festes
     Feld je Messpunkt vor - und nur dann, wenn an dem Messpunkt genau ein Wert lag; bei
     zweien haengte das Feld an und berichtigte nichts. Die Zeilenliste kennt dieses
     Problem nicht: sie zeigt jede Messung des Tages einzeln (siehe bzAlt), auch die
     zweite und dritte. Die Vorbelegung hat damit nichts mehr zu tragen. */
  return S;
}
function standAuffrischen(iso){
  if(UI.erfStandIso === iso) return;
  UI.erfStandIso = iso;
  UI.erfStand = standVom(iso);
  for(var k in UI.erfStand) UI.erfWerte[k] = UI.erfStand[k];
}
/* Geaendert heisst: anders als in der Datei. Nur das wird geschrieben. */
function wertGeaendert(k){
  var s = (UI.erfStand||{})[k], v = UI.erfWerte[k];
  return String(v==null?"":v).trim() !== String(s==null?"":s).trim();
}
function erfHat(reihe){ var iso=erfIso(); return reihe.some(function(x){ return x.iso===iso; }); }
function tv(k){ var v=UI.erfWerte[k]; return v==null?"":String(v); }
function num(s){ if(s==null) return null; s=String(s).trim().replace(",","."); return s===""?null:(isFinite(+s)?+s:null); }

/* Uhrzeit: gelesen wird grosszuegig, geschrieben wird streng. «7:15», «07.15» und
   «0715» meinen dasselbe und werden alle zu «07:15»; was sich nicht als Uhrzeit lesen
   laesst, gibt "" zurueck und wird beim Speichern zur Speicherzeit. Erzwungen wird
   nichts - ein Feld, das die Eingabe zurueckweist, haelt beim Erfassen auf, und die
   Uhrzeit ist die am wenigsten wichtige Angabe einer Messung. */
function zeitNorm(s){
  var m = /^\s*(\d{1,2})[:.\s]?(\d{2})\s*$/.exec(String(s==null?"":s));
  if(!m) return "";
  var st = +m[1], mi = +m[2];
  if(st>23 || mi>59) return "";
  return String(st).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}
function jetztZeit(){ var d = new Date(heuteMs());
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* Eine neue, leere Blutzucker-Zeile. Die Uhrzeit steht nur dann schon drin, wenn HEUTE
   erfasst wird: beim Nachtragen eines frueheren Tages waere «jetzt» nachweislich falsch,
   und eine falsche Vorgabe ist schlimmer als gar keine - sie wird uebersehen und
   mitgespeichert. UI ist beim ersten Aufruf (im UI-Literal selbst) noch undefined; dann
   ist erfTag 0, also heute, und die Uhrzeit gehoert hin. */
function neueBzZeile(){
  return {slot:"", zeit:(typeof UI!=="undefined" && UI && UI.erfTag>0) ? "" : jetztZeit(), v:"", note:""};
}
/* Dieselbe Regel fuer den Blutdruck: Messpunkt leer, Uhrzeit nur am heutigen Tag. */
function neueBpZeile(){
  return {slot:"", zeit:(typeof UI!=="undefined" && UI && UI.erfTag>0) ? "" : jetztZeit(),
    sys:"", dia:"", puls:"", note:""};
}
/* Die Vorgabe altert, wenn die Seite lange offen steht. Beim Oeffnen des Erfassens wird
   sie darum aufgefrischt - aber nur an einer noch voellig unberuehrten einzelnen Zeile,
   damit kein eingetippter Entwurf ueberschrieben wird. */
function erfZeitAuffrischen(){
  if(UI.erfTag!==0) return;
  if(UI.erfBz.length===1){
    var r = UI.erfBz[0];
    if(!(r.slot || String(r.v).trim() || String(r.note).trim())) r.zeit = jetztZeit();
  }
  if(UI.erfBp.length===1){
    var b = UI.erfBp[0];
    if(!(b.slot || String(b.sys).trim() || String(b.dia).trim() || String(b.puls).trim()
      || String(b.note).trim())) b.zeit = jetztZeit();
  }
}
/* Der Anzeigetext eines Messpunkts. Ein Altname, den slotKanon nicht zuordnet, steht
   woertlich da - erfunden wird nichts, auch hier nicht. */
function slotLang(slot){
  var k = slotKanon(slot);
  var f = k ? SLOT8.filter(function(x){ return x.k===k; })[0] : null;
  return f ? f.lang : String(slot||"");
}
/* Die Auswahlliste der acht Messpunkte - EINE Stelle fuer Blutzucker UND Blutdruck. Zwei
   Kopien derselben Liste laufen beim ersten neuen Messpunkt auseinander, und dann steht in
   der einen Maske etwas anderes zur Wahl als in der anderen. */
function slotOptionen(gewaehlt){
  return '<option value=""'+(gewaehlt?"":" selected")+'>Messpunkt wählen</option>'
    + SLOT8.map(function(s){
        return '<option value="'+esc(s.k)+'"'+(gewaehlt===s.k?" selected":"")+'>'+esc(s.lang)+'</option>'; }).join("");
}
/* Bestehende Blutzuckermessungen des Tages - dieselbe Ordnung wie beim Blutdruck:
   was schon in der Datei liegt, steht ueber der neuen Zeile und bleibt berichtigbar.
   Der Schluessel traegt Tag, Messpunkt, Zeit UND Wert: allein die Position waere nach
   dem naechsten Sortieren eine andere Messung. */
function bzSchluessel(x){ return x.iso+"|"+x.slot+"|"+(x.t||"")+"|"+x.v; }
function bzAlt(){
  var iso = erfIso();
  return rBzAlle().filter(function(x){ return x.iso===iso; }).map(function(x){
    var s = bzSchluessel(x), e = UI.erfBzAlt[s] || {};
    var wAlt = nf(x.v,1), nAlt = x.note||"";
    var w = (e.v!==undefined ? e.v : wAlt), note = (e.note!==undefined ? e.note : nAlt);
    return { s:s, slot:x.slot, lang:slotLang(x.slot), zeit:x.t||"", v:x.v,
      wAlt:wAlt, w:w, nAlt:nAlt, note:note,
      wGeaendert:(e.v!==undefined && String(w).trim()!==wAlt),
      nGeaendert:(e.note!==undefined && String(note).trim()!==nAlt) };
  });
}
function bzAltGeaendert(){
  return bzAlt().filter(function(p){ return p.wGeaendert || p.nGeaendert; }).length;
}
/* Wie viele NEUE Messungen im Entwurf stehen. Gezaehlt wird nur, was auch geschrieben
   werden kann: eine Zeile ohne Messpunkt hat keinen Ort in der Datei, und ein Zaehler,
   der etwas verspricht, das «Speichern» dann nicht schreibt, ist eine Luege. */
function bzNeuZeilen(){
  return UI.erfBz.filter(function(r){ return r.slot && num(r.v)!=null; });
}

/* Auf einen Tag springen - aus der Statuszeile oder aus den Rohdaten. Der Entwurf wird
   geleert (er gehoert zu EINEM Tag), die BESTEHENDEN Notizen dieses Tages werden aber in
   die Felder gelegt: sonst kann man eine Notiz nur ergaenzen, nicht berichtigen. */
function erfTagSetzen(n, oeffneNotiz){
  UI.erfTag = Math.max(0, n|0);
  UI.erfAuf = "auto"; UI.erfMeldung = null; UI.erfKuerzel = {};
  UI.erfWerte = {}; UI.erfBp = [neueBpZeile()];
  UI.erfBpNote = {}; UI.erfStandIso = null;
  /* Der Blutzucker-Entwurf gehoert zu EINEM Tag wie der des Blutdrucks - und die
     vorbelegte Uhrzeit erst recht: «jetzt» gilt nur fuer heute. Beides wird darum im
     selben Zug geleert; UI.erfTag steht oben schon auf dem neuen Tag. */
  UI.erfBz = [neueBzZeile()]; UI.erfBzAlt = {};
  var iso = erfIso(), zuerst = null;
  var g = rGewicht().filter(function(x){ return x.iso===iso; })[0];
  if(g && g.note){ UI.erfWerte.note_gw = g.note; zuerst = zuerst||"gw"; }
  var d = (STATE.glucose.days||[]).filter(function(x){ return x.iso===iso; })[0];
  if(d && d.note){ UI.erfWerte.note_bz = d.note; zuerst = zuerst||"bz"; }
  if(!zuerst && rBp().some(function(p){ return p.iso===iso && p.note; })) zuerst = "bd";
  /* Wer aus den Rohdaten kommt, will die Notiz berichtigen - dann muss die Kachel offen
     stehen, in der sie liegt. Wer aus der Statuszeile kommt, will einen Wert nachtragen;
     dort bleibt die uebliche Wahl (die erste Luecke des Tages). */
  if(oeffneNotiz && zuerst) UI.erfAuf = zuerst;
}
/* Bestehende Blutdruckmessungen des Tages. Die Notiz haengt an der MESSUNG, nicht am Tag -
   am 06.08. steht an einer «auf Arbeit. stress» und an der naechsten «nach der Arbeit,
   Heimweg zu Fuss». Zu einer Tagesnotiz verschmolzen weiss niemand mehr, welcher Wert
   wozu gehoert. Darum bekommt jede Messung ihr eigenes Feld.
   Der Schluessel traegt Zeit UND Werte: allein die Position waere beim naechsten Sortieren
   eine andere Messung. */
/* Wie viel steht im Entwurf. Eine Stelle, zwei Aufrufer: das Zeichnen und die Eingabe.
   Die Eingabe zeichnet NICHT neu (das Feld verloere den Fokus), sie frischt nur die
   Fusszeile auf - sonst bleibt Speichern grau, obwohl eine Notiz geaendert wurde. */
function erfAnzahl(){
  var bpNeu = UI.erfBp.filter(function(r){ return String(r.sys).trim()!=="" || String(r.dia).trim()!==""; }).length;
  return Object.keys(UI.erfWerte).filter(function(k){
      return k.indexOf("note_")!==0 && wertGeaendert(k); }).length
    + bzNeuZeilen().length + bzAltGeaendert()
    + bpNeu + ["gw","bz"].filter(notizGeaendert).length + bpNotizGeaendert();
}
function fussAuffrischen(){
  var b = document.getElementById("btnSpeichern"), z = document.getElementById("erfZaehler");
  if(!b || !z) return;
  var n = erfAnzahl();
  b.disabled = !n;
  z.textContent = zahl(n,"Wert","Werte")+" eingetippt · geschrieben wird direkt in die "
    + ((CFG&&CFG.file)||"monitoring.json");
}
function bpSchluessel(p){ return p.iso+"|"+(p.time||"")+"|"+p.v+"|"+p.dia; }
function bpAlt(){
  var iso = erfIso();
  return rBp().filter(function(x){ return x.iso===iso; }).map(function(p){
    var s = bpSchluessel(p);
    return { s:s, slot:p.slot||"", time:p.time||"", sys:p.v, dia:p.dia, pulse:p.pulse,
      alt:p.note||"", note:(UI.erfBpNote[s]!==undefined ? UI.erfBpNote[s] : (p.note||"")) };
  });
}
function bpNotizGeaendert(){
  return bpAlt().filter(function(p){ return UI.erfBpNote[p.s]!==undefined && p.note.trim()!==p.alt; }).length;
}
function notizStand(k){
  var iso = erfIso();
  if(k==="gw"){ var g=rGewicht().filter(function(x){return x.iso===iso;})[0]; return (g&&g.note)||""; }
  if(k==="bz"){ var d=(STATE.glucose.days||[]).filter(function(x){return x.iso===iso;})[0]; return (d&&d.note)||""; }
  return "";
}
/* Notiz einer Kachel: Kuerzel und Freitext ergeben EINEN Text. Was gespeichert wird, ist
   das, was hier herauskommt - es gibt keine zweite Fassung, die auseinanderlaufen koennte.
   Ein Kuerzel, das im Freitext schon woertlich steht, wird nicht doppelt gesetzt: beim
   Berichtigen liegt der alte Text samt Kuerzeln im Feld. */
function kuerzelAn(k){ return UI.erfKuerzel[k]||[]; }
/* Wohin ein Kuerzel gehoert, haengt daran, wie oft am Tag gemessen wird. Beim GEWICHT
   gibt es einen Wert am Tag - «salzig gegessen» gilt dem Tag, also der Tagesnotiz.
   Bei Blutzucker und Blutdruck stehen mehrere Messungen am selben Tag, und «nach Sport»
   gilt einer davon; dort haengt das Kuerzel an der einzelnen NEUEN Messung (siehe
   speichern). Wuerde es zusaetzlich in die Tagesnotiz laufen, stuende es doppelt da. */
var KUERZEL_ZUR_NOTIZ = { gw:true };
function notizText(k){
  var frei = String(UI.erfWerte["note_"+k]||"").trim();
  if(!KUERZEL_ZUR_NOTIZ[k]) return frei;
  var kw = kuerzelAn(k).filter(function(x){ return frei.indexOf(x)<0; });
  return [kw.join(" · "), frei].filter(Boolean).join(" · ");
}
function kuerzelBlock(k, text){
  return '<div class="kuerzel">'+(KUERZEL[k]||[]).map(function(x){
      var an = kuerzelAn(k).indexOf(x)>=0;
      return '<button class="kz-knopf'+(an?" an":"")+'" data-kuerzel="'+k+'" data-kw="'+esc(x)+'">'+esc(x)+(an?" ✓":"")+'</button>'; }).join("")
    + '</div>'+(text?'<div class="bildtext">'+esc(text)+'</div>':'');
}
/* Geaendert heisst: anders als das, was in der Datei steht. Nur dann ist Speichern noetig -
   und nur dann darf eine Notiz allein, ohne Messwert, ein Schreiben ausloesen. */
function notizGeaendert(k){
  /* Ein blosses Kuerzel zaehlt nur dort als Aenderung, wo es ueberhaupt in die Notiz
     laeuft. Sonst loeschte ein Klick auf «nach Sport» beim Blutzucker die bestehende
     Tagesnotiz - notizText() gaebe "" zurueck und das waere ungleich dem Dateistand. */
  if(UI.erfWerte["note_"+k]===undefined && !(KUERZEL_ZUR_NOTIZ[k] && kuerzelAn(k).length)) return false;
  return notizText(k) !== notizStand(k);
}
function notizBlock(k){
  var alt = notizStand(k);
  return '<div class="lbl" style="margin-top:16px">Notiz zum Tag'
    + (alt?'<span style="text-transform:none;letter-spacing:0;color:var(--akzent);margin-left:8px">wird berichtigt</span>':'')
    + '</div>'
    + (KUERZEL_ZUR_NOTIZ[k] ? kuerzelBlock(k) : '')
    + '<textarea class="notiz" data-w="note_'+k+'" placeholder="und was Du sonst festhalten willst…" '
    + 'style="margin-top:9px">'+esc(UI.erfWerte["note_"+k]||"")+'</textarea>'
    + (alt?'<div class="bildtext">Der bestehende Text steht im Feld — was Du hier stehen lässt, ersetzt ihn. Leer heisst: Notiz entfernen.</div>':'');
}

function zeichneErf(){
  var iso = erfIso(), wt = new Date(iso+"T12:00:00").getDay();
  standAuffrischen(iso);
  var TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var G=rGewicht(), BZT=rBzTage(), BP=rBp();
  var auf = UI.erfAuf==="auto"
    ? (!erfHat(G)?"gw":(!erfHat(BZT)?"bz":(!erfHat(BP)?"bd":null))) : UI.erfAuf;
  var gE = G.filter(function(x){return x.iso===iso;})[0], bzE = BZT.filter(function(x){return x.iso===iso;})[0];
  /* Liegt fuer diesen Tag schon ein Umfang in der Datei, sagt die Kachel es - sonst sieht
     ein vorbelegtes Feld wie eine Eingabe aus, die man selbst gemacht hat. */
  var bE = ((STATE.body&&STATE.body.points)||[]).filter(function(p){ return p.date===iso; })[0];
  var bpT = BP.filter(function(x){return x.iso===iso;});
  var bzNeu = bzNeuZeilen().length;
  var bpNeu = UI.erfBp.filter(function(r){ return String(r.sys).trim()!=="" || String(r.dia).trim()!==""; }).length;

  /* Eine Kachel traegt den heutigen Stand, nicht bloss ihren Namen: erledigt zeigt den
     Wert, offen ein Plus. Die offene Kachel waechst an Ort und Stelle auf volle Breite -
     es bleibt bei einer offenen Kachel, damit der Daumen weiss, wo er ist. */
  function kachel(k, name, wert, gruen, sub, koerper){
    if(auf===k) return '<div class="ek offen" style="grid-column:1/-1">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">'
      +   '<div class="k-name" style="color:var(--akzent)">'+esc(name)+'</div>'
      +   '<button class="btn" data-erf="'+k+'" style="padding:4px 10px;font-size:13px">zuklappen</button></div>'
      + koerper + '</div>';
    return '<button class="ek'+(gruen?" fertig":"")+'" data-erf="'+k+'">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
      +   '<div class="k-name">'+esc(name)+'</div>'+(gruen?'<div style="color:var(--good);font-size:14px">✓</div>':'')+'</div>'
      + '<div style="display:flex;align-items:baseline;gap:6px;margin-top:8px">'
      +   (wert ? '<div class="ek-wert"'+(gruen?' style="color:var(--good)"':'')+'>'+esc(wert)+'</div>'
               : '<div class="ek-plus">+</div><div style="font-size:14px;color:var(--muted)">eintragen</div>')
      + '</div>'
      + '<div class="ek-sub">'+esc(sub||"")+'</div></button>';
  }

  /* Der Kopf ist EINE Zeile: Pfeil, Datum, Pfeil - und das × ganz rechts in derselben
     Zeile statt in einer eigenen darunter. Die Groessen stehen in .erf-kopf und nicht hier:
     eine Media Query erreicht keinen inline gesetzten Stil, und bei 390 px muss das Datum
     schmaler werden duerfen. */
  var h = '<div class="buehne"><div class="b-kopf"><div style="min-width:0;flex:1 1 100%">'
    + '<div class="k-name">Erfassen</div>'
    + '<div class="erf-kopf">'
    +   '<button class="btn nav" data-tag="-1" title="einen Tag nachtragen">‹</button>'
    +   '<div class="tag">'+(UI.erfTag===0?"heute · ":"")+dmy(iso)+'</div>'
    +   '<button class="btn nav" data-tag="1"'
    +     (UI.erfTag===0?' style="opacity:.35;cursor:default" disabled':'')+'>›</button>'
    +   '<button class="btn rund" data-zu="1">×</button>'
    + '</div></div></div>'
    + '<div style="font-size:13.5px;color:var(--faint);margin-top:8px">'
    +   (UI.erfTag===0
          ? "Mit ‹ einen Tag zurück, um einen früheren Tag zu erfassen oder zu berichtigen. Die Zukunft ist gesperrt."
          : "Du trägst "+TAGE[wt]+", den "+dmy(iso)+" nach — "+zahl(UI.erfTag,"Tag","Tage")+" zurück.")
    + '</div>'
    + '<div class="abschnitt">Der Tag · '+TAGE[wt]+'</div>'
    + '<div class="kacheln" style="margin-top:14px">';

  h += kachel("gw", "Gewicht",
    tv("gewicht") ? tv("gewicht")+" kg" : "",
    !!gE && !wertGeaendert("gewicht"),
    gE ? (gE.note||erfWann()+" erfasst") : (G.length?"zuletzt "+dmy(G[G.length-1].iso)+" · "+nf(G[G.length-1].v,1)+" kg":""),
    '<div style="display:flex;align-items:center;gap:10px;margin-top:12px">'
    + '<input type="text" inputmode="decimal" data-w="gewicht" value="'+esc(tv("gewicht"))+'" placeholder="kg" style="width:130px">'
    + '<div style="font-size:14.5px;color:var(--faint)">kg</div></div>'
    + (gE?'<div class="bildtext">Im Feld steht der Wert dieses Tages — ändern berichtigt ihn, leeren entfernt ihn.</div>':'')
    /* Die Umfaenge stehen HIER und nicht in einem eigenen Abschnitt: sie werden am selben
       Tag mit demselben Massband genommen wie das Gewicht auf der Waage. Kein Takt, keine
       Faelligkeit, kein Fortschritt - drei Felder, die leer bleiben duerfen. Feste drei
       Spalten statt auto-fit: bei 390 px waeren aus auto-fit zwei plus eine geworden, und
       Taille, Huefte und Brust gehoeren nebeneinander. */
    + '<div class="bildtext" style="margin-top:16px">Umfänge, wenn Du sie gemessen hast — leer ist kein Mangel.</div>'
    + '<div class="felder" style="grid-template-columns:repeat(3,1fr);margin-top:8px">'
    +   ["taille","huefte","brust"].map(function(mk,mi){
          var lbl = ["Taille cm","Hüfte cm","Brust cm"][mi], ph = "cm";
          return '<div class="feld"><div class="lbl">'+esc(lbl)+'</div>'
            + '<input type="text" inputmode="decimal" data-w="'+mk+'" value="'+esc(tv(mk))+'" placeholder="'+ph+'"></div>';
        }).join("")
    + '</div>'
    + (bE?'<div class="bildtext">Auch hier steht der Stand dieses Tages — ändern berichtigt, leeren entfernt.</div>':'')
    + notizBlock("gw"));

  h += kachel("bz", "Blutzucker",
    bzNeu ? zahl(bzNeu,"Wert","Werte") : (bzE?nf(bzE.v,1):""),
    !!bzE && !bzNeu,
    bzE ? zahl(bzE.n,"Messung","Messungen")+" "+erfWann() : (BZT.length?"zuletzt "+dmy(BZT[BZT.length-1].iso):""),
    (function(){
      /* Eine Zeile je Messung, nicht ein Feld je Messpunkt. Acht feste Felder waeren
         nicht nur zu breit fuer das Telefon - acht leere Felder FORDERN zum Ausfuellen
         auf, und an einem gewoehnlichen Tag wird zwei- oder dreimal gemessen. Die Liste
         beginnt mit einer Zeile und waechst nur auf Verlangen. */
      var A = bzAlt(), th = STATE.glucose.th||{};
      /* Der dreistufige Hinweis richtet sich nach dem GEWAEHLTEN Messpunkt: vor dem
         Essen gilt 5,6 als Massstab, danach 7,8. Ohne Auswahl steht dort nichts -
         gegen welche Grenze ein Wert gemessen wird, ist dann noch offen. */
      function hinweis(slot, v){
        if(!slot) return {t:"", f:"var(--faint)"};
        var f = SLOT8.filter(function(x){ return x.k===slot; })[0];
        if(!f) return {t:"", f:"var(--faint)"};
        var soll = f.t==="pre" ? NORM.pre : NORM.post;
        if(v==null) return {t:f.hint, f:"var(--faint)"};
        if(v<soll) return {t:"unter "+nf(soll,1)+" — wie ein Nicht-Diabetiker", f:"var(--good)"};
        if(v<=th.postHigh) return {t:"über "+nf(soll,1)+", im Korridor", f:"var(--warn)"};
        return {t:"über dem Korridor", f:"var(--high)"};
      }
      return (A.length
        ? '<div class="lbl" style="margin-top:12px">An diesem Tag schon erfasst</div>'
          + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">'
          + A.map(function(p){
              return '<div class="bz-zeile">'
                + '<div class="sel"><b style="font-size:14.5px;font-weight:620">'+esc(p.lang)+'</b>'
                +   (p.zeit?'<div class="mono" style="font-size:11px;color:var(--faint)">'+esc(p.zeit)+'</div>':'')
                + '</div>'
                + '<div class="wert"><input type="text" inputmode="decimal" data-bzalt="'+esc(p.s)+'" data-f="v" '
                +   'value="'+esc(p.w)+'" placeholder="mmol/l"'+(p.wGeaendert?' style="border-color:var(--akzent)"':'')+'></div>'
                + '<div class="anmerk"><input type="text" data-bzalt="'+esc(p.s)+'" data-f="note" '
                +   'value="'+esc(p.note)+'" placeholder="Notiz zu dieser Messung"'
                +   (p.nGeaendert?' style="border-color:var(--akzent)"':'')+'></div>'
                + '</div>'; }).join("")
          + '</div><div class="bildtext">Hier steht, was schon in der Datei liegt — Wert und Notiz lassen sich ändern, ein geleertes Wertfeld entfernt die Messung.</div>'
          + '<div class="lbl" style="margin-top:18px">Neue Messung</div>'
        : '')
      + '<div style="display:flex;flex-direction:column;gap:14px;margin-top:'+(A.length?8:12)+'px">'
      + UI.erfBz.map(function(r,i){
          var hw = hinweis(r.slot, num(r.v));
          return '<div class="bz-zeile">'
            + '<div class="sel"><select data-bz="'+i+'" data-f="slot">'
            +   '<option value=""'+(r.slot?"":" selected")+'>Messpunkt wählen</option>'
            +   SLOT8.map(function(s){
                  return '<option value="'+esc(s.k)+'"'+(r.slot===s.k?" selected":"")+'>'+esc(s.lang)+'</option>'; }).join("")
            + '</select></div>'
            + '<div class="zeit"><input type="text" inputmode="numeric" data-bz="'+i+'" data-f="zeit" '
            +   'value="'+esc(r.zeit)+'" placeholder="hh:mm"></div>'
            + '<div class="wert"><input type="text" inputmode="decimal" data-bz="'+i+'" data-f="v" '
            +   'value="'+esc(r.v)+'" placeholder="mmol/l"></div>'
            + '<div class="anmerk"><input type="text" data-bz="'+i+'" data-f="note" '
            +   'value="'+esc(r.note||"")+'" placeholder="Notiz zu dieser Messung"></div>'
            + (hw.t?'<div class="anker" style="color:'+hw.f+'">'+esc(hw.t)+'</div>':'')
            + '</div>'; }).join("")
      + '<button class="btn" id="btnBzPlus" style="align-self:flex-start;color:var(--akzent)">+ weitere Messung</button>'
      + '</div>'
      /* Erst der Erklaertext, dann die Kuerzel, dann die Notizfelder. Zwischen «+ weitere
         Messung» und dem Text sahen die Kuerzel wie ein Teil der Zeilenliste aus - sie
         gehoeren aber zur Notiz. Und zwei Saetze reichen: fuenf Zeilen auf dem Telefon
         erklaerten, was die Maske selbst zeigt. */
      + '<div class="bildtext">Eine Zeile je Messung — so viele oder so wenige, wie an diesem Tag angefallen sind. Die Uhrzeit ist vorgeschlagen und darf stehen bleiben oder weichen.</div>'
      + kuerzelBlock("bz", "Gewählte Kürzel stehen vor der Notiz jeder NEUEN Messung.")
      + notizBlock("bz");
    })());

  h += kachel("bd", "Blutdruck",
    bpNeu ? zahl(bpNeu,"Messung","Messungen") : (bpT.length?Math.round(bpT[0].v)+"/"+Math.round(bpT[0].dia):""),
    !!bpT.length && !bpNeu,
    bpT.length ? zahl(bpT.length,"Messung","Messungen")+" "+erfWann()
      : (BP.length?"zuletzt "+dmy(BP[BP.length-1].iso)+" · "+Math.round(BP[BP.length-1].v)+"/"+Math.round(BP[BP.length-1].dia):""),
    (function(){
      var A = bpAlt();
      return (A.length
        ? '<div class="lbl" style="margin-top:12px">An diesem Tag schon erfasst</div>'
          + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">'
          + A.map(function(p){
              /* Zusaetzlich der Messpunkt, sofern einer gesetzt ist - «128/82» allein sagt
                 nicht, wovon es spricht. Das Notizfeld bleibt, wie es war. */
              return '<div class="bz-zeile">'
                + '<div class="sel"><b style="font-size:14.5px;font-weight:620">'
                +   Math.round(p.sys)+'/'+Math.round(p.dia)+'</b>'
                + ((p.slot||p.time)
                    ? '<div class="mono" style="font-size:11px;color:var(--faint)">'
                      + esc([p.slot?slotLang(p.slot):"", p.time].filter(Boolean).join(" · "))+'</div>' : '')
                + '</div>'
                + '<div class="anmerk"><input type="text" data-bpalt="'+esc(p.s)+'" value="'+esc(p.note)+'" '
                +   'placeholder="Notiz zu dieser Messung" style="height:42px;font-size:14.5px'
                +   (p.note.trim()!==p.alt?';border-color:var(--akzent)':'')+'"></div>'
                + '</div>'; }).join("")
          + '</div><div class="bildtext">Hier steht, was schon in der Datei liegt — die Notiz lässt sich ändern, leeren entfernt sie. Die Werte selbst bleiben, wie gemessen wurde.</div>'
          + '<div class="lbl" style="margin-top:18px">Neue Messung</div>'
        : '')
      + '<div style="display:flex;flex-direction:column;gap:14px;margin-top:'+(A.length?8:12)+'px">'
      + UI.erfBp.map(function(r,i){
          /* Dieselbe Zeilenform wie beim Blutzucker: Messpunkt, Uhrzeit, dann die drei
             Zahlen, dann die Notiz. Ohne Messpunkt und Uhrzeit sagt «128/82» nicht, wovon
             es spricht - und die Auswahlliste ist DIESELBE wie dort (slotOptionen), nicht
             eine zweite Kopie, die auseinanderliefe. */
          return '<div class="bz-zeile bp">'
            + '<div class="sel"><select data-bp="'+i+'" data-f="slot">'+slotOptionen(r.slot)+'</select></div>'
            + '<div class="zeit"><input type="text" inputmode="numeric" data-bp="'+i+'" data-f="zeit" '
            +   'value="'+esc(r.zeit||"")+'" placeholder="hh:mm"></div>'
            + '<div class="zahl"><input type="text" inputmode="numeric" data-bp="'+i+'" data-f="sys" '
            +   'value="'+esc(r.sys)+'" placeholder="sys"></div>'
            + '<div class="zahl"><input type="text" inputmode="numeric" data-bp="'+i+'" data-f="dia" '
            +   'value="'+esc(r.dia)+'" placeholder="dia"></div>'
            + '<div class="zahl"><input type="text" inputmode="numeric" data-bp="'+i+'" data-f="puls" '
            +   'value="'+esc(r.puls)+'" placeholder="Puls"></div>'
            + '<div class="anmerk"><input type="text" data-bp="'+i+'" data-f="note" '
            +   'value="'+esc(r.note||"")+'" placeholder="Notiz zu dieser Messung"></div>'
            + '</div>'; }).join("")
      + '<button class="btn" id="btnBpPlus" style="align-self:flex-start;color:var(--akzent)">+ weitere Messung</button>'
      + '</div>'
      /* Dasselbe Verhaeltnis wie beim Blutzucker: zwei Saetze, dann die Kuerzel unmittelbar
         vor den Notizfeldern. */
      + '<div class="bildtext">Eine Zeile je Messung — so viele oder so wenige, wie an diesem Tag angefallen sind. Die Uhrzeit ist vorgeschlagen und darf stehen bleiben oder weichen.</div>'
      + kuerzelBlock("bd", "Gewählte Kürzel stehen vor der Notiz jeder NEUEN Messung.");
    })());

  h += '</div>';

  var anzahl = erfAnzahl();
  h += '<div class="fuss-erf"><div id="erfZaehler">'+zahl(anzahl,"Wert","Werte")+' eingetippt · geschrieben wird direkt in die '
    + esc((CFG&&CFG.file)||"monitoring.json")+'</div><div style="display:flex;gap:9px">'
    + '<button class="btn" data-zu="1">Abbrechen</button>'
    + '<button class="btn stark" id="btnSpeichern"'+(anzahl?"":" disabled")+'>Speichern</button></div></div>';
  if(UI.erfMeldung) h += '<div class="meldung '+(UI.erfMeldung.fehler?"fehler":"ok")+'">'+esc(UI.erfMeldung.text)+'</div>';
  return h + '</div>';
}

/* Schreiben: an dieselben Stellen, aus denen gelesen wird. Jeder Wert traegt ein Datum
   und steht an seinem Tag - einen Wochenanker gibt es nicht mehr. */
function punktSetzen(liste, schluessel, iso, felder){
  var p = liste.filter(function(x){ return x[schluessel]===iso; })[0];
  if(!p){ p={}; p[schluessel]=iso; liste.push(p); }
  for(var k in felder) if(felder[k]!=null) p[k]=felder[k];
  liste.sort(function(a,b){ return a[schluessel]<b[schluessel]?-1:1; });
  return p;
}

async function speichern(){
  /* Erst pruefen, dann rechnen, dann schreiben - und die Mutationen laufen auf einer
     KOPIE. Der erste Anlauf hat STATE sofort geaendert und danach gemeldet «es wurde
     nichts geschrieben»: die Kacheln zeigten den Wert als erfasst, im Repo stand er
     nicht. Ein Werkzeug, das ueber den eigenen Datenstand luegt, ist schlimmer als
     eines, das nicht speichert. */
  if(!CFG || !CFG.repo || !CFG.token)
    return meldung("Nicht verbunden — bitte zuerst über ⚙ den Datenspeicher verbinden. Es wurde nichts geändert.", true);
  var iso = erfIso(), W = UI.erfWerte, geschrieben = 0;
  var N = JSON.parse(JSON.stringify(STATE));
  N.weight = N.weight||{points:[]}; N.weight.points = N.weight.points||[];
  N.body = N.body||{points:[]}; N.body.points = N.body.points||[];
  N.glucose = N.glucose||{days:[]}; N.glucose.days = N.glucose.days||[];
  N.bloodpressure = N.bloodpressure||{points:[]}; N.bloodpressure.points = N.bloodpressure.points||[];

  /* 0 kg ist keine Messung, sondern ein leeres Feld - dieselbe Falle wie bei den
     Umfaengen: num("0") ist 0 und damit nicht null. */
  var g = num(W.gewicht); if(g!=null && g<=0) g = null;
  var nGw = notizText("gw");
  if(wertGeaendert("gewicht") || notizGeaendert("gw")){
    if(g!=null){
      var gp2 = punktSetzen(N.weight.points, "date", iso, {value:g});
      if(notizGeaendert("gw")){ if(nGw) gp2.note = nGw; else delete gp2.note; }
      geschrieben++;
    } else {
      var gp = N.weight.points.filter(function(p){ return p.date===iso; })[0];
      if(gp && wertGeaendert("gewicht")){
        /* Geleert heisst entfernt - das ist der Weg aus einem Vertipper heraus. */
        N.weight.points = N.weight.points.filter(function(p){ return p.date!==iso; }); geschrieben++;
      } else if(gp){ if(nGw) gp.note = nGw; else delete gp.note; geschrieben++; }
    }
  }

  /* Taille, Huefte, Brust - derselbe Weg wie beim Gewicht, an denselben Tag. Geschrieben
     wird nur, was gegenueber der Datei anders ist; ein geleertes Feld entfernt das Mass,
     und ein Punkt ohne jedes Mass bleibt nicht als leere Huelse stehen. Die Feldnamen sind
     die der Datei: chest, waist, hip am Datumsfeld date. */
  var MASSE = [{k:"taille", f:"waist"}, {k:"huefte", f:"hip"}, {k:"brust", f:"chest"}];
  /* Ein Umfang von 0 cm ist keine Messung, sondern ein leer abgeschicktes Feld. Die
     alte Pruefung fragte auf null und liess die 0 durch - so landete am 15.08.2026
     {chest:0, waist:0, hip:0} in der Datei. Unsichtbar, weil rKoerper() ueber
     waist && hip filtert, aber Datenmuell. 0 zaehlt hier wie leer. */
  var massNeu = MASSE.filter(function(m){ return wertGeaendert(m.k); });
  if(massNeu.length){
    var setzen = {};
    massNeu.forEach(function(m){ var mv=num(W[m.k]); if(mv!=null && mv>0) setzen[m.f]=mv; });
    var bp2 = Object.keys(setzen).length
      ? punktSetzen(N.body.points, "date", iso, setzen)
      : N.body.points.filter(function(p){ return p.date===iso; })[0];
    if(bp2){
      massNeu.forEach(function(m){ var mv=num(W[m.k]); if(mv==null || mv<=0) delete bp2[m.f]; });
      if(bp2.waist==null && bp2.hip==null && bp2.chest==null)
        N.body.points = N.body.points.filter(function(p){ return p.date!==iso; });
      geschrieben += massNeu.length;
    }
  }

  /* Acht Messpunkte. Die alten Namen bleiben in der Datei stehen - was einmal als
     «nach Essen» erfasst wurde, heisst dort weiter so; nur Neues kommt in die acht.
     slots und slotType werden bei jedem Speichern nachgeführt: das ist die dritte
     Sicherung neben SLOT8 und sollTyp() und macht die Datei für sich allein lesbar. */
  N.glucose.slots = N.glucose.slots||[];
  N.glucose.slotType = N.glucose.slotType||{};
  SLOT8.forEach(function(s){
    if(N.glucose.slots.indexOf(s.k)<0) N.glucose.slots.push(s.k);
    N.glucose.slotType[s.k] = s.t;
  });
  var jetzt = new Date(), zeit = String(jetzt.getHours()).padStart(2,"0")+":"+String(jetzt.getMinutes()).padStart(2,"0");
  var bzZeilen = bzNeuZeilen();
  var bzBerichtigt = bzAlt().filter(function(p){ return p.wGeaendert || p.nGeaendert; });
  var nBz = notizText("bz"), nBzKuerzel = kuerzelAn("bz").join(" · ");
  if(bzZeilen.length || bzBerichtigt.length || notizGeaendert("bz")){
    var tag = N.glucose.days.filter(function(d){ return d.iso===iso; })[0];
    if(!tag && bzZeilen.length){ tag={iso:iso, date:dm(iso), rows:[]}; N.glucose.days.push(tag);
      N.glucose.days.sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
    if(tag){
      tag.rows = tag.rows||[];
      /* ERSETZEN, nicht anhaengen: das Feld traegt beim Oeffnen den bestehenden Text, also
         ist das, was darin steht, die ganze Notiz dieses Tages. */
      if(notizGeaendert("bz")){ if(nBz) tag.note = nBz; else delete tag.note; geschrieben++; }
      /* Berichtigungen an BESTEHENDEN Messungen. Gesucht wird ueber Messpunkt, Zeit und
         Wert, nicht ueber die Position - und jede Fundstelle nur EINMAL, sonst bekaeme
         bei zwei gleichen Messungen desselben Tages die erste beide Notizen. */
      var benutztBz = {};
      bzBerichtigt.forEach(function(p){
        var teile = p.s.split("|");
        for(var ri=0; ri<tag.rows.length; ri++){
          var row = tag.rows[ri];
          if(row.slot !== teile[1]) continue;
          var vals = row.values||[];
          for(var vi=0; vi<vals.length; vi++){
            var mk = ri+":"+vi;
            if(benutztBz[mk]) continue;
            if(String(vals[vi].t||"")!==teile[2] || String(+vals[vi].v)!==teile[3]) continue;
            benutztBz[mk] = 1;
            var neu = num(p.w);
            if(p.wGeaendert && neu==null){
              /* Geleert heisst entfernt - das ist der Weg aus einem Vertipper heraus.
                 Nur diese eine Messung, nicht der Messpunkt und nicht der Tag. */
              vals.splice(vi,1); geschrieben++; return;
            }
            if(p.wGeaendert){ vals[vi].v = neu; geschrieben++; }
            if(p.nGeaendert){
              var txt = String(p.note||"").trim();
              if(txt) vals[vi].note = txt; else delete vals[vi].note;
              geschrieben++;
            }
            return;
          }
        }
      });
      /* Neue Messungen anhaengen. Der Messpunkt kommt aus der Auswahl, die Uhrzeit aus
         dem Feld - und nur, wenn sie sich als hh:mm lesen laesst; sonst die Speicherzeit
         wie bisher. Angehaengt, nicht ersetzt: an einem Messpunkt duerfen an einem Tag
         mehrere Werte stehen, das ist der ganze Zweck der Liste. */
      bzZeilen.forEach(function(r){
        var zt = zeitNorm(r.zeit) || zeit;
        var row = tag.rows.filter(function(x){ return x.slot===r.slot; })[0];
        if(!row){ row = {slot:r.slot, values:[]}; tag.rows.push(row); }
        row.values = row.values||[];
        var w = {v:num(r.v), t:zt};
        var note = [nBzKuerzel, String(r.note||"").trim()].filter(Boolean).join(" · ");
        if(note) w.note = note;
        row.values.push(w);
        geschrieben++;
      });
      /* Eine Zeile ohne Werte ist keine Zeile mehr - sie faellt weg, damit kein leerer
         Messpunkt in der Datei zurueckbleibt. Der Tag faellt weg, wenn nichts uebrig ist. */
      tag.rows = tag.rows.filter(function(x){ return (x.values||[]).length; });
      if(!tag.rows.length && !tag.note)
        N.glucose.days = N.glucose.days.filter(function(d){ return d.iso!==iso; });
    }
  }

  var nBdKuerzel = kuerzelAn("bd").join(" · ");
  /* Notizen an BESTEHENDEN Messungen berichtigen. Gesucht wird ueber Zeit und Werte, nicht
     ueber die Position - und jede Fundstelle nur einmal, sonst bekaeme bei zwei gleichen
     Messungen am selben Tag die erste beide Notizen. */
  var benutzt = {};
  Object.keys(UI.erfBpNote).forEach(function(s){
    var teile = s.split("|"), txt = String(UI.erfBpNote[s]||"").trim();
    for(var i=0;i<N.bloodpressure.points.length;i++){
      var p = N.bloodpressure.points[i];
      if(benutzt[i]) continue;
      if(p.iso!==teile[0] || String(p.time||"")!==teile[1]) continue;
      if(String(+p.sys)!==teile[2] || String(+p.dia)!==teile[3]) continue;
      benutzt[i] = 1;
      if(txt === String(p.note||"")) break;
      if(txt) p.note = txt; else delete p.note;
      geschrieben++;
      break;
    }
  });
  UI.erfBp.forEach(function(r){
    var sys=num(r.sys), dia=num(r.dia);
    if(sys==null || dia==null) return;
    /* Die Uhrzeit kommt aus dem Feld - und nur, wenn sie sich als hh:mm lesen laesst;
       sonst die Speicherzeit, genau wie beim Blutzucker. */
    var zt = zeitNorm(r.zeit) || zeit;
    /* Dieselbe Messung zweimal am selben Tag ist moeglich - dieselben ZAHLEN zur selben
       Minute sind aber fast immer ein zweiter Klick auf Speichern. */
    if(N.bloodpressure.points.some(function(p){
        return p.iso===iso && +p.sys===sys && +p.dia===dia && String(p.time||"")===zt; })) return;
    /* Die Feldnamen sind die der Datei: iso, slot, time, sys, dia, pulse, note - alle 24
       bestehenden Punkte tragen slot und time genau so. OHNE gewaehlten Messpunkt wird slot
       NICHT geschrieben: ein leerer String behauptet einen Messpunkt, den es nicht gibt,
       und liesse sich spaeter nicht mehr von einem echten unterscheiden. */
    var p = {iso:iso};
    if(r.slot) p.slot = r.slot;
    p.time = zt; p.sys = sys; p.dia = dia;
    var pl = num(r.puls); if(pl!=null) p.pulse = pl;
    var note = [nBdKuerzel, String(r.note||"").trim()].filter(Boolean).join(" · ");
    if(note) p.note = note;
    N.bloodpressure.points.push(p);
    geschrieben++;
  });
  N.bloodpressure.points.sort(function(a,b){ return a.iso<b.iso?-1:1; });

  if(!geschrieben) return meldung("Nichts eingetippt — es wurde nichts geschrieben.", true);
  N.updated = dmy(isoVon(new Date(heuteMs())));
  var ok;
  try{ ok = await ghSchreiben(N, false); }
  catch(e){ return meldung("Speichern fehlgeschlagen: "+(e&&e.message||e)+". Es wurde nichts geändert.", true); }
  if(ok!==true) return false;   // STATE bleibt unangetastet, der Entwurf steht noch da
  UI.erfWerte = {}; UI.erfBp = [neueBpZeile()]; UI.erfAuf = "auto"; UI.erfKuerzel = {};
  UI.erfBpNote = {}; UI.erfStandIso = null;
  UI.erfBz = [neueBzZeile()]; UI.erfBzAlt = {};
  zustandSetzen(N);
  return meldung(zahl(geschrieben,"Eintrag","Einträge")+" unter dem "+dmy(iso)+" gespeichert.");
}

/* ══ Arzt-Export ════════════════════════════════════════════════════════════════
   Dieselbe Ansicht, nur ohne Bedienung. Das Werkzeug klont sich selbst, friert den
   Datenstand ein und knipst Verbinden, Erfassen und Export aus - darum gibt es keine
   zweite Darstellung, die veralten koennte. Der Verbinden-Dialog wird entfernt: ein
   Token hat in einer Datei, die aus dem Haus geht, nichts verloren. */
var EXP_BEREICHE = [ {k:"gewicht",t:"Gewicht"}, {k:"bz",t:"Blutzucker"}, {k:"bd",t:"Blutdruck"},
  {k:"labor",t:"Labor"}, {k:"history",t:"Krankengeschichte"}, {k:"meds",t:"Medikation"},
  {k:"stamm",t:"Diagnosen und Stammdaten"} ];
var EXP_AN = {};
EXP_BEREICHE.forEach(function(b){ EXP_AN[b.k]=true; });
var EXP_DOCS = false;
/* Notizen gehen NICHT mit (Entscheid Albrecht vom 15.08.2026: «die Notizen gehen ihn nichts
   an, er will die Daten sehen»). «auf Arbeit. stress» ist Kontext fuer Dich, nicht Befund
   fuer die Praxis - und ein Schalter, der standardmaessig AN steht, ist keine Entscheidung. */
var EXP_NOTIZEN = false;

/* ── Zeitraum des Exports ────────────────────────────────────────────────────────
   «nicht jeder muss alles sehen». Der Export bekommt denselben Schalter wie die Kurven und
   dieselbe Rechnung - eine zweite Kappungslogik liefe beim ersten Randfall auseinander, und
   dann zeigte der Dialog eine andere Menge, als die Datei traegt.
   Ein Element OHNE verwertbares Datum bleibt drin. Stillschweigend wegzuwerfen, was sich
   nicht einordnen laesst, waere die schlimmste der moeglichen Antworten: die Kopie waere
   unvollstaendig, ohne dass es jemand sieht. Der Dialog sagt darum, wie viele das sind. */
function expDatum(x, feld){
  var d = x && x[feld];
  return (typeof d==="string" && /^\d{4}-\d{2}-\d{2}/.test(d)) ? d.slice(0,10) : null;
}
function expKappen(arr, feld, f){
  if(!f || (!f.von && !f.bis)) return (arr||[]).slice();
  return (arr||[]).filter(function(x){
    var d = expDatum(x, feld);
    if(!d) return true;
    return (!f.von || d>=f.von) && (!f.bis || d<=f.bis);
  });
}
/* Was in welchem Bereich ein Datum traegt. body steht bei «Gewicht»: es hat keinen eigenen
   Schalter und geht mit dem Gewicht an oder aus. Die Medikation traegt kein Datum je Zeile -
   ein Plan ist ein Stand, kein Verlauf. */
var EXP_TEILE = {
  gewicht:[ {q:function(){ return (STATE.weight||{}).points; }, feld:"date", e:"Messung", m:"Messungen"},
            {q:function(){ return (STATE.body||{}).points; }, feld:"date", e:"Körpermass", m:"Körpermassen"} ],
  bz:[ {q:function(){ return (STATE.glucose||{}).days; }, feld:"iso", e:"Messtag", m:"Messtagen"} ],
  bd:[ {q:function(){ return (STATE.bloodpressure||{}).points; }, feld:"iso", e:"Messung", m:"Messungen"} ],
  labor:[ {q:function(){ return (STATE.lab||{}).panels; }, feld:"date", e:"Blatt", m:"Blättern"} ],
  history:[ {q:function(){ return (STATE.history||{}).events; }, feld:"date", e:"Eintrag", m:"Einträgen"} ],
  meds:[],
  stamm:[]
};
function expMengen(){
  var f = fenster("export");
  return EXP_BEREICHE.map(function(b){
    return { k:b.k, teile:(EXP_TEILE[b.k]||[]).map(function(t){
      var arr = t.q()||[];
      var drin = expKappen(arr, t.feld, f).length;
      var ohne = arr.filter(function(x){ return !expDatum(x, t.feld); }).length;
      return { drin:drin, gesamt:arr.length, ohne:ohne,
        text:(t.vor||"")+drin+" von "+zahl(arr.length, t.e, t.m) };
    }) };
  });
}
/* Ein Bereich, der durch den Zeitraum leer wird, wird BENANNT, nicht versteckt: «0 von 29
   Blättern» in gedaempfter Warnfarbe. Wer mit vier Wochen ein leeres Labor mitschickt, muss
   das sehen, bevor die Datei entsteht - nicht, wenn der Arzt sie oeffnet. */
function expMengeZeile(mz, an, gekappt){
  if(!an) return '<span style="color:var(--faint)">nicht enthalten</span>';
  if(!mz.teile.length) return gekappt ? '<span style="color:var(--faint)">ohne Datum — bleibt vollständig</span>' : "";
  return mz.teile.map(function(t){
    var leer = t.gesamt>0 && t.drin===0;
    return '<span style="color:'+(leer?"var(--warn);opacity:.8":"var(--faint)")+'">'+esc(t.text)+'</span>'
      + ((gekappt && t.ohne) ? '<span style="color:var(--faint)"> ('+t.ohne+' ohne Datum)</span>' : "");
  }).join('<span style="color:var(--faint)"> · </span>');
}

function exportModal(){
  var f = fenster("export"), gekappt = !!(f.von||f.bis), M = expMengen();
  return '<div class="modal-bg" id="expBg"><div class="modal"><div class="modal-kopf">'
    + '<h2>Für Arzt exportieren</h2><button class="btn rund" data-modalzu="1">×</button></div>'
    + '<div class="modal-koerper">'
    + '<p style="margin:0 0 16px;font-size:14px;color:var(--muted)">Eine einzelne HTML-Datei mit dem heutigen Datenstand — dieselbe Ansicht, ohne Erfassen und ohne Zugang zum Datenspeicher. Abgewählte Bereiche sind in der Kopie nicht enthalten.</p>'
    + '<div class="abschnitt" style="padding-top:0">Zeitraum</div>'
    + zeitschalterHtml("export")
    /* «Einträge» und nicht «Messungen»: gekappt werden auch Laborblätter und die
       Krankengeschichte. Und der Bezug steht im Genitiv, wie ihn fensterLang liefert -
       «was der letzten Woche erfasst wurde» ist kein Satz. */
    + '<div class="bildtext">'+(gekappt
        ? esc("Die Kopie enthält nur Einträge "+fensterLang(f)+". Unter jedem Bereich steht, wie viel davon übrig bleibt.")
        : "Ohne Einschränkung geht der ganze Bestand mit. Unter jedem Bereich steht, wie viel das ist.")+'</div>'
    + '<div class="abschnitt">Bereiche</div>'
    + EXP_BEREICHE.map(function(b,bi){
        var mz = expMengeZeile(M[bi], EXP_AN[b.k], gekappt);
        return '<div class="exp-zeile" data-exp="'+b.k+'"><div class="exp-name">'+esc(b.t)
          + (mz?'<div style="font-size:12px;margin-top:2px">'+mz+'</div>':'')+'</div>'
          + '<button class="schieber'+(EXP_AN[b.k]?" an":"")+'"><span class="knopf"></span></button></div>'; }).join("")
    + '<div class="exp-zeile" data-exp="__notizen"><div class="exp-name">Deine Notizen zu den Messungen<br>'
    +   '<span style="font-size:12px;color:var(--faint)">«nach Kaffee», «auf Arbeit, Stress» — Kontext für Dich, nicht Befund</span></div>'
    +   '<button class="schieber'+(EXP_NOTIZEN?" an":"")+'"><span class="knopf"></span></button></div>'
    + '<div class="exp-zeile" data-exp="__docs"><div class="exp-name">Dokumentpfade und Links<br>'
    +   '<span style="font-size:12px;color:var(--faint)">zeigen auf Deine private OneDrive</span></div>'
    +   '<button class="schieber'+(EXP_DOCS?" an":"")+'"><span class="knopf"></span></button></div>'
    + '<div class="modal-fuss"><button class="btn stark" id="btnExpGo">Kopie erzeugen</button></div>'
    + '</div></div></div>';
}

function exportZustand(){
  var S = JSON.parse(JSON.stringify(STATE));
  /* Was das Werkzeug nicht mehr zeigt, gehoert auch nicht in die Arztkopie. Solange
     eine aeltere monitoring.json geladen wird, stehen diese Bloecke noch im STATE -
     sie waeren unsichtbar, aber im Dateitext enthalten, samt ihrer Notizen.
     body steht NICHT mehr in dieser Liste: der Taille-Hueft-Quotient wird wieder gezeigt,
     und die Aufraeumliste warf ihn sonst genau dann weg, wenn er gebraucht wird. */
  ["befinden","fitbit","fluid","digestion","wellbeing","nutrition","notes","hba1cLab","markers"]
    .forEach(function(k){ if(S[k]!==undefined) delete S[k]; });
  /* body hat keinen eigenen Bereichsschalter - die Umfaenge gehoeren zum Gewicht und gehen
     mit ihm an oder aus. Ein achter Schalter fuer drei Zahlen waere eine Frage zu viel. */
  if(!EXP_AN.gewicht){ S.weight.points=[]; if(S.body) S.body.points=[]; }
  if(!EXP_AN.bz){ S.glucose.days=[]; S.glucose.histDays=[]; delete S.glucose.baseline; }
  if(!EXP_AN.bd) S.bloodpressure.points=[];
  if(!EXP_AN.labor) S.lab={params:[],panels:[]};
  if(!EXP_AN.history) S.history={events:[]};
  if(!EXP_AN.meds) S.meds={liste:[]};
  if(!EXP_AN.stamm) S.patient={};
  /* Der Zeitraum kappt zuletzt und ueber allem: alles, was ein Datum traegt. Gekappt wird
     mit derselben Funktion, aus der der Dialog seine Mengen liest - was dort steht, steht
     danach in der Datei. Ohne Einschraenkung (Startwert «alles») laeuft hier nichts. */
  var fz = fenster("export");
  if(fz.von || fz.bis){
    S.weight.points        = expKappen(S.weight.points, "date", fz);
    if(S.body) S.body.points = expKappen(S.body.points, "date", fz);
    S.glucose.days         = expKappen(S.glucose.days, "iso", fz);
    S.bloodpressure.points = expKappen(S.bloodpressure.points, "iso", fz);
    S.lab.panels           = expKappen(S.lab.panels, "date", fz);
    S.history.events       = expKappen(S.history.events, "date", fz);
  }
  S.__export = { made:isoVon(new Date(heuteMs())), docPaths:EXP_DOCS, notizen:EXP_NOTIZEN,
    bereiche:JSON.parse(JSON.stringify(EXP_AN)),
    /* Eine Kopie, die einen Ausschnitt zeigt, muss sagen, dass sie einer ist - darum steht
       der Zeitraum in der Datei und im Kopf der Kopie. */
    zeitraum:{ stufe:fz.k, von:fz.von||null, bis:fz.bis||null,
      gekappt:!!(fz.von||fz.bis), text:fensterLang(fz) } };
  if(!EXP_DOCS){
    var putzen = function(arr){ (arr||[]).forEach(function(x){ if(x.docs) delete x.docs; }); };
    putzen(S.history.events); putzen(S.lab.panels);
  }
  /* Notizen aus allen drei Reihen entfernen, nicht bloss aus einer: sie stehen am
     Gewichtspunkt, am Blutzuckertag UND an dessen Einzelwerten und an jeder
     Blutdruckmessung. Und am Koerpermass: ein Punkt in body.points kann eine Notiz tragen
     wie jeder andere Messpunkt auch. */
  if(!EXP_NOTIZEN){
    var weg = function(arr){ (arr||[]).forEach(function(x){ if(x.note) delete x.note; }); };
    weg(S.weight.points); weg(S.bloodpressure.points);
    if(S.body) weg(S.body.points);
    (S.glucose.days||[]).forEach(function(d){
      if(d.note) delete d.note;
      (d.rows||[]).forEach(function(r){ if(r.note) delete r.note;
        (r.values||[]).forEach(function(v){ if(v.note) delete v.note; }); });
    });
  }
  return S;
}

function exportErzeugen(){
  var klon = document.documentElement.cloneNode(true);
  ["haupt","status","stamm","modale"].forEach(function(id){
    var n = klon.querySelector("#"+id); if(n) n.innerHTML = "";
  });
  var html = klon.outerHTML;
  var json = "/*STATE-ANFANG*/\nvar STATE = "+JSON.stringify(exportZustand())+";\n/*STATE-ENDE*/";
  var a = html.indexOf("/*STATE-ANFANG*/"), b = html.indexOf("/*STATE-ENDE*/");
  if(a<0 || b<a){ alert("Der Export findet die STATE-Marken nicht — die Kopie wäre leer."); return; }
  html = html.slice(0,a) + json + html.slice(b+"/*STATE-ENDE*/".length);
  html = html.replace("var FROZEN = false;", "var FROZEN = true;");
  var blob = new Blob(["<!doctype html>\n"+html], {type:"text/html"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Monitoring_Arzt_"+isoVon(new Date(heuteMs()))+".html";
  document.body.appendChild(a); a.click(); a.remove();
  document.getElementById("modale").innerHTML = "";
}

/* Merkzettel. Am Rechner beim Ueberfahren, am Telefon beim Antippen - dort gibt es kein
   Ueberfahren, und eine Funktion, die genau auf dem Geraet fehlt, an dem man sie am
   ehesten braucht, ist keine. In der Kachel gilt nur Ueberfahren: das Antippen gehoert
   dort dem Sprung ins Vollbild.
   Zwei Stufen: `voll` schaltet die Notiz zu. Ohne sie bleibt die Karte klein genug, um
   nicht zu verdecken, worueber sie spricht. */
function tipZeigen(id, x, y, voll){
  var o = TIPS[id], t = document.getElementById("tip");
  if(!o || !t) return;
  t.innerHTML = '<div class="t-tag">'+esc(o.tag)+'</div>'
    + '<div class="t-wert">'+esc(o.wert)+(o.einheit?'<span class="t-einheit">'+esc(o.einheit)+'</span>':'')+'</div>'
    + (o.sub?'<div class="t-sub">'+esc(o.sub)+'</div>':'')
    + (o.notiz
        ? (voll ? '<div class="t-notiz">'+esc(o.notiz)+'</div>'
                : '<div class="t-wink">✎ Notiz — anklicken</div>')
        : '');
  t.style.display = "block";
  tipStellen(x, y);
}
/* Der Zettel darf nie verdecken, worueber er spricht: er haelt Abstand und kippt am
   rechten Rand nach links, am oberen nach unten. */
function tipStellen(x, y){
  var t = document.getElementById("tip"); if(!t || t.style.display!=="block") return;
  var r = t.getBoundingClientRect();
  var l = x+16, o = y-r.height-16;
  if(l+r.width > window.innerWidth-8) l = x-r.width-16;
  if(l < 8) l = 8;
  if(o < 8) o = y+22;
  t.style.left = l+"px"; t.style.top = o+"px";
}
function tipWeg(){ var t=document.getElementById("tip"); if(t) t.style.display="none"; }
function hitVon(e){ return (e.target && e.target.closest) ? e.target.closest(".hit") : null; }

document.addEventListener("mouseover", function(e){ var h=hitVon(e); if(h) tipZeigen(h.dataset.tip, e.clientX, e.clientY, false); });
document.addEventListener("mousemove", function(e){ var h=hitVon(e); if(h) tipStellen(e.clientX, e.clientY); });
document.addEventListener("mouseout",  function(e){ if(hitVon(e)) tipWeg(); });
document.addEventListener("click", function(e){
  var h = hitVon(e);
  if(h && !h.dataset.nurhover){
    var r = h.getBoundingClientRect();
    tipZeigen(h.dataset.tip, r.left+r.width/2, r.top+Math.min(60, r.height/3), true);
    return;
  }
  tipWeg();
});
window.addEventListener("scroll", tipWeg, {passive:true});

function zeichne(){
  /* Das Merkzettel-Register gehoert zu DIESEM Bild. Wer es nicht leert, sammelt bei
     jedem Neuzeichnen Eintraege an, die auf nichts mehr zeigen. */
  TIPS = {}; TIPN = 0; tipWeg();
  /* Die Breite, mit der die Bilder dieses Durchgangs gerechnet werden. Der Resize-Haken
     vergleicht dagegen und zeichnet nur bei einer ANDEREN Breite neu. */
  bildBreiteMerk = bildBreitePx();
  var kopfE = document.getElementById("kopfEyebrow"), kopfZ = document.getElementById("kopfZeile");
  var kopie = FROZEN, stand = STATE.updated||"—", heute = dmy(isoVon(new Date(heuteMs())));
  /* Zeigt die Kopie nur einen Ausschnitt, sagt sie es im Kopf. Ohne diese Zeile sieht eine
     auf vier Wochen gekappte Kopie aus wie der ganze Bestand - und ein leeres Labor wie
     eine Krankengeschichte ohne Laborwerte. */
  var zr = (STATE.__export && STATE.__export.zeitraum) || null;
  kopfE.textContent = kopie
    ? ("Arztkopie · reine Ansicht" + ((zr && zr.gekappt) ? " · Ausschnitt "+zr.text : ""))
    : "Monitoring";
  kopfZ.textContent = kopie ? "MOPP+ · Kopie vom "+((STATE.__export&&STATE.__export.made)?dmy(STATE.__export.made):stand) : "MOPP+ | "+heute;
  document.getElementById("werkzeuge").hidden = kopie;
  document.getElementById("fussText").textContent = kopie
    ? "Arztkopie · Datenstand "+stand+" · reine Ansicht, keine Erfassung"
    : "Ebene 1 bis 3 · Datenstand "+stand;

  var st = document.getElementById("stamm");
  if(kopie && (STATE.patient||{}).name){
    st.hidden = false;
    st.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap">'
      + '<div style="font-size:18px;font-weight:640">'+esc(STATE.patient.name)+'</div>'
      + '<div style="font-size:13.5px;color:var(--faint)">'
      + [(STATE.patient.geboren?"geboren "+dmy(STATE.patient.geboren):""), STATE.patient.adresse||""].filter(Boolean).map(esc).join(" · ")
      + '</div></div><div class="diag">'
      + (STATE.patient.diagnosen||[]).map(function(d){ return '<span>'+esc(d)+'</span>'; }).join("")+'</div>';
  } else st.hidden = true;

  var haupt = document.getElementById("haupt");
  if(!rGewicht().length && !rBzAlle().length && !STATE.updated){
    document.getElementById("status").innerHTML = "";
    haupt.innerHTML = '<div class="karte leer"><div class="k-name">Erster Start</div>'
      + '<div style="font-size:20px;font-weight:640">Willkommen bei MOPP+</div>'
      + '<p style="margin:0;font-size:14.5px;color:var(--muted)">Deine Messwerte liegen in Deinem privaten Datenspeicher. MOPP+ holt sie von dort und schreibt sie dorthin zurück — auf diesem Gerät bleibt nichts ausser dem Zugang.</p>'
      + '<button class="btn stark" id="btnStart" style="align-self:flex-start;margin-top:6px">Datenspeicher verbinden</button></div>';
    return;
  }
  zeichneStatus();
  if(UI.seite==="wand") haupt.innerHTML = zeichneWand();
  if(UI.seite==="voll") haupt.innerHTML = zeichneVoll();
  if(UI.seite==="akten") haupt.innerHTML = zeichneAkten();
  if(UI.seite==="erf") haupt.innerHTML = zeichneErf();
  /* Ob eine Bildlaufleiste erscheint, steht erst mit dem Inhalt fest - und sie macht den
     Behaelter schmaler, als beim Rechnen der Schriftgroessen angenommen wurde. Einmal
     nachmessen, einmal nachziehen; der Riegel verhindert die Schleife. */
  if(!bildZweiterLauf && bildBreitePx()!==bildBreiteMerk){
    bildZweiterLauf = true;
    try{ zeichne(); } finally { bildZweiterLauf = false; }
  }
}
/* Das Bild wird bei jedem zeichne() neu gebaut - ein Fenster kann sich aber auch OHNE
   zeichne() aendern. Einen Haken dafuer gab es nicht; hier ist er, entprellt: bei jedem
   Pixel neu zu zeichnen waere teuer und flackerte. Gezeichnet wird nur bei geaenderter
   BREITE - auf dem Telefon aendert die aufklappende Tastatur bloss die Hoehe, und ein
   Neuzeichnen naehme dem Feld mitten im Tippen den Fokus. Im Erfassen steht ohnehin kein
   Bild; dort wird die Breite nur vermerkt und beim naechsten Zeichnen verwendet. */
window.addEventListener("resize", function(){
  if(bildTakt) clearTimeout(bildTakt);
  bildTakt = setTimeout(function(){
    bildTakt = null;
    var b = bildBreitePx();
    if(b === bildBreiteMerk) return;
    bildBreiteMerk = b;
    if(UI.seite !== "erf") zeichne();
  }, 160);
}, {passive:true});

document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;

  if(t.id==="btnConn" || t.id==="btnStart"){ document.getElementById("modale").innerHTML = connModal(); return; }
  if(t.id==="btnExp"){ document.getElementById("modale").innerHTML = exportModal(); return; }
  if(t.dataset.modalzu){ document.getElementById("modale").innerHTML = ""; return; }

  if(t.id==="ghGo"){
    cfgSchreiben({ repo:document.getElementById("ghRepo").value.trim(),
      file:document.getElementById("ghFile").value.trim()||"monitoring.json",
      branch:document.getElementById("ghBranch").value.trim(),
      token:document.getElementById("ghToken").value.trim() });
    document.getElementById("modale").innerHTML = "";
    ghHolen(); return;
  }
  if(t.id==="ghDown"){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"}));
    a.download=(CFG&&CFG.file)||"monitoring.json"; document.body.appendChild(a); a.click(); a.remove(); return;
  }
  if(t.id==="ghWeg"){ localStorage.removeItem("mopp.gh"); CFG=null; SHA=null; ampel("aus");
    document.getElementById("modale").innerHTML = ""; return; }

  if(t.dataset.exp!==undefined){
    if(t.dataset.exp==="__docs") EXP_DOCS = !EXP_DOCS;
    else if(t.dataset.exp==="__notizen") EXP_NOTIZEN = !EXP_NOTIZEN;
    else EXP_AN[t.dataset.exp] = !EXP_AN[t.dataset.exp];
    document.getElementById("modale").innerHTML = exportModal(); return;
  }
  if(t.closest(".exp-zeile")){
    var z = t.closest(".exp-zeile");
    if(z.dataset.exp==="__docs") EXP_DOCS = !EXP_DOCS;
    else if(z.dataset.exp==="__notizen") EXP_NOTIZEN = !EXP_NOTIZEN;
    else EXP_AN[z.dataset.exp] = !EXP_AN[z.dataset.exp];
    document.getElementById("modale").innerHTML = exportModal(); return;
  }
  if(t.id==="btnExpGo"){ exportErzeugen(); return; }

  if(t.dataset.kz){ UI.kz = t.dataset.kz; UI.seite = "voll"; zeichne(); window.scrollTo(0,0); return; }
  /* × heisst überall dasselbe: eine Ebene hoch. Im Akten-Detail zurück zu den Kacheln,
     in der Kachelübersicht zurück zu «Heute». */
  if(t.dataset.zu==="akten"){ UI.akte = null; UI.blatt = 0; UI.sicht = null; UI.wahl = null;
    UI.medEdit = false; UI.medListe = null; UI.medKopf = null; zeichne(); window.scrollTo(0,0); return; }
  if(t.dataset.zu){ UI.seite = "wand"; UI.akte = null; UI.erfMeldung = null; UI.medEdit = false; zeichne(); return; }
  if(t.id==="btnAkten"){ UI.seite = "akten"; UI.akte = null; zeichne(); window.scrollTo(0,0); return; }
  if(t.dataset.akte){ UI.akte = t.dataset.akte; UI.blatt = 0; UI.sicht = null; UI.wahl = null;
    UI.medEdit = false; UI.medListe = null; UI.medKopf = null; zeichne(); window.scrollTo(0,0); return; }
  if(t.dataset.blatt!==undefined){ UI.blatt = +t.dataset.blatt; zeichne(); return; }
  if(t.dataset.sicht){ UI.sicht = t.dataset.sicht; UI.wahl = null; zeichne(); return; }
  if(t.dataset.wahl){ UI.wahl = t.dataset.wahl; zeichne(); return; }
  if(t.id==="btnCsv"){ csvExport(); return; }

  /* Medikation bearbeiten. Die Arbeitskopie wird beim Oeffnen gezogen und beim Abbrechen
     verworfen - STATE bleibt bis zum bestaetigten Schreiben unangetastet. */
  if(t.id==="medEdit"){ UI.medEdit = true; UI.medListe = null; UI.medKopf = null; UI.erfMeldung = null; zeichne(); return; }
  if(t.id==="medAbbruch"){ UI.medEdit = false; UI.medListe = null; UI.medKopf = null; zeichne(); return; }
  if(t.id==="medPlus"){ medArbeit().push({name:"", wirkstoff:"", dosis:"", verordner:""}); zeichne(); return; }
  if(t.dataset.medweg!==undefined){ medArbeit().splice(+t.dataset.medweg, 1); zeichne(); return; }
  if(t.id==="medSpeichern"){ medSpeichern(); return; }
  if(t.dataset.sch){ UI.bzView = t.dataset.sch; zeichne(); return; }
  /* Der Zeitraum haengt an DIESER Kennzahl, nicht an der Seite: wer den Blutzucker auf
     eine Woche stellt, hat damit nichts ueber das Gewicht gesagt. */
  /* Der Zeitraum des Exports steht im Dialog, nicht auf der Seite: dort wird nicht die
     Seite neu gezeichnet, sondern der Dialog - sonst blieben die Mengen darin stehen. */
  if(t.dataset.zeitstufe){ UI.zeit[t.dataset.zeitkz] = t.dataset.zeitstufe; UI.erfMeldung = null;
    if(t.dataset.zeitkz==="export"){ document.getElementById("modale").innerHTML = exportModal(); return; }
    zeichne(); return; }
  /* «von–bis» wird erst mit «anwenden» uebernommen - sonst zeichnete die Seite bei jedem
     Tastendruck im Datumsfeld neu, und eine halbfertige Eingabe waere ein Zeitraum. */
  if(t.dataset.zeitanwenden){
    var zk = t.dataset.zeitanwenden, ze = zeitEntwurf(zk);
    UI.zeitFrei[zk] = {von:ze.von||"", bis:ze.bis||""};
    UI.zeit[zk] = "frei";
    if(zk==="export"){ document.getElementById("modale").innerHTML = exportModal(); return; }
    zeichne(); return;
  }
  /* Ein Sprung auf einen bestimmten Tag - aus der Statuszeile (nachtragen) oder aus den
     Rohdaten (Notiz berichtigen). Beide brauchen dasselbe, also gibt es einen Weg. */
  if(t.dataset.nach){ UI.seite = "erf";
    erfTagSetzen(tage(t.dataset.nach), t.classList.contains("roh-edit"));
    zeichne(); window.scrollTo(0,0); return; }
  /* Der Knopf IM Vollbild kommt aus einer Kennzahl und muss deren Kachel oeffnen - sonst
     landet man bei der ersten Luecke des Tages und sucht die Stelle, von der man kam.
     Der THQ hat keine eigene Kachel: Taille und Huefte werden beim Gewicht erfasst. */
  if(t.id==="btnErf" || t.id==="btnErf2"){
    UI.seite = "erf"; UI.erfMeldung = null;
    UI.erfAuf = (t.id==="btnErf2")
      ? ({gewicht:"gw", thq:"gw", bz:"bz", bd:"bd"}[UI.kz] || "auto")
      : "auto";
    erfZeitAuffrischen(); zeichne(); window.scrollTo(0,0); return; }

  /* Der Entwurf gehoert zu EINEM Tag. Wandert er beim Blaettern mit, landet der Wert
     am falschen Datum - darum wird er beim Datumswechsel geleert. */
  if(t.dataset.tag){ erfTagSetzen(UI.erfTag - (+t.dataset.tag)); zeichne(); return; }
  if(t.dataset.erf){ UI.erfAuf = (UI.erfAuf===t.dataset.erf) ? null : t.dataset.erf; UI.erfMeldung=null; zeichne(); return; }
  if(t.dataset.kuerzel){
    var kk = t.dataset.kuerzel, kw = t.dataset.kw;
    var liste = UI.erfKuerzel[kk] = UI.erfKuerzel[kk] || [];
    var pos = liste.indexOf(kw);
    if(pos<0) liste.push(kw); else liste.splice(pos,1);
    UI.erfMeldung = null; zeichne(); return;
  }
  /* Eine Zeile mehr aendert die Struktur, also darf hier neu gezeichnet werden. Der Fokus
     wandert danach NICHT in ein Textfeld: auf dem Telefon fuehre das die Tastatur hoch und
     schoebe die neue Zeile aus dem Bild, bevor man sie gesehen hat. */
  if(t.id==="btnBzPlus"){ UI.erfBz.push(neueBzZeile()); UI.erfMeldung = null; zeichne(); return; }
  if(t.id==="btnBpPlus"){ UI.erfBp.push(neueBpZeile()); UI.erfMeldung = null; zeichne(); return; }
  if(t.id==="btnSpeichern"){ speichern(); return; }
});

/* Eingaben landen sofort im Entwurf, nicht erst beim Speichern - ein Klick auf eine
   andere Zeile darf nichts verlieren. */
document.addEventListener("input", function(e){
  var i = e.target;
  if(i.dataset.w){ UI.erfWerte[i.dataset.w] = i.value; fussAuffrischen(); return; }
  /* Die beiden Datumsfelder schreiben in den ENTWURF und zeichnen NICHT neu - uebernommen
     wird erst mit «anwenden». */
  if(i.dataset.zeitvon){ zeitEntwurf(i.dataset.zeitvon).von = i.value; return; }
  if(i.dataset.zeitbis){ zeitEntwurf(i.dataset.zeitbis).bis = i.value; return; }
  /* Die Auswahl im Dropdown darf neu zeichnen - sie aendert die Struktur der Zeile
     (der Hinweis unter dem Wert haengt am Messpunkt) und nimmt dabei keinem Textfeld
     den Fokus, weil ein Auswahlfeld keinen Text traegt. Alle uebrigen Felder zeichnen
     NICHT neu: das Feld verloere mitten im Tippen den Fokus. */
  if(i.dataset.bz!==undefined){
    UI.erfBz[+i.dataset.bz][i.dataset.f] = i.value;
    if(i.tagName==="SELECT"){ UI.erfMeldung = null; zeichne(); } else fussAuffrischen();
    return;
  }
  if(i.dataset.bzalt!==undefined){
    var e = UI.erfBzAlt[i.dataset.bzalt] = UI.erfBzAlt[i.dataset.bzalt] || {};
    e[i.dataset.f] = i.value; fussAuffrischen(); return;
  }
  if(i.dataset.bp!==undefined){ UI.erfBp[+i.dataset.bp][i.dataset.f] = i.value; fussAuffrischen(); return; }
  if(i.dataset.bpalt!==undefined){ UI.erfBpNote[i.dataset.bpalt] = i.value; fussAuffrischen(); return; }
  /* Die Medikationsfelder schreiben in die Arbeitskopie, nicht in STATE - und ohne
     Neuzeichnen, sonst verliert das Feld bei jedem Zeichen den Fokus. */
  if(i.dataset.med!==undefined){ medArbeit()[+i.dataset.med][i.dataset.f] = i.value; return; }
  if(i.dataset.medkopf){ medArbeit(); UI.medKopf[i.dataset.medkopf] = i.value; return; }
});

(function boot(){
  if(FROZEN){ zeichne(); return; }
  CFG = cfgLesen();
  zeichne();
  if(CFG && CFG.repo && CFG.token) ghHolen();
})();
</script>
