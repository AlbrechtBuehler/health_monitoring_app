<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOPP+ · Monitoring</title>
<style>
  /* MOPP+ · Neubau 15.08.2026. Eine Frage, eine Antwort, ein Weg.
     Drei Ebenen: Heute (Kachelwand) · eine Kennzahl gross · Akten.
     Farben: Palette «Mitternacht». Ampel nur fuer ZUSTAND, --akzent fuer eine Datenreihe,
     --zweit nur dort, wo zwei echte Reihen in einem Bild liegen (Blutdruck). */
  :root{
    --bg:#0F1216; --surface:#171B21; --surface2:#13171C; --line:#272E38; --line2:#1F242B;
    --ink:#F1F4F7; --muted:#A9B3BE; --faint:#7E8894;
    --akzent:#8FB8E8; --akzent-hell:#B6D2F2; --akzent-fg:#0F1216; --zweit:#6FA8E0;
    --good:#5FC08C; --warn:#E0B25C; --high:#E8735E;
    --zone:rgba(95,192,140,.12); --zone-kante:rgba(95,192,140,.45); --grid:rgba(255,255,255,.07);
    --marke:#F08C1A;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --r:15px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:22px 18px 60px}
  .wrap{max-width:1120px;margin:0 auto}
  a{color:var(--akzent);text-decoration:none;border-bottom:1px solid var(--line)}
  a:hover{color:var(--ink);border-bottom-color:var(--good)}
  button{font-family:inherit;color:inherit}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .mono{font-family:var(--mono)}
  h1{font-size:25px;font-weight:660;letter-spacing:-.015em;margin:3px 0 0}
  .kopf{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .werkzeuge{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;
    font-size:14px;color:var(--muted);cursor:pointer}
  .btn:hover{border-color:var(--akzent)}
  .btn.stark{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-fg);font-weight:600}
  .btn.stark:hover{background:var(--akzent-hell);border-color:var(--akzent-hell)}
  .btn[disabled]{background:var(--line);border-color:var(--line);color:var(--faint);cursor:default}
  .btn.rund{width:38px;height:38px;padding:0;font-size:17px}
  .ampel{width:9px;height:9px;border-radius:50%;background:var(--high);display:inline-block;margin-right:7px}
  .ampel.an{background:var(--good)} .ampel.busy{background:var(--warn)}
  .status{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;padding:13px 0 16px;
    border-bottom:1px solid var(--line2);margin-bottom:20px;font-size:14.5px}
  .karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .wand{display:flex;flex-direction:column;gap:14px}
  .kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
  .kachel{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
  .kachel:hover{border-color:var(--akzent)}
  .kachel.leit{padding:22px 24px;display:block;width:100%}
  .k-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .k-zahl{font-size:36px;font-weight:640;letter-spacing:-.03em;line-height:1.05}
  .kachel.leit .k-zahl{font-size:46px}
  .k-einheit{font-size:15px;color:var(--muted)}
  .k-unter{font-size:13.5px;color:var(--faint);margin-top:6px;min-height:20px}
  .k-meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:9px}
  .k-reihe{display:flex;align-items:baseline;gap:9px;margin-top:8px;flex-wrap:wrap}
  .woche{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:baseline;padding:15px 22px;
    background:var(--surface2);border:1px solid var(--line2);border-radius:13px}
  .wz{display:flex;align-items:baseline;gap:7px}
  .wz b{font-size:16px;font-weight:600} .wz span{font-size:14.5px;color:var(--muted)}
  .wz i{font-size:12.5px;color:var(--faint);font-style:normal}
  .aktenknopf{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    width:100%;text-align:left;padding:16px 22px;background:var(--surface);border:1px solid var(--line);
    border-radius:13px;cursor:pointer;font-size:14.5px;color:var(--muted)}
  .aktenknopf:hover{border-color:var(--akzent)}
  .buehne{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px 26px}
  .b-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .b-zahl{font-size:42px;font-weight:640;letter-spacing:-.03em;line-height:1.05}
  .satz{margin:14px 0 0;font-size:15.5px;color:var(--muted);max-width:80ch;text-wrap:pretty}
  .bildtext{font-size:13px;color:var(--faint);margin-top:10px}
  .schalter{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .sch{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;
    font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .sch.an{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-fg)}
  .neben{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;margin-top:22px;
    border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--line)}
  .neben > div{background:var(--surface2);padding:14px 18px}
  .n-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .n-wert{font-size:19px;font-weight:620}
  .n-unter{font-size:12.5px;color:var(--faint);margin-top:2px}
  /* Erfassen: eine Liste, offen ist immer nur eine Zeile. */
  .abschnitt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);padding:22px 0 9px;border-bottom:1px solid var(--line)}
  .abschnitt.erste{padding-top:0}
  .zeile{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line2);padding:15px 6px;cursor:pointer}
  .zeile:hover{background:var(--surface2)}
  .zeile b{font-size:16px;font-weight:600}
  .zeile .st{font-size:14.5px} .zeile .pf{font-size:12px;color:var(--faint)}
  .koerper{padding:14px 6px 18px;border-bottom:1px solid var(--line2)}
  .felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
  .feld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .feld .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  input[type=text]{width:100%;height:46px;font-size:16px;font-family:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:0 12px}
  input[type=text]:focus{outline:none;border-color:var(--akzent)}
  .stufen{display:flex;gap:6px}
  .stufe{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-size:16px;font-weight:600;cursor:pointer}
  .stufe.an{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-fg)}
  /* Kein Raster mit festen Spalten: 112 px Etikett und fuenf 46-px-Ziele passen in 292 px
     Inhaltsbreite nicht, und feste Spalten koennen nicht schrumpfen — auf dem Telefon
     scrollte die Seite quer. Flex mit Umbruch stapelt von selbst, sobald es eng wird,
     ohne Schwelle und auf jeder Breite. Die 46 px bleiben: sie sind das Einzige, was auf
     dem Telefon zuverlaessig trifft. */
  .bef-zeile{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
  .bef-zeile > div:first-child{flex:0 0 auto;min-width:112px}
  .bef-zeile .stufen{flex:0 0 auto}
  .bef-zeile .anker{font-size:13px;color:var(--faint);flex:1 1 160px;min-width:0}
  .bp-zeile{display:grid;grid-template-columns:92px repeat(3,minmax(0,1fr));gap:9px;align-items:center}
  .schieber{width:56px;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--bg);
    position:relative;cursor:pointer;padding:0}
  .schieber .knopf{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:var(--faint);transition:left .12s,background .12s}
  .schieber.an{border-color:var(--good);background:var(--good)}
  .schieber.an .knopf{left:27px;background:var(--bg)}
  .stern{width:34px;height:34px;border:none;background:none;font-size:21px;line-height:1;
    color:var(--line);cursor:pointer;padding:0}
  .stern.an{color:var(--akzent)}
  .fuss-erf{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:20px;padding-top:18px;border-top:1px solid var(--line2);font-size:13.5px;color:var(--faint)}
  .meldung{margin-top:14px;border-radius:11px;padding:13px 16px;font-size:14px}
  .meldung.ok{background:var(--zone);border:1px solid var(--zone-kante)}
  .meldung.fehler{background:rgba(232,115,94,.12);border:1px solid var(--high)}
  /* Akten */
  .akten-liste{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .akten-tabelle{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:16px}
  .akten-tabelle th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);font-weight:600;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .akten-tabelle th:first-child,.akten-tabelle td:first-child{text-align:left}
  .akten-tabelle td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
  .akten-tabelle tr.grp td{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);background:var(--surface2);padding-top:11px;padding-bottom:11px}
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px;margin-top:16px}
  .scroll .akten-tabelle{margin:0;min-width:820px}
  .hoch{color:var(--high)} .tief{color:var(--zweit)} .imsoll{color:var(--good)}
  .ev{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line2)}
  .ev .d{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .ev h4{margin:0 0 4px;font-size:16px;font-weight:620}
  .ev p{margin:0;font-size:14px;color:var(--muted)}
  .ev .lern{margin-top:6px;font-size:13.5px;color:var(--faint);font-style:italic}
  .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-left:8px}
  .diag{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .diag span{font-size:13px;color:var(--muted);background:var(--surface2);border:1px solid var(--line2);
    border-radius:8px;padding:5px 11px}
  .rb{padding:16px 0;border-bottom:1px solid var(--line2)}
  .rb .kw{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .rb h4{margin:4px 0 8px;font-size:16px;font-weight:620}
  .rb .txt{font-size:14px;color:var(--muted)}
  .rb .txt b{color:var(--ink)} .rb .txt ul{margin:6px 0;padding-left:20px}
  .ts{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px;align-items:flex-start}
  .ts-links{flex:1 1 420px;min-width:0}
  .ts-rechts{flex:1 1 240px;max-width:300px;min-width:0}
  .liste-kopf{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);padding-bottom:9px;border-bottom:1px solid var(--line)}
  .liste-roll{max-height:560px;overflow-y:auto}
  .lz{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line2);border-left:2px solid transparent;
    padding:11px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
  .lz:hover{background:var(--surface2)}
  .lz.an{background:var(--surface2);border-left-color:var(--akzent);color:var(--ink)}
  .lz i{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:0 0 auto;font-style:normal}
  .blatt{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .bz-row{display:grid;grid-template-columns:1fr auto 92px;gap:12px;align-items:baseline;padding:11px 16px;
    border-bottom:1px solid var(--line2)}
  .bz-row.grp{background:var(--surface2);font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--faint)}
  .bz-row .w{font-size:16px;font-weight:620}
  .bz-row .r{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
  .docs{margin-top:18px;border:1px solid var(--line);border-radius:13px;padding:15px 18px;background:var(--surface2)}
  /* Merkzettel: EIN schwebendes Element fuer alle Bilder. Der Zustand haengt nicht am
     UI-Objekt - sonst zeichnete jede Mausbewegung die ganze Seite neu.
     ZWEI STUFEN (Entscheid Albrecht vom 15.08.2026: «ziemlich ueberbordend, nimmt viel
     Raum ein»): Ueberfahren zeigt nur Datum, Wert und eine kurze Zeile - erst Anklicken
     bzw. Antippen klappt die Notiz auf. Eine Karte, die beim blossen Vorbeifahren ein
     Drittel des Bildes verdeckt, verdeckt das, worueber sie spricht. */
  .hit{fill:transparent;cursor:crosshair}
  #tip{position:fixed;z-index:60;pointer-events:none;background:var(--bg);border:1px solid var(--akzent);
    border-radius:10px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;max-width:270px}
  #tip .t-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  #tip .t-wert{font-size:19px;font-weight:640;letter-spacing:-.02em;margin-top:1px;white-space:nowrap}
  #tip .t-einheit{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:5px}
  #tip .t-sub{font-size:12px;color:var(--faint);margin-top:2px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #tip .t-wink{font-size:11.5px;color:var(--warn);margin-top:5px;white-space:nowrap}
  #tip .t-notiz{font-size:12.5px;color:var(--warn);margin-top:6px;padding-top:6px;border-top:1px solid var(--line);
    line-height:1.4}
  .notizpunkt{fill:var(--warn)}
  /* Erfassen als Kachelwand */
  .ek{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 20px;cursor:pointer;display:block;width:100%;min-width:0}
  .ek:hover{border-color:var(--akzent)}
  .ek.fertig{border-color:var(--zone-kante)}
  .ek.offen{border-color:var(--akzent);cursor:default}
  .ek-wert{font-size:30px;font-weight:640;letter-spacing:-.03em;line-height:1}
  .ek-plus{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--faint)}
  .ek-sub{font-size:12.5px;color:var(--faint);margin-top:7px}
  .kuerzel{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .kz-knopf{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:9px;
    padding:0 13px;height:38px;display:flex;align-items:center;font-size:14px;cursor:pointer}
  .kz-knopf.an{border-color:var(--akzent);background:var(--akzent);color:var(--akzent-fg);font-weight:600}
  textarea.notiz{width:100%;min-height:58px;font-family:inherit;font-size:15px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;line-height:1.5;resize:vertical}
  textarea.notiz:focus{outline:none;border-color:var(--akzent)}
  .med-z{display:grid;grid-template-columns:1fr 1fr 96px 34px;gap:8px;align-items:center;padding:7px 0;
    border-bottom:1px solid var(--line2)}
  .med-z input[type=text]{height:40px;font-size:14.5px}
  .med-weg{width:34px;height:34px;padding:0;font-size:15px;border:1px solid var(--line);background:var(--surface2);
    border-radius:9px;color:var(--faint);cursor:pointer}
  .med-weg:hover{border-color:var(--high);color:var(--high)}
  /* Modale */
  .modal-bg{position:fixed;inset:0;background:rgba(8,10,13,.72);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:40}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;
    max-width:520px;max-height:86vh;overflow:auto}
  .modal-kopf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;
    border-bottom:1px solid var(--line)}
  .modal-kopf h2{margin:0;font-size:18px;font-weight:620}
  .modal-koerper{padding:20px 22px 24px}
  .exp-zeile{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;
    border-bottom:1px solid var(--line2);cursor:pointer}
  .exp-zeile:last-of-type{border-bottom:none}
  .exp-name{font-size:14.5px}
  .stamm{margin-top:16px;padding:17px 20px}
  .fuss{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:34px;padding-top:18px;
    border-top:1px solid var(--line)}
  .fuss .pp{font-family:var(--mono);font-weight:700;letter-spacing:.14em;color:var(--marke);font-size:12px}
  .fuss .st{color:var(--faint);font-size:12px}
  .leer{max-width:520px;margin:40px auto;padding:30px 32px;display:flex;flex-direction:column;gap:12px}
  @media print{
    .no-print{display:none!important}
    body{padding:0}
    .karte,.buehne,.kachel{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="kopf">
    <div>
      <div class="eyebrow" id="kopfEyebrow">Monitoring</div>
      <h1 id="kopfZeile">MOPP+</h1>
    </div>
    <div class="werkzeuge no-print" id="werkzeuge">
      <button class="btn" id="btnConn" title="Datenspeicher"><span class="ampel" id="ampel"></span>⚙</button>
      <button class="btn stark" id="btnErf">✎ Erfassen</button>
      <button class="btn" id="btnExp" title="Für Arzt exportieren">⇪</button>
    </div>
  </header>

  <section class="karte stamm" id="stamm" hidden></section>
  <div class="status" id="status"></div>

  <main id="haupt"></main>

  <div class="fuss">
    <div class="pp">PASSEND | PRÄZISE | PRAKTISCH</div>
    <div class="st" id="fussText"></div>
  </div>
</div>

<div id="modale"></div>
<div id="tip"></div>

<script>
/* ══ Daten ══════════════════════════════════════════════════════════════════════
   STATE ist die monitoring.json, unveraendert. Der Neubau liest sie, er formt sie
   nicht um: was die Datei sagt, sagt die Ansicht. Geschrieben wird an dieselben
   Stellen, aus denen gelesen wird. */
/* Die beiden Marken sind kein Schmuck: der Arzt-Export ersetzt genau das, was zwischen
   ihnen steht, durch den eingefrorenen Datenstand. Ein Muster auf den Inhalt dieser
   Zeilen waere beim ersten Umbau still gebrochen. Marken nicht entfernen. */
/*STATE-ANFANG*/
var STATE = { updated:"", patient:{}, domain:{}, weight:{points:[]}, body:{points:[]},
  glucose:{days:[],slots:[],slotType:{},th:{}}, bloodpressure:{points:[]}, befinden:{dims:[],entries:[]},
  fluid:{weeks:[]}, digestion:{weeks:[]}, fitbit:{weeks:[]}, lab:{params:[],panels:[]},
  history:{events:[]}, meds:{liste:[]}, review:[], termine:[] };
/*STATE-ENDE*/

var UI = { seite:"wand", kz:null, bzView:"verlauf", reihe:"sleep", akte:null, blatt:0, sicht:null, wahl:null,
  erfTag:0, erfAuf:"auto", erfWerte:{}, erfBp:[{sys:"",dia:"",puls:"",note:""}], erfKuerzel:{}, erfMeldung:null,
  medEdit:false, medListe:null, medKopf:null };

/* Kuerzel: der wiederkehrende Teil einer Notiz als Knopf, der Rest als Freitext. Deine
   Blutdruck-Notizen zeigen, warum - «Linker Arm | Sitzt» steht vier Mal woertlich gleich
   da, dahinter jedes Mal etwas anderes. Ein reines Textfeld schlaeft nach zwei Wochen ein. */
var KUERZEL = {
  gw:["kein Stuhlgang","salzig gegessen","nach Sport","später als sonst"],
  bz:["viel Kohlenhydrate","spät gegessen","auswärts","nach Sport","krank"],
  bd:["Linker Arm, sitzend","nach Kaffee","auf Arbeit","nach dem Heimweg"],
  bf:["schlecht geschlafen","stressiger Tag","Kopfschmerzen"]
};

var FROZEN = false;   // wird in der Arztkopie auf true gesetzt

/* ══ Datenkanal ═════════════════════════════════════════════════════════════════
   Vier Fallen, alle vier absichtlich behandelt:
   1. Ein privates Repo antwortet auf eine fehlende Datei UND auf einen Token ohne
      Zugriff mit 404. "gibt es nicht" und "darfst du nicht" sehen gleich aus. Wer das
      als "Datei noch nicht angelegt" liest, stellt die Ampel auf gruen und gibt das
      Schreiben frei - in ein Repo, in das er nicht schreiben darf. Darum wird bei 404
      zuerst das Repo selbst geprueft.
   2. Ueber 1 MB liefert die Contents-API kein content, sondern encoding:"none". Dann
      muss der Rohtext in einer zweiten Anfrage geholt werden.
   3. Beim Schreiben braucht GitHub den sha der Fassung, auf der man aufsetzt. Ist er
      alt (zweites Geraet), kommt 409 oder 422 - dann sha neu holen und EINMAL erneut
      versuchen. Ohne das gehen Eintraege verloren.
   4. Der Token liegt im localStorage dieses Geraets und darf niemals in eine Kopie
      wandern, die aus dem Haus geht. Der Verbinden-Dialog wird darum vor dem Export
      aus dem Dokument entfernt. */
var CFG = null, SHA = null;
function cfgLesen(){ try{ return JSON.parse(localStorage.getItem("mopp.gh")||"null"); }catch(e){ return null; } }
function cfgSchreiben(c){ CFG=c; localStorage.setItem("mopp.gh", JSON.stringify(c)); }
function ghUrl(){ return "https://api.github.com/repos/"+CFG.repo+"/contents/"+CFG.file; }
function ghRef(){ return CFG.branch ? "?ref="+encodeURIComponent(CFG.branch) : ""; }
function ghKopf(x){ var h={ "Authorization":"Bearer "+CFG.token, "X-GitHub-Api-Version":"2022-11-28" };
  if(x) for(var k in x) h[k]=x[k]; return h; }
function ampel(z){ var a=document.getElementById("ampel"); if(!a) return;
  a.className = "ampel" + (z==="an"?" an":z==="busy"?" busy":""); }

async function ghHolen(){
  if(!CFG||!CFG.repo||!CFG.token) return false;
  ampel("busy");
  try{
    var r = await fetch(ghUrl()+ghRef(), {headers:ghKopf({"Accept":"application/vnd.github.object+json"}), cache:"no-store"});
    if(r.status===404){
      var rp = await fetch("https://api.github.com/repos/"+CFG.repo, {headers:ghKopf(), cache:"no-store"});
      if(!rp.ok){ ampel("aus"); return meldung("Kein Zugriff auf "+CFG.repo+". Repo-Name oder Token prüfen.", true); }
      ampel("an"); return meldung("Verbunden. Die Datei "+CFG.file+" gibt es dort noch nicht — der erste Speichervorgang legt sie an.");
    }
    if(!r.ok){ ampel("aus"); return meldung("GitHub antwortet "+r.status+".", true); }
    var j = await r.json();
    SHA = j.sha || null;
    var text;
    if(j.content && j.encoding==="base64"){
      text = new TextDecoder("utf-8").decode(Uint8Array.from(atob(j.content.replace(/\n/g,"")), function(c){ return c.charCodeAt(0); }));
    } else {
      var rr = await fetch(j.download_url, {cache:"no-store"});
      text = await rr.text();
    }
    zustandSetzen(JSON.parse(text));
    ampel("an");
    return true;
  }catch(e){ ampel("aus"); return meldung("Laden fehlgeschlagen: "+e.message, true); }
}

async function ghSchreiben(obj, nochmal){
  if(!CFG||!CFG.repo||!CFG.token) return meldung("Nicht verbunden — es wurde nichts geändert.", true);
  ampel("busy");
  var text = JSON.stringify(obj, null, 2);
  /* In Bloecken kodieren. btoa(String.fromCharCode.apply(null, bytes)) sieht kuerzer aus
     und stirbt bei dieser Dateigroesse: apply mit 166'000 Argumenten wirft RangeError,
     und ein Speichern, das stumm scheitert, ist an dieser Stelle das Schlimmste. */
  var bytes = new TextEncoder().encode(text), roh = "";
  for(var i=0;i<bytes.length;i+=0x8000) roh += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  var b64 = btoa(roh);
  var koerper = { message:"Monitoring "+obj.updated, content:b64 };
  if(CFG.branch) koerper.branch = CFG.branch;
  if(SHA) koerper.sha = SHA;
  var r = await fetch(ghUrl(), {method:"PUT", headers:ghKopf({"Content-Type":"application/json"}), body:JSON.stringify(koerper)});
  if((r.status===409 || r.status===422) && !nochmal){
    var g = await fetch(ghUrl()+ghRef(), {headers:ghKopf(), cache:"no-store"});
    if(g.ok){ var gj = await g.json(); SHA = gj.sha; return ghSchreiben(obj, true); }
  }
  if(!r.ok){ ampel("aus"); return meldung("Speichern fehlgeschlagen ("+r.status+"). Es wurde nichts geändert.", true); }
  var j = await r.json();
  SHA = j.content && j.content.sha;
  ampel("an");
  return true;
}

function meldung(t, fehler){ UI.erfMeldung = {text:t, fehler:!!fehler}; zeichne(); return !fehler; }

function zustandSetzen(o){
  for(var k in STATE) delete STATE[k];
  for(var k2 in o) STATE[k2] = o[k2];
  zeichne();
}

/* ══ Format ═════════════════════════════════════════════════════════════════════ */
function nf(v,dz){ return (v==null||!isFinite(v)) ? "—" : (+v).toFixed(dz==null?1:dz).replace(".",","); }
function tsd(v){ return v==null?"—":Math.round(v).toLocaleString("de-CH").replace(/,/g,"'"); }
function dm(iso){ return iso ? iso.slice(8,10)+"."+iso.slice(5,7)+"." : "—"; }
function dmy(iso){ return iso ? dm(iso)+iso.slice(0,4) : "—"; }
function ms(iso){ return new Date(iso+"T12:00:00").getTime(); }
function vz(v,dz){ return (v<0?"−":"+")+nf(Math.abs(v),dz); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function isoVon(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function heuteMs(){ var u=STATE.updated; if(!u) return Date.now();
  return ms(u.slice(6)+"-"+u.slice(3,5)+"-"+u.slice(0,2)); }
function tage(iso){ return Math.round((heuteMs()-ms(iso))/86400000); }
function zahl(n,e,m){ return n+" "+(n===1?e:m); }
function mittel(a){ return a.length ? a.reduce(function(s,x){return s+x;},0)/a.length : null; }

/* ══ Merkzettel-Register ════════════════════════════════════════════════════════
   Der Inhalt der Merkzettel liegt in einem Register, nicht in HTML-Attributen: eine
   Notiz kann Anfuehrungszeichen, Zeilenumbrueche und Emoji enthalten, und was in ein
   Attribut geschrieben und wieder gelesen wird, ist irgendwann kaputt. Das Register
   wird bei jedem zeichne() geleert - sonst waechst es mit jeder Mausbewegung. */
var TIPS = {}, TIPN = 0;
function tipReg(o){ var id = "t"+(++TIPN); TIPS[id] = o; return id; }

/* ══ Blutzucker: drei Messpunkte und zwei Massstaebe ════════════════════════════
   NORM sind die Werte eines Nicht-Diabetikers - sie stehen als gestrichelte Linie im
   Bild und sind das ZIEL. STATE.glucose.th sind Deine Therapiegrenzen und entscheiden
   ueber «im Soll». Beides gleichzeitig, beides beschriftet; wer sie vermischt, macht
   aus einem erreichten Therapieziel ein Versagen oder umgekehrt.
   Die drei Messpunkte ersetzen sechs: mit 17/35/42 Werten je Gruppe tragen Quartile
   etwas, mit 6 und 8 nicht - und die Referenztabelle kennt genau diese Einteilung. */
var NORM = { pre:5.6, post:7.8 };
var SLOT3 = [ {k:"nüchtern", t:"pre", lang:"nüchtern", hint:"vor 10 Uhr, nichts gegessen"},
  {k:"vor Essen", t:"pre", lang:"vor dem Essen", hint:"vor Mittag oder vor Abend"},
  {k:"nach Essen", t:"post", lang:"nach dem Essen", hint:"ein bis zwei Stunden danach"} ];
/* Alte Messpunkte auf die drei abbilden. Die Datei bleibt wie sie ist - was einmal als
   «nach Frühstück» erfasst wurde, heisst dort weiter so; nur die Anzeige fasst zusammen. */
function slot3(s){
  s = String(s||"");
  if(/^nüchtern/i.test(s)) return "nüchtern";
  if(/^vor/i.test(s)) return "vor Essen";
  if(/^nach/i.test(s)) return "nach Essen";
  var ty = (STATE.glucose.slotType||{})[s];
  return ty==="pre" ? "vor Essen" : "nach Essen";
}
function slot3Typ(k){ var f = SLOT3.filter(function(x){ return x.k===k; })[0]; return f?f.t:"post"; }
function normFuer(slot){ return slot3Typ(slot3(slot))==="pre" ? NORM.pre : NORM.post; }

/* ══ Reihen ═════════════════════════════════════════════════════════════════════
   Eine Rechenstelle je Reihe. Wer eine Zahl braucht, holt sie hier - nicht in der
   Ansicht. Das Register des alten Werkzeugs ist damit auf sechs Reihen geschrumpft. */
function rGewicht(){ return (STATE.weight.points||[]).filter(function(p){ return !p.hist && p.value!=null; })
  .map(function(p){ return {iso:p.date, v:+p.value, note:p.note||null}; }).sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function rBzAlle(){ var out=[];
  (STATE.glucose.days||[]).forEach(function(d){ (d.rows||[]).forEach(function(r){ (r.values||[]).forEach(function(v){
    if(v && v.v!=null) out.push({iso:d.iso, slot:r.slot, g3:slot3(r.slot), v:+v.v, t:v.t||null, note:v.note||null}); }); }); });
  return out.sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function rBzTage(){ var m={}, nz={};
  rBzAlle().forEach(function(x){ (m[x.iso]=m[x.iso]||[]).push(x.v);
    if(x.note) (nz[x.iso]=nz[x.iso]||[]).push(x.note); });
  (STATE.glucose.days||[]).forEach(function(d){ if(d.note) (nz[d.iso]=nz[d.iso]||[]).unshift(d.note); });
  return Object.keys(m).sort().map(function(iso){ return {iso:iso, v:mittel(m[iso]), n:m[iso].length,
    note:nz[iso]?nz[iso].join(" · "):null}; }); }
function rBp(){ return (STATE.bloodpressure.points||[]).filter(function(p){ return p.sys!=null; })
  .map(function(p){ return {iso:p.iso, v:+p.sys, dia:p.dia!=null?+p.dia:null, pulse:p.pulse!=null?+p.pulse:null,
    time:p.time||null, note:p.note||null}; })
  .sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function rFitbit(feld){ var f={sleep:function(w){return w.sleep&&w.sleep.avgH;}, steps:function(w){return w.steps&&w.steps.avg;},
    rhr:function(w){return w.rhr&&w.rhr.avg;}}[feld];
  return (STATE.fitbit.weeks||[]).map(function(w){ return {iso:w.weekStart, v:f(w)!=null?+f(w):null, label:w.label}; })
    .filter(function(x){ return x.v!=null; }).sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function befDims(){ return STATE.befinden.dims||[]; }
function rBefinden(){ var ks=befDims().map(function(x){return x.key;});
  return (STATE.befinden.entries||[]).filter(function(e){ return ks.every(function(k){ return e[k]!=null; }); })
    .map(function(e){ var o={}; for(var k in e) o[k]=e[k];
      o.idx = ks.reduce(function(a,k){ return a+e[k]; },0)/ks.length; return o; })
    .sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
function letzteWoche(liste, feld){ var a=(liste||[]).filter(function(w){ return w[feld]!=null; })
  .sort(function(x,y){ return x.weekStart<y.weekStart?-1:1; }); return a.length?a[a.length-1]:null; }
function rKoerper(){ return (STATE.body.points||[]).filter(function(p){ return p.waist&&p.hip; })
  .sort(function(a,b){ return a.date<b.date?-1:1; }); }
function periode(){ return (STATE.domain&&STATE.domain.from) ? tage(STATE.domain.from)+1 : null; }

/* ══ Linien ═════════════════════════════════════════════════════════════════════
   Eine Messluecke ist kein Messwert. Bis zum doppelten ueblichen Abstand (mindestens
   acht Tage) laeuft die Linie durch, darueber eine gestrichelte Bruecke, ab dem
   vierfachen (mindestens 15 Tage) bricht sie. Die Untergrenze von acht Tagen ist
   Absicht: der blosse Median bestraft jeden Kadenzwechsel - als im Juni wochentlich
   und im August taeglich gewogen wurde, sank er auf drei Tage und machte die voellig
   regelmaessige Wochenwaegung nachtraeglich zur Luecke. */
function segmente(reihe, XY, schwellen){
  var pts = (reihe||[]).filter(function(x){ return x && x.v!=null; });
  if(!pts.length) return [];
  if(pts.length===1) return [{p:stummel(XY(pts[0])), strich:null}];
  var iv=[]; for(var i=1;i<pts.length;i++) iv.push((ms(pts[i].iso)-ms(pts[i-1].iso))/86400000);
  var s = iv.slice().sort(function(a,b){return a-b;}), med = s[Math.floor(s.length/2)]||1;
  var voll = (schwellen&&schwellen.voll) || Math.max(8, 2*med);
  var bruecke = (schwellen&&schwellen.bruecke) || Math.max(15, 4*med);
  var out=[], enden={}, lauf=[XY(pts[0])];
  function schliesse(){ if(lauf.length>1) out.push({p:lauf.join(" "), strich:null});
    else if(lauf.length===1) out.push({p:stummel(lauf[0]), strich:null, allein:lauf[0]}); }
  for(var j=1;j<pts.length;j++){
    var dt = (ms(pts[j].iso)-ms(pts[j-1].iso))/86400000;
    if(dt<=voll){ lauf.push(XY(pts[j])); continue; }
    schliesse();
    if(dt<=bruecke){ var a=XY(pts[j-1]), b=XY(pts[j]); out.push({p:a+" "+b, strich:"3 4"}); enden[a]=1; enden[b]=1; }
    lauf=[XY(pts[j])];
  }
  schliesse();
  return out.filter(function(x){ return !x.allein || !enden[x.allein]; });
}
function stummel(xy){ var a=xy.split(","), x=Math.max(0,+a[0]-1.6);
  return x.toFixed(1)+","+a[1]+" "+(x+3.2).toFixed(1)+","+a[1]; }

/* Funkenlinie fuer die Kacheln. Keine Achsen, keine Punkte - dafuer gilt in der Kachel:
   was gestrichelt ist, ist nicht gemessen. */
function funke(reihe, farbe, w, h, schwellen){
  var v = (reihe||[]).map(function(x){return x.v;});
  if(!v.length) return "";
  w=w||260; h=h||46;
  var mn=Math.min.apply(null,v), mx=Math.max.apply(null,v), sp=(mx-mn)||1, p=3;
  var x0=ms(reihe[0].iso), x1=ms(reihe[reihe.length-1].iso), sx=(x1-x0)||1;
  function XY(r){ return (((ms(r.iso)-x0)/sx)*w).toFixed(1)+","+(p+(1-(r.v-mn)/sp)*(h-2*p)).toFixed(1); }
  return segmente(reihe, XY, schwellen).map(function(s){
    return '<polyline points="'+s.p+'" fill="none" stroke="'+farbe+'" stroke-width="'+(s.strich?1:1.6)+'"'
      + (s.strich?' stroke-dasharray="'+s.strich+'" opacity=".5"':'') + ' vector-effect="non-scaling-stroke"></polyline>';
  }).join("");
}
/* Trefferflaechen auch in der Kachel: die Funke ist klein, aber der Merkzettel soll
   ueberall dieselbe Antwort geben. In der Kachel nur beim Ueberfahren - ein Tippen
   gehoert dort dem Sprung ins Vollbild. */
function funkeHits(reihe, w, h, opt){
  opt = opt||{};
  var pts = (reihe||[]).filter(function(x){ return x && x.v!=null; });
  if(pts.length<2) return "";
  var x0=ms(pts[0].iso), x1=ms(pts[pts.length-1].iso), sx=(x1-x0)||1;
  var xs = pts.map(function(r){ return ((ms(r.iso)-x0)/sx)*w; });
  return pts.map(function(r,i){
    var lo = i ? (xs[i]+xs[i-1])/2 : 0, hi = i<pts.length-1 ? (xs[i]+xs[i+1])/2 : w;
    var id = tipReg({ tag:dmy(r.iso), wert:nf(r.v,opt.dez==null?1:opt.dez), einheit:opt.einheit||"",
      sub:opt.sub?opt.sub(r):"", notiz:r.note||"" });
    return '<rect class="hit" data-tip="'+id+'" data-nurhover="1" x="'+lo.toFixed(1)+'" y="0" width="'
      + Math.max(1,hi-lo).toFixed(1)+'" height="'+h+'"></rect>';
  }).join("");
}
function funkeSvg(inhalt, w, h, hits){
  return '<svg viewBox="0 0 '+(w||260)+' '+(h||46)+'" preserveAspectRatio="none" style="width:100%;height:'+(h||46)+'px;display:block;margin-top:12px">'+inhalt+(hits||"")+'</svg>';
}

/* Grosses Diagramm: Achsen, jeder Messpunkt als Raute. Hier darf keine Messung fehlen.
   Zwei Ebenen, die verschiedene Fragen beantworten: die FLAECHE (opt.zone) ist der
   Bereich, in dem ein Wert unbedenklich ist - Flaeche plus beide Kanten, damit der
   Rand nicht geraten werden muss. Die GESTRICHELTEN Linien (opt.linien) sind der
   angestrebte Massstab. Die Flaeche sagt «unbedenklich», die Linie sagt «Ziel». */
function bild(reihen, opt){
  opt = opt||{};
  var L=46,R=690,T=16,B=222, alle=[];
  reihen.forEach(function(r){ (r.pts||[]).forEach(function(p){ if(p.v!=null) alle.push(p); }); });
  if(!alle.length) return '<div class="bildtext">Noch nicht gemessen.</div>';
  var xs=alle.map(function(p){return ms(p.iso);});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  if(x1===x0){ x0-=86400000; x1+=86400000; }
  var vs=alle.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(opt.zone){ mn=Math.min(mn,opt.zone[0]); mx=Math.max(mx,opt.zone[1]); }
  (opt.linien||[]).forEach(function(l){ mn=Math.min(mn,l.v); mx=Math.max(mx,l.v); });
  var pad=(mx-mn)*0.12||1; mn-=pad; mx+=pad;
  function X(iso){ return L+((ms(iso)-x0)/(x1-x0))*(R-L); }
  function Y(v){ return T+(1-(v-mn)/((mx-mn)||1))*(B-T); }
  var h="";
  if(opt.zone){
    var yz1=Y(opt.zone[1]), yz2=Y(opt.zone[0]);
    h += '<rect x="'+L+'" y="'+yz1.toFixed(1)+'" width="'+(R-L)+'" height="'+Math.abs(yz2-yz1).toFixed(1)+'" fill="var(--zone)"></rect>'
      +  '<line x1="'+L+'" y1="'+yz1.toFixed(1)+'" x2="'+R+'" y2="'+yz1.toFixed(1)+'" stroke="var(--zone-kante)" stroke-width="1"></line>'
      +  '<line x1="'+L+'" y1="'+yz2.toFixed(1)+'" x2="'+R+'" y2="'+yz2.toFixed(1)+'" stroke="var(--zone-kante)" stroke-width="1"></line>';
  }
  for(var i=0;i<=4;i++){
    var v=mn+(mx-mn)*i/4, y=Y(v);
    h += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+R+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"></line>'
      +  '<text x="40" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" fill="var(--faint)" font-size="10.5" font-family="var(--mono)">'+nf(v,opt.dez==null?1:opt.dez)+'</text>';
  }
  (opt.linien||[]).forEach(function(l){
    var ly=Y(l.v);
    h += '<line x1="'+L+'" y1="'+ly.toFixed(1)+'" x2="'+R+'" y2="'+ly.toFixed(1)+'" stroke="'+(l.farbe||"var(--warn)")
      + '" stroke-width="1.4" stroke-dasharray="6 5"'+(l.blass?' opacity=".55"':'')+'></line>'
      + '<text x="'+(R+5)+'" y="'+(ly+3.5).toFixed(1)+'" fill="'+(l.farbe||"var(--warn)")+'" font-size="10" '
      + 'font-family="var(--mono)"'+(l.blass?' opacity=".7"':'')+'>'+esc(l.label||nf(l.v,1))+'</text>';
  });
  var isos=alle.map(function(p){return p.iso;}).sort();
  [0,0.5,1].forEach(function(f){ var iso=isos[Math.round(f*(isos.length-1))];
    h += '<text x="'+X(iso).toFixed(1)+'" y="242" text-anchor="middle" fill="var(--faint)" font-size="10.5" font-family="var(--mono)">'+dm(iso)+'</text>'; });
  var bruecken=0, volle=0;
  reihen.forEach(function(r){
    function XY(p){ return X(p.iso).toFixed(1)+","+Y(p.v).toFixed(1); }
    segmente(r.pts, XY, opt.schwellen).forEach(function(s){
      if(s.strich) bruecken++; else volle++;
      h += '<polyline points="'+s.p+'" fill="none" stroke="'+r.farbe+'" stroke-width="'+(s.strich?1.2:(r.dick||2))+'"'
        + (s.strich?' stroke-dasharray="'+s.strich+'"':'') + ' stroke-linejoin="round"></polyline>';
    });
    (r.pts||[]).forEach(function(p){ if(p.v==null) return;
      h += '<circle cx="'+X(p.iso).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(r.r||2.6)+'" fill="'+r.farbe+'"></circle>'; });
  });
  /* Merkzettel: eine Trefferflaeche je Tag, halber Weg zum Nachbarn. Was der Zettel
     zeigt, steht in der Reihe selbst - so muss die Ansicht nichts nachschlagen.
     An einem Tag mit mehreren Messungen wird ZUSAMMENGEFASST, nicht aufgezaehlt: am
     02.08. lagen sechs Blutdruckmessungen, und zwoelf Einzelwerte in einem Zettel sind
     keine Antwort, sondern eine Tabelle. */
  var proTag = {};
  reihen.forEach(function(r, ri){ (r.pts||[]).forEach(function(p){ if(p.v==null) return;
    var d = proTag[p.iso] = proTag[p.iso] || {};
    (d[ri] = d[ri] || {r:r, pts:[]}).pts.push(p); }); });
  var tage = Object.keys(proTag).sort();
  var tx = tage.map(X);
  var notizen = 0;
  h += tage.map(function(iso, i){
    var lo = i ? (tx[i]+tx[i-1])/2 : L, hi = i<tage.length-1 ? (tx[i]+tx[i+1])/2 : R;
    var d = proTag[iso], ks = Object.keys(d).sort();
    /* Der Durchschnitt ist die Antwort, nicht die Liste. Die Spanne kommt nur dazu, wenn
       sie etwas sagt - am 02.08. lagen sechs Blutdruckmessungen zwischen 100 und 126,
       das verschweigt ein Mittelwert. An einem gewoehnlichen Tag steht sie nicht da. */
    function zeig(g){
      var vs = g.pts.map(function(x){ return x.v; });
      var dez = g.r.dez==null ? (opt.dez==null?1:opt.dez) : g.r.dez;
      var m = mittel(vs);
      if(vs.length===1) return {txt:nf(m,dez), breit:false};
      var mn2=Math.min.apply(null,vs), mx2=Math.max.apply(null,vs);
      var breit = m ? (mx2-mn2)/Math.abs(m) > 0.08 : false;
      return {txt:(vs.length>1?"Ø ":"")+nf(m,dez), breit:breit,
        spanne:nf(mn2,dez)+"–"+nf(mx2,dez)};
    }
    var erste = d[ks[0]], n = erste.pts.length, e0 = zeig(erste);
    var teile = [];
    if(n>1) teile.push(zahl(n,"Messung","Messungen"));
    else if(opt.sub){ var s0 = opt.sub(erste.pts[0]); if(s0) teile.push(s0); }
    ks.slice(1).forEach(function(k){ var z=zeig(d[k]);
      teile.push((d[k].r.name?d[k].r.name+" ":"")+z.txt); });
    if(e0.breit) teile.push("Spanne "+e0.spanne);
    var note = ks.reduce(function(a,k){ return a.concat(d[k].pts.map(function(p){ return p.note||""; })); }, [])
      .filter(Boolean).filter(function(x,ix,arr){ return arr.indexOf(x)===ix; }).join(" · ");
    if(note) notizen++;
    var id = tipReg({ tag:dmy(iso), wert:e0.txt, einheit:opt.einheit||"",
      sub:teile.join(" · "), notiz:note });
    return '<rect class="hit" data-tip="'+id+'" x="'+lo.toFixed(1)+'" y="'+T+'" width="'
      + Math.max(1,hi-lo).toFixed(1)+'" height="'+(B-T)+'"></rect>'
      + (note ? '<circle class="notizpunkt" cx="'+tx[i].toFixed(1)+'" cy="'+(B+9)+'" r="2.4"></circle>' : "");
  }).join("");
  var text = opt.text||"";
  if(bruecken) text += " Gestrichelt heisst: dazwischen wurde nicht gemessen.";
  if(volle>1+bruecken) text += " Wo die Linie bricht, fehlt die Messung ganz.";
  if(notizen) text += " Der kleine gelbe Punkt unter der Achse heisst: an diesem Tag steht eine Notiz.";
  return '<svg viewBox="0 0 720 250" style="width:100%;height:auto;display:block;margin-top:18px">'+h+'</svg>'
    + (text?'<div class="bildtext">'+text+'</div>':'');
}

/* ══ Kennzahlen ═════════════════════════════════════════════════════════════════
   Fuenf, nicht zwanzig. Jede beantwortet eine Frage, die taeglich gestellt wird;
   alles Uebrige ist Nebenzahl und steht als Zeile im Vollbild. */
function ampelFarbe(gut, warn){ return gut ? "var(--good)" : (warn ? "var(--warn)" : "var(--ink)"); }

function KZ(){
  var G=rGewicht(), BZ=rBzAlle(), BZT=rBzTage(), BP=rBp();
  var SL=rFitbit("sleep"), BF=rBefinden();
  var th=STATE.glucose.th||{}, ty=STATE.glucose.slotType||{};
  var bz14 = BZ.filter(function(x){ return ms(x.iso)>=heuteMs()-14*86400000; });
  var bzOe = mittel((bz14.length?bz14:BZ).map(function(x){return x.v;}));
  var imSoll = BZ.filter(function(x){ return ty[x.slot]==="pre" ? x.v<=th.preHigh : x.v<=th.postHigh; });
  var pSoll = BZ.length ? Math.round(100*imSoll.length/BZ.length) : null;
  var bpL = BP.length?BP[BP.length-1]:null;
  var bp7 = BP.filter(function(p){ return ms(p.iso)>=heuteMs()-7*86400000; });
  var bpTageN = Object.keys(BP.reduce(function(m,p){ m[p.iso]=1; return m; },{})).length;
  var slL = SL.length?SL[SL.length-1]:null;
  var bfL = BF.length?BF[BF.length-1]:null;
  var gL = G.length?G[G.length-1]:null;

  return {
    gewicht:{ key:"gewicht", label:"Gewicht", einheit:"kg", reihe:G, farbe:"var(--good)", dez:1,
      wert:gL?nf(gL.v,1):"—", zustand:"var(--ink)",
      meta:G.length+" Messungen · "+periode()+" Tage" },
    bz:{ key:"bz", label:"Blutzucker", einheit:"mmol/l", reihe:BZT, farbe:"var(--akzent)", dez:1,
      sub:function(p){ return zahl(p.n||1,"Messung","Messungen"); },
      wert:nf(bzOe,1), zustand:ampelFarbe(pSoll>=90, pSoll<75),
      unter:"Ø 14 Tage · "+(pSoll!=null?pSoll+" % im Soll":"—"),
      meta:BZ.length+" Messungen · "+BZT.length+" Tage" },
    bd:{ key:"bd", label:"Blutdruck", einheit:"mmHg", reihe:BP, farbe:"var(--akzent)", dez:0,
      sub:function(p){ return [p.dia!=null?"diastolisch "+Math.round(p.dia):"",
        p.pulse!=null?"Puls "+Math.round(p.pulse):"", p.time||""].filter(Boolean).join(" · "); },
      wert:bpL?(Math.round(bpL.v)+"/"+Math.round(bpL.dia)):"—",
      zustand:ampelFarbe(bpL&&bpL.v<130, bpL&&bpL.v>=140),
      unter:(bpL?dm(bpL.iso):"—")+(bp7.length?" · Ø 7 Tage "+Math.round(mittel(bp7.map(function(p){return p.v;})))+"/"+Math.round(mittel(bp7.map(function(p){return p.dia;}))):""),
      meta:BP.length+" Messungen · "+bpTageN+" Tage" },
    schlaf:{ key:"schlaf", label:"Schlaf", einheit:"h", reihe:SL, farbe:"var(--warn)", dez:1,
      sub:function(p){ return p.label?"Woche "+p.label:""; },
      wert:slL?nf(slL.v,1):"—", zustand:ampelFarbe(slL&&slL.v>=7, slL&&slL.v<6),
      unter:(slL?"Woche "+slL.label:"—")+" · Ziel 7 h",
      meta:SL.length+" Wochen · Fitbit" },
    befinden:{ key:"befinden", label:"Befinden", einheit:"von 5", dez:1,
      reihe:BF.map(function(e){ return {iso:e.iso, v:e.idx, note:e.note||null}; }), farbe:"var(--akzent)",
      wert:bfL?nf(bfL.idx,1):"—", zustand:ampelFarbe(bfL&&bfL.idx>=4, bfL&&bfL.idx<=2),
      meta:BF.length+" volle Einträge" }
  };
}

function zeichneStatus(){
  var G=rGewicht(), BZT=rBzTage(), BP=rBp(), BF=rBefinden();
  var letzte = [ {n:"Gewicht", r:G}, {n:"Blutzucker", r:BZT}, {n:"Blutdruck", r:BP}, {n:"Befinden", r:BF} ]
    .filter(function(x){ return x.r.length; })
    .map(function(x){ return {n:x.n, iso:x.r[x.r.length-1].iso}; });
  var alt = letzte.filter(function(x){ return tage(x.iso)>=3; }).sort(function(a,b){ return tage(b.iso)-tage(a.iso); });
  var luecke = alt.length
    ? alt.map(function(x){return x.n;}).join(" und ")+" zuletzt am "+dm(alt[0].iso)+" — "+tage(alt[0].iso)+" Tage her."
    : (letzte.length ? "Alles der letzten drei Tage ist erfasst." : "");
  var t = (STATE.termine||[]).filter(function(x){ return x.date && ms(x.date)>heuteMs(); })
    .sort(function(a,b){ return a.date<b.date?-1:1; })[0];
  var termin = t ? (t.wer||"Termin")+" am "+dm(t.date)+", in "+Math.abs(tage(t.date))+" Tagen." : "";
  document.getElementById("status").innerHTML =
    '<div style="color:var(--warn)">'+esc(luecke)+'</div><div style="color:var(--faint)">'+esc(termin)+'</div>';
}

function tempoFenster(G, tageN){
  if(G.length<2) return null;
  var grenze = heuteMs()-tageN*86400000;
  var f = G.filter(function(p){ return ms(p.iso)>=grenze; });
  var basis = f.length>1 ? f[0] : G[G.length-2], letzt = G[G.length-1];
  var dt = (ms(letzt.iso)-ms(basis.iso))/86400000;
  return dt>0 ? (letzt.v-basis.v)/dt*7 : null;
}

    + '<div class="b-kopf"><div style="min-width:0;flex:1 1 260px">'
    +   '<div class="k-name">'+esc(kz.label)+'</div>'
    +   '<div style="display:flex;align-items:baseline;gap:10px;margin-top:7px;white-space:nowrap">'
    +     '<div class="b-zahl" style="color:'+kz.zustand+'">'+kopfWert+'</div>'
    +     '<div class="k-einheit">'+esc(kopfEinheit)+'</div></div></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">'
    +   (FROZEN?'':'<button class="btn stark" id="btnErf2">✎ Erfassen</button>')
    +   '<button class="btn rund" data-zu="1">×</button></div></div>'
    + '<p class="satz">'+esc(satz)+'</p>'
    + (schalter?schalterHtml(schalter):"")
    + inhalt
    + nebenHtml(neben)
    + '</div>';
}

/* Tagesmuster: eine Zeile je Messpunkt — seit dem Umbau drei statt sechs. Der Gewinn ist
   nicht Kürze, sondern Statistik: mit 17, 35 und 42 Werten tragen Quartile etwas, mit 6
   und 8 nicht. Die Achse reicht von der Untergrenze des Korridors bis über seine Oberkante,
   sonst läge die Kante ausserhalb des Bildes. */
function tagesmuster(BZ, th){
  var v = BZ.map(function(x){return x.v;});
  if(!v.length) return '<div class="bildtext">Noch nicht gemessen.</div>';
  var lo = Math.min(th.critLow!=null?th.critLow:3, Math.min.apply(null,v));
  var hi = Math.max(Math.max.apply(null,v), th.postHigh||10, NORM.post) + 1;
  var sp = (hi-lo)||1;
  function pc(x){ return ((x-lo)/sp)*100; }
  function q(a,p){ var s=a.slice().sort(function(x,y){return x-y;}), i=(s.length-1)*p;
    return s[Math.floor(i)]+(s[Math.ceil(i)]-s[Math.floor(i)])*(i-Math.floor(i)); }
  var h = '<div style="display:flex;flex-direction:column;gap:20px;margin-top:20px">';
  SLOT3.forEach(function(g){
    var a = BZ.filter(function(x){ return x.g3===g.k; }).map(function(x){ return x.v; });
    if(!a.length) return;
    var soll = g.t==="pre" ? NORM.pre : NORM.post;
    var drin = a.filter(function(x){ return x<soll; }).length;
    var mn=Math.min.apply(null,a), mx=Math.max.apply(null,a), md=q(a,.5);
    h += '<div><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px">'
      + '<div style="font-size:15px;font-weight:620">'+esc(g.lang)+'</div>'
      + '<div class="mono" style="font-size:11px;color:var(--faint)">'+zahl(a.length,"Wert","Werte")+' · '
      +   drin+' unter '+nf(soll,1)+'</div></div>'
      + '<div style="position:relative;height:38px;background:var(--surface2);border-radius:7px">'
      +   '<div style="position:absolute;top:0;bottom:0;left:'+pc(lo).toFixed(1)+'%;width:'+(pc(th.postHigh||10)-pc(lo)).toFixed(1)+'%;background:var(--zone);border-left:1px solid var(--zone-kante);border-right:1px solid var(--zone-kante)"></div>'
      +   '<div style="position:absolute;top:0;bottom:0;left:'+pc(soll).toFixed(1)+'%;border-left:1.4px dashed var(--warn)"></div>'
      +   '<div style="position:absolute;top:17px;height:3px;left:'+pc(mn).toFixed(1)+'%;width:'+Math.max(0.6,pc(mx)-pc(mn)).toFixed(1)+'%;background:var(--faint);border-radius:2px"></div>'
      +   '<div style="position:absolute;top:9px;height:20px;left:'+pc(q(a,.25)).toFixed(1)+'%;width:'+Math.max(0.8,pc(q(a,.75))-pc(q(a,.25))).toFixed(1)+'%;background:rgba(143,184,232,.28);border-radius:4px"></div>'
      +   '<div style="position:absolute;top:6px;height:26px;width:2px;left:'+pc(md).toFixed(1)+'%;background:var(--ink)"></div>'
      + '</div>'
      + '<div style="font-size:12.5px;color:var(--faint);margin-top:6px">'+esc(g.hint)+' · Median '+nf(md,1)
      +   ' · Spanne '+nf(mn,1)+' bis '+nf(mx,1)+' · gestrichelt '+nf(soll,1)+'</div></div>';
  });
  h += '<div class="mono" style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)">'
    +   '<span>'+nf(lo,1)+'</span><span>mmol/l</span><span>'+nf(hi,1)+'</span></div></div>'
    + '<div class="bildtext">Kasten = mittlere Hälfte, heller Strich = Median, feine Linie = Spanne. '
    + 'Die Fläche ist der Korridor '+nf(lo,1)+' bis '+nf(th.postHigh||10,1)+', die gestrichelte Kante der Massstab eines '
    + 'Nicht-Diabetikers für diesen Messpunkt. Ältere Messungen aus sechs Messpunkten sind hier zusammengefasst — '
    + 'die Uhrzeit steht an jeder einzelnen Messung und bleibt erhalten.</div>';
  return h;
}

function wochentafel(BF, dims){
  var sp = BF.slice(-10);
  if(!sp.length) return '<div class="bildtext">Noch nicht erfasst.</div>';
  function bg(v){ return v>=4?"rgba(95,192,140,.22)":(v===3?"rgba(143,184,232,.16)":"rgba(224,178,92,.2)"); }
  var kopf = '<div style="display:grid;grid-template-columns:118px repeat('+sp.length+',minmax(0,1fr));gap:5px">'
    + '<div></div>'+sp.map(function(e){ return '<div class="mono" style="font-size:10px;color:var(--faint);text-align:center">'+dm(e.iso)+'</div>'; }).join("")+'</div>';
  var zeilen = dims.map(function(d){
    return '<div style="display:grid;grid-template-columns:118px repeat('+sp.length+',minmax(0,1fr));gap:5px;align-items:center">'
      + '<div style="font-size:13px;color:var(--muted);text-align:right">'+esc(d.label)+'</div>'
      + sp.map(function(e){ var v=e[d.key];
          return '<div style="height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:'
            + (v!=null?bg(v):"var(--surface2)")+'">'+(v!=null?v:"")+'</div>'; }).join("")+'</div>';
  }).join("");
  return '<div style="overflow-x:auto;margin-top:20px"><div style="display:flex;flex-direction:column;gap:5px;min-width:520px">'
    + kopf+zeilen+'</div></div>'
    + '<div class="bildtext">Sechs Skalen, ein Feld je Erfassungstag, 1 bis 5. Ein leeres Feld heisst: nicht erfasst.</div>';
}

var AKTEN = [ {k:"labor",t:"Labor"}, {k:"history",t:"Krankengeschichte"}, {k:"meds",t:"Medikation"},

/* Balken statt Linie: bei einer Akte ist die Frage nicht «welcher Wert», sondern «wie viel
   liegt in welchem Jahr». Leere Jahre bleiben leer - die Lücke ist die Aussage. */
function balkenSvg(vals, w, h, farbe, marken){
  var mx = Math.max.apply(null, vals.concat([1])), n = vals.length, gap = 2;
  var bw = (w-(n-1)*gap)/n, s = "";
  vals.forEach(function(v,i){
    var bh = v ? Math.max(2, v/mx*h) : 0;
    if(!bh) return;
    var id = marken ? tipReg(marken(i,v)) : null;
    s += '<rect x="'+(i*(bw+gap)).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)
      + '" fill="'+farbe+'" opacity=".72"></rect>';
    if(id) s += '<rect class="hit" data-tip="'+id+'" data-nurhover="1" x="'+(i*(bw+gap)).toFixed(1)+'" y="0" width="'
      + bw.toFixed(1)+'" height="'+h+'"></rect>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px;display:block;margin-top:12px">'+s+'</svg>';
}
function jahreReihe(isos){
  var js = isos.map(function(x){ return +String(x||"").slice(0,4); }).filter(function(y){ return y>1900; });
  if(!js.length) return {von:null, bis:null, vals:[]};
  var von=Math.min.apply(null,js), bis=Math.max.apply(null,js), vals=[];
  for(var y=von;y<=bis;y++) vals.push(js.filter(function(x){ return x===y; }).length);
  return {von:von, bis:bis, vals:vals};
}

/* Erst die Kachelwand: dieselbe Anatomie wie «Heute» - Zahl, Untertitel, Bild, Fusszeile.
   Der Untertitel trägt das oberste Blatt, nicht bloss die Anzahl: die Kachel beantwortet
   damit beides, «wie viel liegt hier» und «muss ich hinein». */
function aktenUebersicht(){
  var PA = (STATE.lab.panels||[]).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var EV = (STATE.history.events||[]).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var P = STATE.lab.params||[], meds = (STATE.meds&&STATE.meds.liste)||[], rb = STATE.review||[];
  var flagsN = PA.reduce(function(n,p){ return n+Object.keys(p.flags||{}).length; }, 0);
  var pL = PA.length?PA[PA.length-1]:null;
  var lj = jahreReihe(PA.map(function(p){ return p.date; }));

  /* HbA1c ist die Reihe, die die Laborakte erzählt - darum steht sie in der Leitkachel. */
  var hb = PA.filter(function(p){ return p.values && p.values.hba1c!=null; })
    .map(function(p){ return {iso:p.date, v:+p.values.hba1c}; });
  var hbF = P.filter(function(x){ return x.key==="hba1c"; })[0];

  var pFlags = pL ? Object.keys(pL.flags||{}) : [];
  var pNamen = pFlags.map(function(k){ var f=P.filter(function(x){return x.key===k;})[0]; return f?f.label:k; });
  var labUnter = pL
    ? "Zuoberst "+dmy(pL.date)+(pL.source?", "+pL.source:"")
      + (pNamen.length ? " — "+pNamen.slice(0,2).join(" und ")+(pNamen.length>2?" und "+(pNamen.length-2)+" weitere":"")+" markiert" : " — kein Wert markiert")
    : "Noch kein Laborblatt erfasst.";

  /* Zuoberst heisst: das jüngste VERGANGENE. Ein Termin im September ist Zukunft und
     kein Befund - er gehört in die Statuszeile, nicht auf das Deckblatt der Akte. */
  var evVergangen = EV.filter(function(e){ return ms(e.date)<=heuteMs(); });
  var eL = evVergangen.length?evVergangen[evVergangen.length-1]:null;
  var ej = jahreReihe(EV.map(function(e){ return e.date; }));
  var arten = Object.keys(EV.reduce(function(m,e){ if(e.kind) m[e.kind]=1; return m; },{})).length;

  var mStand = STATE.meds&&STATE.meds.stand;
  var mAlter = mStand ? Math.round(tage(mStand)/30.4) : null;
  var taeglich = meds.filter(function(m){ return /^\s*\d\s*[–-]/.test(m.dosis||""); }).length;
  var reserve = meds.filter(function(m){ return /^\s*i\.\s*R\.?/i.test(m.dosis||""); }).length;
  var sonst = meds.length - taeglich - reserve;

  var rbS = rb.slice().sort(function(a,b){ return (a.weekIso||"")<(b.weekIso||"")?-1:1; });
  var rL = rbS.length?rbS[rbS.length-1]:null;
  var sterne = rbS.map(function(r){ return +r.stars||0; });
  var bewertet = sterne.filter(function(s){ return s>0; }).length;

  var RT = rohTage();
  var rj = jahreReihe(RT.map(function(z){ return z.iso; }));
  var heuteZ = RT.filter(function(z){ return z.iso===isoVon(new Date(heuteMs())); })[0];
  var offen = [];
  if(heuteZ){ if(heuteZ.bz==null) offen.push("Zucker"); if(!heuteZ.bp) offen.push("Druck"); if(heuteZ.bf==null) offen.push("Befinden"); }

  var h = '<div class="buehne">'
    + '<div class="b-kopf"><div><div class="k-name">Akten</div>'
    +   '<div style="font-size:24px;font-weight:640;letter-spacing:-.02em;margin-top:6px">Was liegt hier</div></div>'
    + '<button class="btn rund no-print" data-zu="1">×</button></div>'
    + '<div class="wand" style="margin-top:20px">';

  /* Leitkachel Labor */
  h += '<button class="kachel leit" data-akte="labor">'
    + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">'
    +   '<div class="k-name">Labor</div>'
    +   '<div class="k-meta" style="margin:0">'+P.length+' Parameter'+(lj.von?' · '+lj.von+'–'+lj.bis:'')+'</div></div>'
    + '<div class="k-reihe"><div class="k-zahl">'+PA.length+'</div><div class="k-einheit">Blätter</div>'
    +   (flagsN?'<div style="font-size:16px;color:var(--warn);font-weight:600;margin-left:6px">'+flagsN+' markierte Werte</div>':'')
    + '</div>'
    + '<div class="k-unter">'+esc(labUnter)+'</div>'
    + (hb.length>1
        /* In der Akte laeuft die Linie durch: zwischen zwei Laborterminen liegen Jahre, und
           eine Reihe aus lauter Bruchstuecken erzaehlt nichts. Die Luecke steht in den
           Jahresbalken der anderen Kacheln, wo sie die Aussage IST. */
        ? funkeSvg(funke(hb, "var(--akzent)", 700, 90, {voll:1e9, bruecke:1e9}), 700, 90,
            funkeHits(hb, 700, 90, {dez:1, einheit:hbF?hbF.unit:"%", sub:function(){ return "HbA1c"; }}))
          + '<div class="bildtext">HbA1c über '+hb.length+' Blätter, '+dmy(hb[0].iso)
          + ' bis '+dmy(hb[hb.length-1].iso)+' — die Reihe, die diese Akte erzählt.</div>'
        : '')
    + '</button>';

  h += '<div class="kacheln">';

  h += '<button class="kachel" data-akte="history">'
    + '<div class="k-name">Krankengeschichte</div>'
    + '<div class="k-reihe"><div class="k-zahl">'+EV.length+'</div><div class="k-einheit">Einträge</div></div>'
    + '<div class="k-unter">'+esc(eL ? "Zuoberst "+dmy(eL.date)+" — «"+(eL.title||"ohne Titel")+"»" : "Noch kein Eintrag.")+'</div>'
    + (ej.vals.length>1 ? balkenSvg(ej.vals, 260, 46, "var(--akzent)", function(i,v){
        return {tag:String(ej.von+i), wert:String(v), einheit:v===1?"Eintrag":"Einträge", sub:"", notiz:""}; }) : '')
    + '<div class="k-meta">'+(ej.von?ej.von+'–'+ej.bis+' · ':'')+zahl(arten,"Art","Arten")+'</div></button>';

  h += '<button class="kachel" data-akte="meds">'
    + '<div class="k-name">Medikation</div>'
    + '<div class="k-reihe"><div class="k-zahl">'+meds.length+'</div><div class="k-einheit">Präparate</div></div>'
    + '<div class="k-unter">'+esc(mStand
        ? "Plan vom "+dmy(mStand)+" — seit "+mAlter+" Monaten unverändert"
        : "Kein Stand vermerkt.")+'</div>'
    + '<div style="height:46px;margin-top:12px;display:flex;align-items:flex-end;gap:5px">'
    +   [].concat(
          Array.apply(null,Array(taeglich)).map(function(){ return '<div style="flex:1;height:18px;background:var(--akzent);opacity:.72;border-radius:2px"></div>'; }),
          Array.apply(null,Array(sonst>0?sonst:0)).map(function(){ return '<div style="flex:1;height:18px;background:var(--zweit);opacity:.5;border-radius:2px"></div>'; }),
          Array.apply(null,Array(reserve)).map(function(){ return '<div style="flex:1;height:18px;border:1px dashed var(--faint);border-radius:2px"></div>'; })
        ).join("")
    + '</div>'
    + '<div class="k-meta">'+taeglich+' täglich'+(sonst>0?' · '+sonst+' nach Plan':'')+(reserve?' · '+reserve+' in Reserve':'')+'</div></button>';

  h += '<button class="kachel" data-akte="review">'
    + '<div class="k-name">Rückblick</div>'
    + '<div class="k-reihe"><div class="k-zahl">'+rb.length+'</div><div class="k-einheit">'+(rb.length===1?"Woche":"Wochen")+'</div></div>'
    + '<div class="k-unter">'+esc(rL ? "Zuoberst "+(rL.kw||"")+" — «"+(rL.headline||"ohne Titel")+"»" : "Noch kein Rückblick.")+'</div>'
    + (sterne.length>1 ? balkenSvg(sterne, 260, 46, "var(--akzent)", function(i,v){
        return {tag:(rbS[i].kw||""), wert:"★".repeat(v), einheit:"", sub:rbS[i].headline||"", notiz:""}; }) : '')
    + '<div class="k-meta">'+zahl(bewertet,"Woche","Wochen")+' mit Bewertung</div></button>';

  h += '<button class="kachel" data-akte="roh">'
    + '<div class="k-name">Rohdaten</div>'
    + '<div class="k-reihe"><div class="k-zahl">'+RT.length+'</div><div class="k-einheit">Messtage</div></div>'
    + '<div class="k-unter">'+esc(heuteZ
        ? "Heute "+(heuteZ.gw!=null?nf(heuteZ.gw,1)+" kg":"noch nichts")+(offen.length?" — "+offen.join(", ")+" fehlen noch":" — alles erfasst")
        : "Heute noch nichts erfasst.")+'</div>'
    + (rj.vals.length>1 ? balkenSvg(rj.vals, 260, 46, "var(--akzent)", function(i,v){
        return {tag:String(rj.von+i), wert:String(v), einheit:v===1?"Messtag":"Messtage", sub:"", notiz:""}; }) : '')
    + '<div class="k-meta">'+(rj.von?'seit '+rj.von+' · ':'')+'CSV-Export</div></button>';

  return h + '</div></div></div>';
}

/* Der Rahmen: Inhalt links, Auswahl rechts — und rechts stehen die BLÄTTER, nicht die
   Bereiche. Ein Laborblatt, ein Jahr, eine Woche. Darum haengen die Dokumente am Blatt. */
function aktenRahmen(o){

    +   '<div style="font-size:24px;font-weight:640;letter-spacing:-.02em;margin-top:6px">'+esc(o.titel)+'</div>'
    +   (o.untertitel?'<div style="font-size:13.5px;color:var(--faint);margin-top:4px">'+esc(o.untertitel)+'</div>':'')
    + '</div><div style="display:flex;gap:8px;flex-wrap:wrap" class="no-print">'+(o.aktion||"")
    +   '<button class="btn rund" data-zu="akten">×</button></div></div>'
    + (o.ansichten||"")
    + '<div class="ts"><div class="ts-links">'+o.links+'</div>'

function lz(label, sub, an, attr){
  return '<button class="lz'+(an?" an":"")+'" '+attr+'><span>'+esc(label)+'</span><i>'+esc(sub||"")+'</i></button>';
}
function schalter(items){
  return '<div class="akten-liste no-print">'+items.map(function(s){
    return '<button class="sch'+(s.an?" an":"")+'" data-sicht="'+s.k+'">'+esc(s.t)+'</button>'; }).join("")+'</div>';
}

function zeichneAkten(){
  if(!UI.akte) return aktenUebersicht();
  if(UI.akte==="labor")   return akteLabor();
  if(UI.akte==="history") return akteHistory();
  if(UI.akte==="meds")    return akteMeds();
  if(UI.akte==="review")  return akteReview();
  if(UI.akte==="roh")     return akteRoh();
  return aktenUebersicht();
}

function akteLabor(){
  var P = STATE.lab.params||[];
  var PA = (STATE.lab.panels||[]).slice().sort(function(a,b){ return a.date<b.date?1:-1; });
  if(!PA.length) return aktenRahmen({bereich:"Labor", titel:"Noch keine Laborblätter", links:'<p class="satz">Sobald ein Blatt erfasst ist, steht es hier.</p>'});
  var sicht = UI.sicht || "blatt";
  var ans = schalter([ {k:"blatt", t:"Ein Blatt", an:sicht==="blatt"},
    {k:"verlauf", t:"Ein Wert über die Jahre", an:sicht==="verlauf"} ]);

  if(sicht==="blatt"){
    var i = Math.min(UI.blatt||0, PA.length-1), p = PA[i]||{}, vals = p.values||{}, refs = p.refs||{};
    var grp = {};
    P.forEach(function(pa){ if(vals[pa.key]==null) return;
      (grp[pa.group||"Übrige"] = grp[pa.group||"Übrige"]||[]).push(pa); });
    var links = '<div class="blatt">';
    Object.keys(grp).forEach(function(g){
      links += '<div class="bz-row grp"><div>'+esc(g)+'</div><div></div><div></div></div>';
      grp[g].forEach(function(pa){
        var v = vals[pa.key], ref = refs[pa.key] || pa.ref;
        var kl = ref ? (v>ref[1] ? "hoch" : (v<ref[0] ? "tief" : "")) : "";
        links += '<div class="bz-row"><div>'+esc(pa.label)
          + (pa.unit?' <span style="color:var(--faint)">'+esc(pa.unit)+'</span>':'')+'</div>'
          + '<div class="w '+kl+'">'+nf(v, Math.abs(v)>=100?0:1)+'</div>'

function akteReview(){
  var R = STATE.review||[];
  if(!R.length) return aktenRahmen({bereich:"Rückblick", titel:"Noch kein Rückblick", links:'<p class="satz">Sobald eine Woche erfasst ist, steht sie hier.</p>'});
  var i = Math.min(UI.blatt||0, R.length-1), r = R[i]||{};
  /* Ein ganzzeiliges **X** ist eine Ueberschrift — daran haengt die Gliederung der
     Wochenziele. Nur die Sternchen zu streichen macht aus einer Struktur eine Textwand. */
  function md(t){
    return String(t||"").split("\n").map(function(z){ return z.trim(); })
      .filter(function(z){ return z!==""; })
      .map(function(z){
        var k = /^\*\*(.+?)\*\*:?$/.exec(z);
        if(k) return '<h4 style="margin:16px 0 4px;font-size:15px;font-weight:660">'+esc(k[1])+'</h4>';
        if(z.indexOf("- ")===0) return '<div style="display:flex;gap:9px;padding:2px 0 2px 4px">'
          + '<span style="color:var(--akzent)">·</span><span>'+esc(z.slice(2).replace(/\*\*/g,""))+'</span></div>';
        return '<p style="margin:8px 0 0">'+esc(z.replace(/\*\*/g,""))+'</p>';
      }).join("");
  }
  return aktenRahmen({ bereich:"Rückblick", titel:r.headline||("Woche "+(r.kw||"")),
    untertitel:(r.kw||"")+" · "+"★".repeat(r.stars||0)+"☆".repeat(5-(r.stars||0)),
    links:'<div class="rb-txt" style="font-size:14.5px;color:var(--muted)">'+md(r.desc)
      + (r.analyse?'<h4 style="margin:22px 0 4px;font-size:15px;font-weight:660">Analyse</h4>'+md(r.analyse):'')+'</div>',
    listeKopf:zahl(R.length,"Woche","Wochen"),
    liste:R.map(function(x,n){ return lz(x.kw||"—", "★".repeat(x.stars||0), n===i, 'data-blatt="'+n+'"'); }).join("") });
}

function rohTage(){
  var T = {};
  function merk(iso){ return T[iso] = T[iso] || {iso:iso}; }
  rGewicht().forEach(function(x){ var z=merk(x.iso); z.gw = x.v; if(x.note) (z.nz=z.nz||[]).push(x.note); });
  rBzTage().forEach(function(x){ var z=merk(x.iso); z.bz = x.v; z.bzn = x.n; if(x.note) (z.nz=z.nz||[]).push(x.note); });
  rBp().forEach(function(x){ var z=merk(x.iso); (z.bp = z.bp||[]).push(Math.round(x.v)+"/"+Math.round(x.dia));
    if(x.note) (z.nz=z.nz||[]).push(x.note); });
  rBefinden().forEach(function(x){ var z=merk(x.iso); z.bf = x.idx; if(x.note) (z.nz=z.nz||[]).push(x.note); });
  return Object.keys(T).sort().reverse().map(function(k){ var z=T[k];
    z.notiz = z.nz ? z.nz.join(" · ") : ""; return z; });
}

function csvExport(){

      z.bp?z.bp.join(" "):"", z.bf!=null?nf(z.bf,1):"",
      String(z.notiz||"").replace(/[;\r\n]/g," ")].join(";"); });
  var txt = "\ufeff"+kopf.join(";")+"\r\n"+zeilen.join("\r\n")+"\r\n";

  document.body.appendChild(a); a.click(); a.remove();
}

/* ══ Erfassen ═══════════════════════════════════════════════════════════════════
   Eine Liste, nicht eine Seite. Offen ist immer nur eine Zeile - von selbst die erste,
   die an diesem Tag noch fehlt. Tag und Woche sind zwei Abschnitte: Trinken und
   Verdauung gelten fuer die ganze Woche und stehen darum erst am Sonntag offen. */
function erfIso(){ return isoVon(new Date(heuteMs() - UI.erfTag*86400000)); }
function erfHat(reihe){ var iso=erfIso(); return reihe.some(function(x){ return x.iso===iso; }); }
function tv(k){ var v=UI.erfWerte[k]; return v==null?"":String(v); }
function num(s){ if(s==null) return null; s=String(s).trim().replace(",","."); return s===""?null:(isFinite(+s)?+s:null); }

/* Notiz einer Kachel: Kuerzel und Freitext ergeben EINEN Text. Was gespeichert wird, ist
   das, was hier herauskommt - es gibt keine zweite Fassung, die auseinanderlaufen koennte. */
function kuerzelAn(k){ return UI.erfKuerzel[k]||[]; }
function notizText(k){
  return [kuerzelAn(k).join(" · "), String(UI.erfWerte["note_"+k]||"").trim()].filter(Boolean).join(" · ");
}
function notizBlock(k){
  return '<div class="lbl" style="margin-top:16px">Notiz</div>'
    + '<div class="kuerzel">'+(KUERZEL[k]||[]).map(function(x){
        var an = kuerzelAn(k).indexOf(x)>=0;
        return '<button class="kz-knopf'+(an?" an":"")+'" data-kuerzel="'+k+'" data-kw="'+esc(x)+'">'+esc(x)+(an?" ✓":"")+'</button>'; }).join("")
    + '</div>'
    + '<textarea class="notiz" data-w="note_'+k+'" placeholder="und was Du sonst festhalten willst…" '
    + 'style="margin-top:9px">'+esc(UI.erfWerte["note_"+k]||"")+'</textarea>';
}

function zeichneErf(){
  var iso = erfIso(), wt = new Date(iso+"T12:00:00").getDay();
  var TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var wochenende = (wt===0 || wt===1);
  var G=rGewicht(), BZT=rBzTage(), BP=rBp(), BF=rBefinden();
  var auf = UI.erfAuf==="auto"
    ? (!erfHat(G)?"gw":(!erfHat(BZT)?"bz":(!erfHat(BP)?"bd":(!erfHat(BF)?"bf":null)))) : UI.erfAuf;
  var dims = befDims();
  var gE = G.filter(function(x){return x.iso===iso;})[0], bzE = BZT.filter(function(x){return x.iso===iso;})[0];
  var bpT = BP.filter(function(x){return x.iso===iso;}), bfE = BF.filter(function(x){return x.iso===iso;})[0];
  var bzNeu = SLOT3.filter(function(s,i){ return tv("bz"+i)!==""; }).length;
  var bpNeu = UI.erfBp.filter(function(r){ return String(r.sys).trim()!=="" || String(r.dia).trim()!==""; }).length;
  var bfNeu = dims.filter(function(d){ return UI.erfWerte["bf_"+d.key]!=null; }).length;

  /* Eine Kachel traegt den heutigen Stand, nicht bloss ihren Namen: erledigt zeigt den
     Wert, offen ein Plus. Die offene Kachel waechst an Ort und Stelle auf volle Breite -
     es bleibt bei einer offenen Kachel, damit der Daumen weiss, wo er ist. */
  function kachel(k, name, wert, gruen, sub, koerper){
    if(auf===k) return '<div class="ek offen" style="grid-column:1/-1">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">'
      +   '<div class="k-name" style="color:var(--akzent)">'+esc(name)+'</div>'
      +   '<button class="btn" data-erf="'+k+'" style="padding:4px 10px;font-size:13px">zuklappen</button></div>'
      + koerper + '</div>';
    return '<button class="ek'+(gruen?" fertig":"")+'" data-erf="'+k+'">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
      +   '<div class="k-name">'+esc(name)+'</div>'+(gruen?'<div style="color:var(--good);font-size:14px">✓</div>':'')+'</div>'
      + '<div style="display:flex;align-items:baseline;gap:6px;margin-top:8px">'
      +   (wert ? '<div class="ek-wert"'+(gruen?' style="color:var(--good)"':'')+'>'+esc(wert)+'</div>'
               : '<div class="ek-plus">+</div><div style="font-size:14px;color:var(--muted)">noch nicht</div>')
      + '</div>'
      + '<div class="ek-sub">'+esc(sub||"")+'</div></button>';
  }
  function feld(k, lbl, ph){
    return '<div class="feld"><div class="lbl">'+esc(lbl)+'</div>'
      + '<input type="text" inputmode="decimal" data-w="'+k+'" value="'+esc(tv(k))+'" placeholder="'+esc(ph||"")+'"></div>';
  }

  var h = '<div class="buehne"><div class="b-kopf"><div>'
    + '<div class="k-name">Erfassen</div>'
    + '<div style="display:flex;align-items:center;gap:10px;margin-top:6px">'
    +   '<button class="btn" data-tag="-1" title="einen Tag nachtragen" style="width:34px;height:34px;padding:0">‹</button>'
    +   '<div style="font-size:22px;font-weight:640;min-width:210px">'+(UI.erfTag===0?"heute · ":"")+dmy(iso)+'</div>'
    +   '<button class="btn" data-tag="1" style="width:34px;height:34px;padding:0'
    +     (UI.erfTag===0?';opacity:.35;cursor:default" disabled':'"')+'>›</button>'
    + '</div></div><button class="btn rund" data-zu="1">×</button></div>'
    + '<div style="font-size:13.5px;color:var(--faint);margin-top:8px">'
    +   (UI.erfTag===0
          ? "Mit ‹ einen Tag zurück, um Vergessenes nachzutragen. Die Zukunft ist gesperrt."
          : "Du trägst "+TAGE[wt]+", den "+dmy(iso)+" nach — "+zahl(UI.erfTag,"Tag","Tage")+" zurück.")
    + '</div>'
    + '<div class="abschnitt erste">Der Tag · '+TAGE[wt]+'</div>'
    + '<div class="kacheln" style="margin-top:14px">';

  h += kachel("gw", "Gewicht",
    tv("gewicht") ? tv("gewicht")+" kg" : (gE?nf(gE.v,1)+" kg":""),
    !!gE && !tv("gewicht"),
    gE ? (gE.note||"heute erfasst") : (G.length?"zuletzt "+dmy(G[G.length-1].iso)+" · "+nf(G[G.length-1].v,1)+" kg":""),
    '<div style="display:flex;align-items:center;gap:10px;margin-top:12px">'
    + '<input type="text" inputmode="decimal" data-w="gewicht" value="'+esc(tv("gewicht"))+'" placeholder="112,8" style="width:130px">'
    + '<div style="font-size:14.5px;color:var(--faint)">kg</div></div>'
    + notizBlock("gw"));

  h += kachel("bz", "Blutzucker",
    bzNeu ? zahl(bzNeu,"Wert","Werte") : (bzE?nf(bzE.v,1):""),
    !!bzE && !bzNeu,

/* Schreiben: an dieselben Stellen, aus denen gelesen wird. Tageswerte auf das Datum,
   Wochenwerte auf ihren Wochenanker - Trinkmenge und Verdauung auf den MONTAG (so
   liegen sie in der Datei), Fitbit auf den SONNTAG, der die Woche beschliesst. */
function montagVon(iso){ var d=new Date(iso+"T12:00:00"), w=(d.getDay()+6)%7;
  d.setDate(d.getDate()-w); return isoVon(d); }
function sonntagVon(iso){ var d=new Date(iso+"T12:00:00"), w=(d.getDay()+6)%7;
  d.setDate(d.getDate()+(6-w)); return isoVon(d); }
function punktSetzen(liste, schluessel, iso, felder){
  var p = liste.filter(function(x){ return x[schluessel]===iso; })[0];
  if(!p){ p={}; p[schluessel]=iso; liste.push(p); }
  for(var k in felder) if(felder[k]!=null) p[k]=felder[k];
  liste.sort(function(a,b){ return a[schluessel]<b[schluessel]?-1:1; });
  return p;
}

async function speichern(){
  /* Erst pruefen, dann rechnen, dann schreiben - und die Mutationen laufen auf einer
     KOPIE. Der erste Anlauf hat STATE sofort geaendert und danach gemeldet «es wurde
     nichts geschrieben»: die Kacheln zeigten den Wert als erfasst, im Repo stand er
     nicht. Ein Werkzeug, das ueber den eigenen Datenstand luegt, ist schlimmer als
     eines, das nicht speichert. */
  if(!CFG || !CFG.repo || !CFG.token)
    return meldung("Nicht verbunden — bitte zuerst über ⚙ den Datenspeicher verbinden. Es wurde nichts geändert.", true);
  var iso = erfIso(), W = UI.erfWerte, geschrieben = 0;
  var N = JSON.parse(JSON.stringify(STATE));
  N.weight = N.weight||{points:[]}; N.weight.points = N.weight.points||[];
  N.glucose = N.glucose||{days:[]}; N.glucose.days = N.glucose.days||[];
  N.bloodpressure = N.bloodpressure||{points:[]}; N.bloodpressure.points = N.bloodpressure.points||[];
  N.befinden = N.befinden||{entries:[]}; N.befinden.entries = N.befinden.entries||[];
  N.body = N.body||{points:[]}; N.body.points = N.body.points||[];
  N.fluid = N.fluid||{weeks:[]}; N.fluid.weeks = N.fluid.weeks||[];
  N.digestion = N.digestion||{weeks:[]}; N.digestion.weeks = N.digestion.weeks||[];
  N.fitbit = N.fitbit||{weeks:[]}; N.fitbit.weeks = N.fitbit.weeks||[];

  var g = num(W.gewicht), nGw = notizText("gw");
  if(g!=null){ punktSetzen(N.weight.points, "date", iso, {value:g, note:nGw||null}); geschrieben++; }

  /* Drei Messpunkte. Die alten Namen bleiben in der Datei stehen - was einmal als
     «nach Frühstück» erfasst wurde, heisst dort weiter so; nur Neues kommt in die drei.
     slots und slotType werden mitgeführt, damit die Datei sich selbst erklärt. */
  N.glucose.slots = N.glucose.slots||[];
  N.glucose.slotType = N.glucose.slotType||{};
  SLOT3.forEach(function(s){
    if(N.glucose.slots.indexOf(s.k)<0) N.glucose.slots.push(s.k);
    N.glucose.slotType[s.k] = s.t;
  });
  var neueRows = [], jetzt = new Date(), zeit = String(jetzt.getHours()).padStart(2,"0")+":"+String(jetzt.getMinutes()).padStart(2,"0");
  SLOT3.forEach(function(s,i){ var v=num(W["bz"+i]); if(v!=null) neueRows.push({slot:s.k, values:[{v:v, t:zeit}]}); });
  var nBz = notizText("bz");
  if(neueRows.length){
    var tag = N.glucose.days.filter(function(d){ return d.iso===iso; })[0];
    if(!tag){ tag={iso:iso, date:dm(iso), rows:[]}; N.glucose.days.push(tag);
      N.glucose.days.sort(function(a,b){ return a.iso<b.iso?-1:1; }); }
    tag.rows = tag.rows||[];
    if(nBz) tag.note = [tag.note, nBz].filter(Boolean).join(" · ");
    neueRows.forEach(function(nr){
      var r = tag.rows.filter(function(x){ return x.slot===nr.slot; })[0];
      if(r){ r.values = (r.values||[]).concat(nr.values); } else { tag.rows.push(nr); }
      geschrieben++;
    });
  }

  var nBdKuerzel = kuerzelAn("bd").join(" · ");
  UI.erfBp.forEach(function(r){
    var sys=num(r.sys), dia=num(r.dia);
    if(sys==null || dia==null) return;
    /* Dieselbe Messung zweimal am selben Tag ist moeglich - dieselben ZAHLEN zweimal
       sind aber fast immer ein zweiter Klick auf Speichern. */
    if(N.bloodpressure.points.some(function(p){ return p.iso===iso && +p.sys===sys && +p.dia===dia; })) return;
    var p = {iso:iso, sys:sys, dia:dia};
    var pl = num(r.puls); if(pl!=null) p.pulse = pl;
    var note = [nBdKuerzel, String(r.note||"").trim()].filter(Boolean).join(" · ");
    if(note) p.note = note;
    N.bloodpressure.points.push(p);
    geschrieben++;
  });
  N.bloodpressure.points.sort(function(a,b){ return a.iso<b.iso?-1:1; });

  var dims = befDims(), bfFelder = {};
  dims.forEach(function(d){ if(W["bf_"+d.key]!=null) bfFelder[d.key] = W["bf_"+d.key]; });
  var nBf = notizText("bf");
  if(Object.keys(bfFelder).length){
    if(nBf) bfFelder.note = nBf;
    punktSetzen(N.befinden.entries, "iso", iso, bfFelder); geschrieben++;
  }

  var kf = {chest:num(W.brust), waist:num(W.taille), hip:num(W.huefte)};
  if(kf.chest!=null || kf.waist!=null || kf.hip!=null){ punktSetzen(N.body.points, "date", iso, kf); geschrieben++; }

  if(W.trinken!=null){ punktSetzen(N.fluid.weeks, "weekStart", montagVon(iso), {goalMet:W.trinken===1}); geschrieben++; }
  if(W.verdauung!=null){ punktSetzen(N.digestion.weeks, "weekStart", montagVon(iso), {stars:+W.verdauung}); geschrieben++; }

  var sl=num(W.schlaf), st=num(W.schritte), rh=num(W.rhr);
  if(sl!=null || st!=null || rh!=null){
    var wk = punktSetzen(N.fitbit.weeks, "weekStart", sonntagVon(iso), {});
    if(sl!=null){ wk.sleep = wk.sleep||{}; wk.sleep.avgH = sl; }
    if(st!=null){ wk.steps = wk.steps||{}; wk.steps.avg = st; }
    if(rh!=null){ wk.rhr = wk.rhr||{}; wk.rhr.avg = rh; }
    geschrieben++;
  }

  if(!geschrieben) return meldung("Nichts eingetippt — es wurde nichts geschrieben.", true);
  N.updated = dmy(isoVon(new Date(heuteMs())));
  var ok;
  try{ ok = await ghSchreiben(N, false); }
  catch(e){ return meldung("Speichern fehlgeschlagen: "+(e&&e.message||e)+". Es wurde nichts geändert.", true); }
  if(ok!==true) return false;   // STATE bleibt unangetastet, der Entwurf steht noch da
  UI.erfWerte = {}; UI.erfBp = [{sys:"",dia:"",puls:"",note:""}]; UI.erfAuf = "auto"; UI.erfKuerzel = {};
  zustandSetzen(N);
  return meldung(zahl(geschrieben,"Eintrag","Einträge")+" unter dem "+dmy(iso)+" gespeichert.");
}

var EXP_BEREICHE = [ {k:"gewicht",t:"Gewicht"}, {k:"bz",t:"Blutzucker"}, {k:"bd",t:"Blutdruck"},

EXP_BEREICHE.forEach(function(b){ EXP_AN[b.k]=true; });

function exportModal(){

    + EXP_BEREICHE.map(function(b){

    +   '<button class="schieber'+(EXP_DOCS?" an":"")+'"><span class="knopf"></span></button></div>'
    + '<button class="btn stark" id="btnExpGo" style="margin-top:18px;width:100%">Kopie erzeugen</button>'
